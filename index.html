          html += badgeHtml(cat, 34);
          html += '<div class="main"><div class="title">' + (t.needsReview ? '<span class="review-dot" title="Imported from a screenshot - check this transaction"></span>' : '') + escapeHtml(t.merchant) + '</div>';
          html += '<div class="meta">' + (cat ? escapeHtml(cat.name) : "Uncategorized") + (t.bankCard ? " · " + escapeHtml(t.bankCard) : "") + (t.note ? " · " + escapeHtml(t.note) : "") + '</div></div>';
          html += '<div class="amount num' + (t.type === "income" ? " income" : "") + '">' + (t.type === "income" ? "+" : "") + fmtMoney(t.amount) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      });

      // Totals for whatever's currently filtered - transfers and goal
      // contributions are excluded from Spent/Income here too, same as the
      // Dashboard, since neither is real spending or income.
      var realList = list.filter(function (t) { return !t.isTransfer && !t.isGoalContribution; });
      var filteredSpent = realList.filter(function (t) { return t.type === "expense"; }).reduce(function (s, t) { return s + t.amount; }, 0);
      var filteredIncome = realList.filter(function (t) { return t.type === "income"; }).reduce(function (s, t) { return s + t.amount; }, 0);
      html += '<div class="card"><div class="footnote" style="margin:0 0 10px">' + list.length + (list.length === 1 ? " transaction" : " transactions") + '</div>';
      html += '<div class="stat-row">';
      html += '<div class="stat spent"><div class="label">Spent</div><div class="value num">' + fmtMoney(filteredSpent) + '</div></div>';
      html += '<div class="stat income"><div class="label">Income</div><div class="value num">' + fmtMoney(filteredIncome) + '</div></div>';
      html += '<div class="stat net"><div class="label">Net</div><div class="value num">' + fmtMoney(filteredIncome - filteredSpent) + '</div></div>';
      html += '</div></div>';
    }

    document.getElementById("tab-transactions").innerHTML = html;

    if (searchHadFocus) {
      var searchEl = document.getElementById("tx-search");
      searchEl.focus();
      if (searchCaret !== null) searchEl.setSelectionRange(searchCaret, searchCaret);
    }

    document.getElementById("tx-search").addEventListener("input", function (e) { txSearch = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-cat").addEventListener("change", function (e) { txFilterCat = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-bank").addEventListener("change", function (e) { txFilterBank = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-month").addEventListener("change", function (e) { txFilterMonth = e.target.value; renderTransactions(); });
    document.getElementById("tx-import-btn").addEventListener("click", function () {
      document.getElementById("tx-import-input").click();
    });
    document.getElementById("tx-import-input").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = ""; // allow re-selecting the same file next time
      if (file) importTransactionsFromScreenshot(file);
    });
    document.getElementById("tx-import-text-btn").addEventListener("click", openTextImportForm);
    document.querySelectorAll("#tab-transactions [data-open-tx]").forEach(function (el) {
      el.addEventListener("click", function () { openTransactionForm(el.getAttribute("data-open-tx")); });
    });
    document.querySelectorAll("#tab-transactions [data-open-transfer]").forEach(function (el) {
      el.addEventListener("click", function () { openTransferDetail(el.getAttribute("data-open-transfer")); });
    });
  }

  /* ---------- render: recurring ---------- */

  var recurringSortMode = "date";
  var recurringFilterCat = "";
  var recurringFilterBank = "";
  var recurringArchiveOpen = false;

  function sortRecurring(list) {
    var sorted = list.slice();
    if (recurringSortMode === "amount") {
      sorted.sort(function (a, b) { return a.amount - b.amount; });
    } else {
      sorted.sort(function (a, b) { return a.nextDueDate < b.nextDueDate ? -1 : (a.nextDueDate > b.nextDueDate ? 1 : 0); });
    }
    return sorted;
  }

  function renderRecurring() {
    var filtered = state.recurring.slice();
    if (recurringFilterCat) filtered = filtered.filter(function (r) { return r.categoryId === recurringFilterCat; });
    if (recurringFilterBank) filtered = filtered.filter(function (r) { return r.bankCard === recurringFilterBank; });

    // Archived covers both a manually-paused item (the Edit form's "Active"
    // toggle) and one that just reached its own end date via markPaid() -
    // either way, isActive: false means nothing left to project or collect
    // payment on, so it moves out of the main lists into the collapsed
    // Archived section below rather than sitting in the active list
    // forever still advancing nextDueDate past its own end date.
    var active = filtered.filter(function (r) { return r.isActive; });
    var archived = filtered.filter(function (r) { return !r.isActive; });

    var fixed = sortRecurring(active.filter(function (r) { return r.kind === "fixed"; }));
    var subs = sortRecurring(active.filter(function (r) { return r.kind === "subscription"; }));
    var income = sortRecurring(active.filter(function (r) { return r.kind === "income"; }));
    // Reflects whatever's currently filtered, same as the Transactions tab's
    // filtered total - not every recurring item regardless of the filters.
    // Outgoing and income are kept as two separate figures rather than one
    // net number, so this reads the same way as the rest of the app (Spent
    // vs Income on the dashboard) instead of inventing a new convention.
    var monthlyOut = active.filter(function (r) { return r.kind !== "income"; }).reduce(function (s, r) { return s + monthlyEquivalent(r); }, 0);
    var monthlyIn = active.filter(function (r) { return r.kind === "income"; }).reduce(function (s, r) { return s + monthlyEquivalent(r); }, 0);

    var html = '<div class="card card-ledger"><div class="disclosure"' + (income.length ? ' style="margin-bottom:8px"' : '') + '><span style="font-weight:600">Monthly total</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(monthlyOut) + '</span></div>';
    if (income.length) html += '<div class="disclosure"><span style="font-weight:600">Monthly income</span><span class="num" style="font-size:18px;font-weight:700;color:var(--good)">+' + fmtMoney(monthlyIn) + '</span></div>';
    html += '</div>';

    if (state.recurring.length) {
      html += '<select id="recurring-filter-cat" style="margin-bottom:10px">';
      html += '<option value="">All categories</option>';
      state.categories.forEach(function (c) {
        html += '<option value="' + c.id + '"' + (recurringFilterCat === c.id ? " selected" : "") + '>' + escapeHtml(c.name) + '</option>';
      });
      html += '</select>';

      html += '<select id="recurring-filter-bank" style="margin-bottom:14px">';
      html += '<option value="">All banks / cards</option>';
      allBankCards().forEach(function (bc) {
        html += '<option value="' + escapeAttr(bc) + '"' + (recurringFilterBank === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
      });
      html += '</select>';

      html += '<div class="segmented" id="recurring-sort-seg" style="margin-bottom:14px">';
      html += '<button type="button" data-val="date" class="' + (recurringSortMode === "date" ? "active" : "") + '">Date: Nearest first</button>';
      html += '<button type="button" data-val="amount" class="' + (recurringSortMode === "amount" ? "active" : "") + '">Amount: Low to high</button>';
      html += '</div>';
    }

    if (!active.length) {
      html += state.recurring.length
        ? emptyState("refresh", "No matches", "Try a different category or bank/card filter.")
        : emptyState("refresh", "No recurring payments", "Add fixed bills, subscriptions, or recurring income like a salary to track them here.");
    } else {
      if (fixed.length) html += '<div class="section-title">Fixed Payments</div>' + recurringList(fixed);
      if (subs.length) html += '<div class="section-title">Subscriptions</div>' + recurringList(subs);
      if (income.length) html += '<div class="section-title">Income</div>' + recurringList(income);
    }

    if (archived.length) {
      html += '<div class="disclosure" id="recurring-archive-toggle" style="margin-top:4px;cursor:pointer"><span style="font-weight:600;color:var(--ink-2)">Archived (' + archived.length + ')</span><span class="icon-btn ghost" style="width:26px;height:26px;transform:rotate(' + (recurringArchiveOpen ? "90deg" : "0deg") + ')">' + icon("chevron") + '</span></div>';
      if (recurringArchiveOpen) html += '<div class="section-title">Archived</div>' + recurringList(sortRecurring(archived), true);
    }

    document.getElementById("tab-recurring").innerHTML = html;

    document.querySelectorAll("#tab-recurring [data-open-recurring]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-mark-paid], [data-delete-archived]")) return;
        openRecurringForm(el.getAttribute("data-open-recurring"));
      });
    });
    document.querySelectorAll("#tab-recurring [data-mark-paid]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openMarkPaidConfirm(el.getAttribute("data-mark-paid"));
      });
    });
    document.querySelectorAll("#tab-recurring [data-delete-archived]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = el.getAttribute("data-delete-archived");
        var r = byId(state.recurring, id);
        confirmAction('Delete "' + (r ? r.name : "this item") + '"? Its past transactions are kept, but this entry itself is removed for good.', "Delete", function () {
          state.recurring = state.recurring.filter(function (x) { return x.id !== id; });
          save(); renderAll();
        });
      });
    });
    document.querySelectorAll("#recurring-sort-seg button").forEach(function (b) {
      b.addEventListener("click", function () { recurringSortMode = b.getAttribute("data-val"); renderRecurring(); });
    });
    var filterCatEl = document.getElementById("recurring-filter-cat");
    if (filterCatEl) filterCatEl.addEventListener("change", function (e) { recurringFilterCat = e.target.value; renderRecurring(); });
    var filterBankEl = document.getElementById("recurring-filter-bank");
    if (filterBankEl) filterBankEl.addEventListener("change", function (e) { recurringFilterBank = e.target.value; renderRecurring(); });
    var archiveToggle = document.getElementById("recurring-archive-toggle");
    if (archiveToggle) archiveToggle.addEventListener("click", function () { recurringArchiveOpen = !recurringArchiveOpen; renderRecurring(); });
  }

  function openMarkPaidConfirm(id) {
    var r = byId(state.recurring, id);
    if (!r) return;
    var isIncome = r.kind === "income";

    var html = '<div class="modal-head"><h3>' + (isIncome ? "Mark as Received" : "Mark as Paid") + '</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2);margin:0 0 16px">' + escapeHtml(r.name) + ' · ' + fmtMoney(r.amount) + '</p>';
    html += '<div class="field"><label>' + (isIncome ? "Received into" : "Paid with") + '</label><select name="bankCard" id="mark-paid-bank"><option value="">None</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (r.bankCard === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select></div>';
    html += '<button type="button" class="btn primary" data-confirm-paid>' + (isIncome ? "Confirm Receipt" : "Confirm Payment") + '</button>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelector("[data-confirm-paid]").addEventListener("click", function () {
      var bankCard = document.getElementById("mark-paid-bank").value || null;
      markPaid(id, bankCard);
      closeModal();
    });
  }

  function recurringList(list, archived) {
    var html = '<div class="card" style="padding:4px 16px;margin-bottom:14px">';
    list.forEach(function (r) {
      var cat = byId(state.categories, r.categoryId);
      var isIncome = r.kind === "income";
      var hasEnded = r.endDate && r.nextDueDate > r.endDate;
      var statusText = archived
        ? (hasEnded ? "ended " + fmtDateShort(r.endDate) : "paused")
        : ("due " + fmtDateShort(r.nextDueDate) + (r.endDate ? " · ends " + fmtDateShort(r.endDate) : ""));
      html += '<div class="row" data-open-recurring="' + r.id + '" style="opacity:' + (archived ? 0.55 : 1) + '">';
      html += badgeHtml(cat, 34);
      html += '<div class="main"><div class="title">' + escapeHtml(r.name) + '</div><div class="meta">' + (FREQUENCY_LABELS[r.frequency] || capitalize(r.frequency)) + ' · ' + statusText +
        (r.bankCard ? ' · ' + escapeHtml(r.bankCard) : '') + '</div></div>';
      html += '<div class="amount num' + (isIncome ? " income" : "") + '">' + (isIncome ? "+" : "") + fmtMoney(r.amount) + '</div>';
      if (archived) html += '<button class="icon-btn ghost" data-delete-archived="' + r.id + '" aria-label="Delete" style="width:30px;height:30px">' + icon("trash") + '</button>';
      else html += '<button class="icon-btn ghost tick-btn" data-mark-paid="' + r.id + '" aria-label="' + (isIncome ? "Mark as received" : "Mark as paid") + '" style="width:30px;height:30px">' + icon("check") + '</button>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function markPaid(id, bankCard) {
    var r = byId(state.recurring, id);
    if (!r) return;
    var isIncome = r.kind === "income";
    state.transactions.push({
      id: uid(), amount: r.amount, merchant: r.name,
      note: isIncome ? "Recurring income" : "Recurring payment",
      date: todayISO(), type: isIncome ? "income" : "expense",
      categoryId: r.categoryId, bankCard: bankCard || null
    });
    r.bankCard = bankCard || null;
    r.nextDueDate = addInterval(r.nextDueDate, r.frequency);
    // If this payment had an end date and the occurrence just logged was
    // the last one on or before it, there's nothing left to project
    // forward to - archive it (isActive: false, same field the manual
    // pause toggle already uses) instead of leaving it in the active list
    // forever still advancing nextDueDate past its own end date.
    if (r.endDate && r.nextDueDate > r.endDate) r.isActive = false;
    assignCategorySlots();
    save();
    renderAll();
  }

  /* ---------- render: loans ---------- */

  function loanProgress(loan) {
    var amountPaid = Math.min(loan.paymentsMade * loan.monthlyPayment, loan.totalAmount);
    var balance = Math.max(loan.totalAmount - amountPaid, 0);
    var pct = loan.totalAmount > 0 ? Math.min(amountPaid / loan.totalAmount, 1) : 0;
    var estTotalPayments = loan.monthlyPayment > 0 ? Math.ceil(loan.totalAmount / loan.monthlyPayment) : loan.paymentsMade;
    return { amountPaid: amountPaid, balance: balance, pct: pct, estTotalPayments: estTotalPayments, isPaidOff: balance <= 0 };
  }

  function renderLoans() {
    var html = "";
    if (!state.loans.length) {
      html += emptyState("trend-down", "No loans tracked", "Add a car payment, personal loan, or other long-term debt to track its payoff progress.");
    } else {
      var totalBalance = state.loans.filter(function (l) { return l.isActive; }).reduce(function (s, l) { return s + loanProgress(l).balance; }, 0);
      // Excludes paid-off loans, even ones the user hasn't gotten around to
      // toggling Active off for - a loan with nothing left to pay has no
      // ongoing monthly obligation regardless of that flag.
      var totalMonthly = state.loans.filter(function (l) { return l.isActive && !loanProgress(l).isPaidOff; }).reduce(function (s, l) { return s + l.monthlyPayment; }, 0);
      html += '<div class="card card-ledger"><div class="disclosure" style="margin-bottom:8px"><span style="font-weight:600">Total balance remaining</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(totalBalance) + '</span></div>';
      html += '<div class="disclosure"><span style="font-weight:600">Monthly total</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(totalMonthly) + '</span></div></div>';
      html += '<div class="card" style="padding:4px 16px">';
      state.loans.forEach(function (loan) { html += loanCard(loan); });
      html += '</div>';
    }

    document.getElementById("tab-loans").innerHTML = html;

    document.querySelectorAll("#tab-loans [data-open-loan]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-mark-loan-paid]")) return;
        openLoanForm(el.getAttribute("data-open-loan"));
      });
    });
    document.querySelectorAll("#tab-loans [data-mark-loan-paid]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openLoanMarkPaidConfirm(el.getAttribute("data-mark-loan-paid"));
      });
    });
  }

  function loanDetailRow(label, amount, sub, extra) {
    var html = '<div class="loan-detail-row"><span class="label">' + escapeHtml(label) + '</span>';
    html += '<div class="value-wrap">';
    html += '<span class="value"><span class="num">' + fmtMoney(amount) + '</span>';
    if (sub) html += '<span class="sub">' + escapeHtml(sub) + '</span>';
    html += '</span>';
    if (extra) html += extra;
    html += '</div></div>';
    return html;
  }

  function loanCard(loan) {
    var p = loanProgress(loan);
    var d = daysUntil(loan.nextPaymentDate);
    var remainingInstallments = Math.max(p.estTotalPayments - loan.paymentsMade, 0);

    var html = '<div data-open-loan="' + loan.id + '" style="margin-bottom:16px;opacity:' + (loan.isActive ? 1 : 0.5) + '">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">';
    html += '<span style="font-size:14.5px;font-weight:600">' + escapeHtml(loan.name) + '</span>';
    if (p.isPaidOff) html += '<span class="chip milestone">' + icon("check") + 'Paid Off</span>';
    else if (d <= 3) html += dueChip(d);
    html += '</div>';
    html += '<div class="bar-track"><div class="bar-fill" style="background:var(--accent);width:' + (p.pct * 100) + '%"></div></div>';

    html += '<div class="loan-details">';
    html += loanDetailRow("Loan amount", loan.totalAmount);
    html += loanDetailRow("Paid", p.amountPaid, loan.paymentsMade + (loan.paymentsMade === 1 ? " installment" : " installments"));
    html += loanDetailRow("Balance", p.balance, remainingInstallments + (remainingInstallments === 1 ? " installment left" : " installments left"));
    if (!p.isPaidOff) {
      var markPaidBtn = '<button class="icon-btn ghost tick-btn" data-mark-loan-paid="' + loan.id + '" aria-label="Mark payment paid" style="flex-shrink:0;margin-left:10px">' + icon("check") + '</button>';
      html += loanDetailRow("Next installment", loan.monthlyPayment, fmtDateLong(loan.nextPaymentDate), markPaidBtn);
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  function openLoanMarkPaidConfirm(id) {
    var loan = byId(state.loans, id);
    if (!loan) return;

    var html = '<div class="modal-head"><h3>Mark Payment Paid</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2);margin:0 0 16px">' + escapeHtml(loan.name) + ' · ' + fmtMoney(loan.monthlyPayment) + '</p>';
    html += '<div class="field"><label>Paid with</label><select name="bankCard" id="loan-mark-paid-bank"><option value="">None</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (loan.bankCard === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select></div>';
    html += '<button type="button" class="btn primary" data-confirm-loan-paid>Confirm Payment</button>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelector("[data-confirm-loan-paid]").addEventListener("click", function () {
      var bankCard = document.getElementById("loan-mark-paid-bank").value || null;
      var result = markLoanPaid(id, bankCard);
      closeModal();
      if (result && result.justPaidOff) celebrate("Loan Paid Off!", loan.name + " is fully paid off. One less thing to carry.");
    });
  }

  function markLoanPaid(id, bankCard) {
    var loan = byId(state.loans, id);
    if (!loan) return;
    state.transactions.push({ id: uid(), amount: loan.monthlyPayment, merchant: loan.name, note: "Loan payment", date: todayISO(), type: "expense", categoryId: loan.categoryId, bankCard: bankCard || null });
    loan.bankCard = bankCard || null;
    loan.paymentsMade += 1;
    loan.nextPaymentDate = addInterval(loan.nextPaymentDate, "monthly");
    assignCategorySlots();
    save();
    renderAll();
    // The Mark Paid button is already hidden once a loan is paid off (see
    // loanCard above), so reaching isPaidOff here always means this
    // installment was the one that just finished it off.
    return { justPaidOff: loanProgress(loan).isPaidOff };
  }

  function openLoanForm(id) {
    var existing = id ? byId(state.loans, id) : null;
    var html = '<div class="modal-head"><h3>' + (existing ? "Edit Loan" : "Add Loan") + '</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<form id="loan-form">';
    html += '<div class="field"><label>Name</label><input type="text" name="name" placeholder="e.g. Car Loan, Personal Loan" value="' + escapeAttr(existing ? existing.name : "") + '" required /></div>';
    html += '<div class="field"><label>Total Debt Value</label><input type="number" step="0.01" min="0" name="totalAmount" value="' + (existing ? existing.totalAmount : "") + '" required /></div>';
    html += '<div class="field"><label>Monthly Payment</label><input type="number" step="0.01" min="0.01" name="monthlyPayment" value="' + (existing ? existing.monthlyPayment : "") + '" required /></div>';
    html += '<div class="field"><label>Start Date</label><input type="date" name="startDate" value="' + (existing ? existing.startDate : todayISO()) + '" required /></div>';
    html += '<div class="field"><label>End Date</label><input type="date" name="endDate" value="' + (existing ? existing.endDate : "") + '" /></div>';
    html += '<div class="field"><label>Payments Already Made</label><input type="number" step="1" min="0" name="paymentsMade" value="' + (existing ? existing.paymentsMade : "0") + '" required />';
    html += '<div class="footnote">If this loan is already in progress, enter how many payments you\'ve made so far so the balance starts accurate.</div></div>';
    html += '<div class="field"><label>Next Payment Date</label><input type="date" name="nextPaymentDate" value="' + (existing ? existing.nextPaymentDate : todayISO()) + '" required /></div>';
    html += '<div class="field"><label>Category</label><select name="categoryId"><option value="">None</option>';
    state.categories.forEach(function (c) {
      html += '<option value="' + c.id + '"' + (existing && existing.categoryId === c.id ? " selected" : "") + '>' + escapeHtml(c.name) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="field"><label>Usual Bank / Card</label><select name="bankCard"><option value="">None</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (existing && existing.bankCard === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="toggle-row"><span>Active</span><label class="switch"><input type="checkbox" name="isActive" ' + (!existing || existing.isActive ? "checked" : "") + ' /><span class="track"></span><span class="thumb"></span></label></div>';
    html += '<button type="submit" class="btn primary" style="margin-top:8px">Save</button>';
    if (existing) html += '<button type="button" class="btn danger" style="margin-top:10px" data-delete>Delete</button>';
    html += '</form>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);

    if (existing) document.querySelector("[data-delete]").addEventListener("click", function () {
      confirmAction("Delete this loan? Its payment history in Transactions is kept.", "Delete", function () {
        state.loans = state.loans.filter(function (l) { return l.id !== existing.id; });
        save(); renderAll();
      });
    });

    document.getElementById("loan-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(e.target);
      var record = {
        id: existing ? existing.id : uid(),
        name: f.get("name").trim(),
        totalAmount: parseFloat(f.get("totalAmount")),
        monthlyPayment: parseFloat(f.get("monthlyPayment")),
        startDate: f.get("startDate"),
        endDate: f.get("endDate") || null,
        paymentsMade: parseInt(f.get("paymentsMade"), 10) || 0,
        nextPaymentDate: f.get("nextPaymentDate"),
        categoryId: f.get("categoryId") || null,
        bankCard: f.get("bankCard") || null,
        isActive: f.get("isActive") === "on"
      };
      if (isNaN(record.totalAmount) || isNaN(record.monthlyPayment) || !record.name) return;
      if (existing) {
        var idx = state.loans.findIndex(function (l) { return l.id === existing.id; });
        state.loans[idx] = record;
      } else {
        state.loans.push(record);
      }
      save(); closeModal(); renderAll();
    });
  }

  /* ---------- render: goals ---------- */

  function goalProgress(goal) {
    var contributions = state.transactions.filter(function (t) { return t.isGoalContribution && t.goalId === goal.id; });
    var saved = contributions.reduce(function (s, t) { return s + t.amount; }, 0);
    var pct = goal.targetAmount > 0 ? Math.min(saved / goal.targetAmount, 1) : 0;
    var isReached = saved >= goal.targetAmount;
    return { saved: saved, pct: pct, count: contributions.length, isReached: isReached, paceStatus: isReached ? null : goalPaceStatus(goal, saved) };
  }

  /* "Behind pace" compares how much of the goal's own timeline (from when
     it was created to its target date) has elapsed against how much of the
     target has actually been saved - a goal with no target date has no
     timeline to fall behind on, so it's simply never flagged. */
  function goalPaceStatus(goal, saved) {
    if (!goal.targetDate) return null;
    if (daysUntil(goal.targetDate) < 0) return "overdue";
    var totalDays = daysBetween(goal.createdAt, goal.targetDate);
    if (totalDays <= 0) return null;
    var elapsedDays = Math.max(0, daysBetween(goal.createdAt, todayISO()));
    var expectedPct = Math.min(elapsedDays / totalDays, 1);
    var actualPct = goal.targetAmount > 0 ? saved / goal.targetAmount : 1;
    return actualPct < expectedPct - 0.1 ? "behind" : null;
  }

  function daysBetween(isoA, isoB) {
    return Math.round((new Date(isoB + "T00:00:00") - new Date(isoA + "T00:00:00")) / 86400000);
  }

  function renderGoals() {
    var html = "";
    if (!state.goals.length) {
      html += emptyState("target", "No savings goals", "Add a goal - an emergency fund, a trip, a big purchase - and track how close you are.");
    } else {
      var totalGoal = state.goals.reduce(function (s, g) { return s + g.targetAmount; }, 0);
      var totalSaved = state.goals.reduce(function (s, g) { return s + goalProgress(g).saved; }, 0);
      html += '<div class="card card-ledger"><div class="disclosure" style="margin-bottom:8px"><span style="font-weight:600">Goal</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(totalGoal) + '</span></div>';
      html += '<div class="disclosure"><span style="font-weight:600">Total saved</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(totalSaved) + '</span></div></div>';
      html += '<div class="card" style="padding:4px 16px">';
      state.goals.forEach(function (goal) { html += goalCard(goal); });
      html += '</div>';
    }

    document.getElementById("tab-goals").innerHTML = html;

    document.querySelectorAll("#tab-goals [data-open-goal]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-add-funds]")) return;
        openGoalForm(el.getAttribute("data-open-goal"));
      });
    });
    document.querySelectorAll("#tab-goals [data-add-funds]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openGoalContributionForm(el.getAttribute("data-add-funds"));
      });
    });
  }

  function goalCard(goal) {
    var p = goalProgress(goal);
    var html = '<div data-open-goal="' + goal.id + '" style="margin-bottom:16px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">';
    html += '<span style="font-size:14.5px;font-weight:600">' + escapeHtml(goal.name) + '</span>';
    if (p.isReached) html += '<span class="chip milestone">' + icon("check") + 'Goal Reached</span>';
    else if (p.paceStatus === "overdue") html += '<span class="chip critical">' + icon("alert") + 'Overdue</span>';
    else if (p.paceStatus === "behind") html += '<span class="chip warning">' + icon("alert") + 'Behind Pace</span>';
    html += '</div>';
    html += '<div class="bar-track"><div class="bar-fill" style="background:var(--accent);width:' + (p.pct * 100) + '%"></div></div>';

    html += '<div class="loan-details">';
    html += loanDetailRow("Target", goal.targetAmount, goal.targetDate ? "by " + fmtDateLong(goal.targetDate) : null);
    html += loanDetailRow("Saved", p.saved, p.count + (p.count === 1 ? " contribution" : " contributions"));
    if (!p.isReached) {
      var addFundsBtn = '<button class="icon-btn ghost" data-add-funds="' + goal.id + '" aria-label="Add funds" style="flex-shrink:0;margin-left:10px">' + icon("plus") + '</button>';
      html += loanDetailRow("Remaining", goal.targetAmount - p.saved, null, addFundsBtn);
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  /* Contributions are logged as ordinary expense transactions (tagged
     isGoalContribution + goalId) rather than a separate ledger, the same
     way a transfer is a real transaction rather than its own record type -
     that keeps a goal's progress, and Total Available Funds, both honest
     without special-casing goals throughout the money math. They're
     excluded from spend totals (see the isGoalContribution checks
     alongside isTransfer) since setting money aside isn't spending it. */
  function openGoalContributionForm(id) {
    var goal = byId(state.goals, id);
    if (!goal) return;
    var p = goalProgress(goal);
    var html = '<div class="modal-head"><h3>Add Funds</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2);margin:0 0 16px">' + escapeHtml(goal.name) + ' · ' + fmtMoney(Math.max(goal.targetAmount - p.saved, 0)) + ' remaining</p>';
    html += '<form id="goal-contribution-form">';
    html += '<div class="field"><label>Amount</label><input type="number" step="0.01" min="0.01" name="amount" required /></div>';
    html += '<div class="field"><label>From</label><select name="bankCard"><option value="">None</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '">' + escapeHtml(bc) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="field"><label>Date</label><input type="date" name="date" value="' + todayISO() + '" required /></div>';
    html += '<button type="submit" class="btn primary">Add Contribution</button>';
    html += '</form>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.getElementById("goal-contribution-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(e.target);
      var amount = parseFloat(f.get("amount"));
      if (isNaN(amount) || amount <= 0) return;
      state.transactions.push({
        id: uid(), amount: amount, merchant: "Goal: " + goal.name, note: "",
        date: f.get("date") || todayISO(), type: "expense", categoryId: "savings",
        bankCard: f.get("bankCard") || null, isGoalContribution: true, goalId: goal.id
      });
      save(); closeModal(); renderAll();
      // The Add Funds button is already hidden once a goal is reached (see
      // goalCard above), so reaching isReached here always means this
      // contribution was the one that just did it.
      if (goalProgress(goal).isReached) celebrate("Goal Reached!", "You hit your target for " + goal.name + ". Nicely done.");
    });
  }

  function openGoalForm(id) {
    var existing = id ? byId(state.goals, id) : null;
    var html = '<div class="modal-head"><h3>' + (existing ? "Edit Goal" : "New Goal") + '</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<form id="goal-form">';
    html += '<div class="field"><label>Name</label><input type="text" name="name" placeholder="e.g. Emergency Fund, Umrah Trip" value="' + escapeAttr(existing ? existing.name : "") + '" required /></div>';
    html += '<div class="field"><label>Target Amount</label><input type="number" step="0.01" min="0.01" name="targetAmount" value="' + (existing ? existing.targetAmount : "") + '" required /></div>';
    html += '<div class="field"><label>Target Date (optional)</label><input type="date" name="targetDate" value="' + (existing && existing.targetDate ? existing.targetDate : "") + '" />';
    html += '<div class="footnote">Set this to get a heads-up if you fall behind the pace needed to hit the goal in time.</div></div>';
    html += '<button type="submit" class="btn primary" style="margin-top:8px">Save</button>';
    if (existing) html += '<button type="button" class="btn danger" style="margin-top:10px" data-delete>Delete</button>';
    html += '</form>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);

    if (existing) document.querySelector("[data-delete]").addEventListener("click", function () {
      confirmAction("Delete this goal? Its contribution history in Transactions is kept.", "Delete", function () {
        state.goals = state.goals.filter(function (g) { return g.id !== existing.id; });
        save(); renderAll();
      });
    });

    document.getElementById("goal-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(e.target);
      var record = {
        id: existing ? existing.id : uid(),
        name: f.get("name").trim(),
        targetAmount: parseFloat(f.get("targetAmount")),
        targetDate: f.get("targetDate") || null,
        createdAt: existing ? existing.createdAt : todayISO()
      };
      if (isNaN(record.targetAmount) || !record.name) return;
      if (existing) {
        var idx = state.goals.findIndex(function (g) { return g.id === existing.id; });
        state.goals[idx] = record;
      } else {
        state.goals.push(record);
      }
      save(); closeModal(); renderAll();
    });
  }

  /* ---------- render: forecast ---------- */

  // Months offset from the current month that the visible 12-month window
  // starts at - 0 is "this month forward", negative slides it into the
  // past. Module-level like viewPeriod so it survives a re-render but
  // resets on reload.
  var forecastWindowOffset = 0;

  function shiftForecastWindow(delta) {
    forecastWindowOffset += delta;
    renderForecast();
  }

  function renderForecast() {
    var base = new Date(today().getFullYear(), today().getMonth() + forecastWindowOffset, 1);
    var months = [];
    for (var i = 0; i < 12; i++) {
      var d = new Date(base.getFullYear(), base.getMonth() + i, 1);
      months.push({
        key: d.getFullYear() + "-" + pad(d.getMonth() + 1),
        label: d.toLocaleDateString(undefined, { month: "short" }) + " " + String(d.getFullYear()).slice(2)
      });
    }
    var windowStart = months[0].key + "-01";
    var windowEndDate = new Date(base.getFullYear(), base.getMonth() + 12, 1);
    var windowEnd = windowEndDate.getFullYear() + "-" + pad(windowEndDate.getMonth() + 1) + "-01";

    var matrix = {};
    var catTotals = {};

    function addToMatrix(catKey, monthKey, amount) {
      if (!matrix[catKey]) matrix[catKey] = {};
      matrix[catKey][monthKey] = (matrix[catKey][monthKey] || 0) + amount;
      catTotals[catKey] = (catTotals[catKey] || 0) + amount;
    }

    // Recurring income (salary etc.) sits outside this expense forecast,
    // same as Spending Trend's forecastTotalForRange.
    state.recurring.filter(function (r) { return r.isActive && r.kind !== "income"; }).forEach(function (r) {
      var catKey = r.categoryId || "__none";
      var d2 = r.nextDueDate;
      var guard = 0;
      // If nextDueDate has already advanced past windowStart (e.g. this
      // month's bill was already marked paid), walk backward first to
      // recover the occurrence that falls in this window - same
      // normalization occurrencesInRange() uses elsewhere.
      if (d2 >= windowStart) {
        while (d2 >= windowStart && guard < 500) { d2 = subtractInterval(d2, r.frequency); guard++; }
      }
      guard = 0;
      while (d2 < windowStart && guard < 500) { d2 = addInterval(d2, r.frequency); guard++; }
      guard = 0;
      while (d2 < windowEnd && guard < 500) {
        if (r.endDate && d2 > r.endDate) break;
        if (!r.startDate || d2 >= r.startDate) addToMatrix(catKey, d2.slice(0, 7), r.amount);
        d2 = addInterval(d2, r.frequency);
        guard++;
      }
    });

    // Loans are finite: unlike recurring bills, projection stops once the
    // loan would be paid off, instead of continuing indefinitely.
    state.loans.filter(function (l) { return l.isActive; }).forEach(function (l) {
      var catKey = l.categoryId || "__none";
      var d2 = l.nextPaymentDate;
      var paymentsSoFar = l.paymentsMade;
      var guard = 0;
      // Same backward-normalization as the recurring-bills loop above:
      // if this month's installment was already marked paid,
      // nextPaymentDate has already advanced past windowStart.
      if (d2 >= windowStart) {
        while (d2 >= windowStart && paymentsSoFar > 0 && guard < 500) {
          d2 = subtractInterval(d2, "monthly");
          paymentsSoFar--;
          guard++;
        }
      }
      guard = 0;
      while (d2 < windowStart && paymentsSoFar * l.monthlyPayment < l.totalAmount && guard < 500) {
        d2 = addInterval(d2, "monthly");
        paymentsSoFar++;
        guard++;
      }
      guard = 0;
      while (d2 < windowEnd && paymentsSoFar * l.monthlyPayment < l.totalAmount && guard < 500) {
        addToMatrix(catKey, d2.slice(0, 7), l.monthlyPayment);
        d2 = addInterval(d2, "monthly");
        paymentsSoFar++;
        guard++;
      }
    });

    // Actual: what's really been logged as transactions in this window,
    // regardless of whether that category has any forecast entry at all
    // (e.g. Dining has no recurring bill or loan, but still belongs in
    // this comparison if money was actually spent there).
    var actualMatrix = {};
    var actualTotals = {};
    state.transactions.forEach(function (t) {
      if (t.type !== "expense" || t.isTransfer || t.isGoalContribution) return;
      if (t.date < windowStart || t.date >= windowEnd) return;
      var catKey = t.categoryId || "__none";
      var mk = monthKeyOf(t.date);
      if (!actualMatrix[catKey]) actualMatrix[catKey] = {};
      actualMatrix[catKey][mk] = (actualMatrix[catKey][mk] || 0) + t.amount;
      actualTotals[catKey] = (actualTotals[catKey] || 0) + t.amount;
    });

    var catKeySet = {};
    Object.keys(matrix).forEach(function (k) { catKeySet[k] = true; });
    Object.keys(actualMatrix).forEach(function (k) { catKeySet[k] = true; });
    var catKeys = Object.keys(catKeySet).sort(function (a, b) {
      return ((catTotals[b] || 0) + (actualTotals[b] || 0)) - ((catTotals[a] || 0) + (actualTotals[a] || 0));
    });

    var html = '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between">';
    html += '<button class="icon-btn accent-ghost" id="forecast-prev" aria-label="Earlier months" style="width:32px;height:32px">' + icon("chevron", "chevron-flip") + '</button>';
    html += '<h2 style="margin:0;font-size:15px">' + months[0].label + ' – ' + months[months.length - 1].label + '</h2>';
    html += '<button class="icon-btn accent-ghost" id="forecast-next" aria-label="Later months" style="width:32px;height:32px">' + icon("chevron") + '</button>';
    html += '</div></div>';

    html += '<div class="card"><p class="footnote" style="margin:0">Forecast is projected from your active recurring payments and loans. Actual is what\'s really been logged as transactions. Variance is Forecast minus Actual - positive means you spent less than planned, negative means you spent more.</p></div>';

    if (!catKeys.length) {
      html += emptyState("grid", "Nothing to forecast", "Add active recurring payments or loans, or log some transactions, to see forecast vs. actual here.");
    } else {
      html += '<div class="card"><div class="forecast-scroll"><table class="forecast-table"><thead>';
      html += '<tr><th class="fc-sticky" rowspan="2">Category</th>';
      months.forEach(function (m) { html += '<th colspan="3">' + m.label + '</th>'; });
      html += '</tr><tr>';
      months.forEach(function () { html += '<th class="fc-group-start">Fc</th><th>Act</th><th>Var</th>'; });
      html += '</tr></thead><tbody>';
      catKeys.forEach(function (catKey) {
        var cat = catKey === "__none" ? null : byId(state.categories, catKey);
        html += '<tr><td class="fc-sticky">' + escapeHtml(cat ? cat.name : "Uncategorized") + '</td>';
        months.forEach(function (m) {
          var fc = (matrix[catKey] && matrix[catKey][m.key]) || 0;
          var act = (actualMatrix[catKey] && actualMatrix[catKey][m.key]) || 0;
          var overspent = act - fc;
          // Displayed sign is flipped from the over/under check above:
          // negative shown = spent more than planned, positive shown =
          // spent less. Color still follows the original overspent/under
          // determination, not the displayed number's own sign.
          var variance = fc - act;
          var varClass = overspent > 0 ? "variance-over" : (overspent < 0 ? "variance-under" : "zero");
          html += '<td class="num fc-group-start' + (fc === 0 ? ' zero' : '') + '">' + (fc === 0 ? '–' : fmtWhole(fc)) + '</td>';
          html += '<td class="num' + (act === 0 ? ' zero' : '') + '">' + (act === 0 ? '–' : fmtWhole(act)) + '</td>';
          html += '<td class="num ' + varClass + '">' + (variance === 0 ? '–' : (variance > 0 ? '+' : '') + fmtWhole(variance)) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody><tfoot><tr><td class="fc-sticky">Total</td>';
      var actualExpenseByMonth = months.map(function (m) {
        var actTotal = 0;
        catKeys.forEach(function (catKey) { actTotal += (actualMatrix[catKey] && actualMatrix[catKey][m.key]) || 0; });
        return actTotal;
      });
      var fcExpenseByMonth = months.map(function (m) {
        var fcTotal = 0;
        catKeys.forEach(function (catKey) { fcTotal += (matrix[catKey] && matrix[catKey][m.key]) || 0; });
        return fcTotal;
      });
      months.forEach(function (m, i) {
        var fcTotal = fcExpenseByMonth[i];
        var actTotal = actualExpenseByMonth[i];
        var overspentTotal = actTotal - fcTotal;
        var varTotal = fcTotal - actTotal;
        var varClass = overspentTotal > 0 ? "variance-over" : (overspentTotal < 0 ? "variance-under" : "");
        html += '<td class="num fc-group-start">' + fmtWhole(fcTotal) + '</td>';
        html += '<td class="num">' + fmtWhole(actTotal) + '</td>';
        html += '<td class="num ' + varClass + '">' + (varTotal > 0 ? '+' : '') + fmtWhole(varTotal) + '</td>';
      });
      html += '</tr>';

      // Income row mirrors the category rows above it: Fc is projected from
      // active recurring income (salary etc.), same backward-normalized
      // walk the expense loop at the top of this function uses, so an
      // income item already marked received this month still counts. Act
      // is every real income transaction logged - not limited to recurring
      // items, so a one-off bonus or gift counts too.
      var incomeFcByMonth = {};
      state.recurring.filter(function (r) { return r.isActive && r.kind === "income"; }).forEach(function (r) {
        var d2 = r.nextDueDate;
        var guard = 0;
        if (d2 >= windowStart) {
          while (d2 >= windowStart && guard < 500) { d2 = subtractInterval(d2, r.frequency); guard++; }
        }
        guard = 0;
        while (d2 < windowStart && guard < 500) { d2 = addInterval(d2, r.frequency); guard++; }
        guard = 0;
        while (d2 < windowEnd && guard < 500) {
          if (r.endDate && d2 > r.endDate) break;
          if (!r.startDate || d2 >= r.startDate) {
            var mk = d2.slice(0, 7);
            incomeFcByMonth[mk] = (incomeFcByMonth[mk] || 0) + r.amount;
          }
          d2 = addInterval(d2, r.frequency);
          guard++;
        }
      });
      var incomeByMonth = {};
      state.transactions.forEach(function (t) {
        if (t.type !== "income" || t.isTransfer) return;
        if (t.date < windowStart || t.date >= windowEnd) return;
        var mk = monthKeyOf(t.date);
        incomeByMonth[mk] = (incomeByMonth[mk] || 0) + t.amount;
      });
      var incomeFcByMonthArr = months.map(function (m) { return incomeFcByMonth[m.key] || 0; });
      var incomeActByMonthArr = months.map(function (m) { return incomeByMonth[m.key] || 0; });

      html += '<tr><td class="fc-sticky">Income</td>';
      months.forEach(function (m, i) {
        var fc = incomeFcByMonthArr[i];
        var act = incomeActByMonthArr[i];
        // Actual minus Forecast (opposite of the expense rows' Fc minus
        // Act) so a positive number always means "more than expected" and
        // stays green - the expense convention would leave a green number
        // showing as negative here, which reads backwards for income.
        var variance = act - fc;
        var varClass = variance > 0 ? "variance-under" : (variance < 0 ? "variance-over" : "zero");
        html += '<td class="num fc-group-start' + (fc === 0 ? ' zero' : '') + '">' + (fc === 0 ? '–' : fmtWhole(fc)) + '</td>';
        html += '<td class="num' + (act === 0 ? ' zero' : '') + '">' + (act === 0 ? '–' : fmtWhole(act)) + '</td>';
        html += '<td class="num ' + varClass + '">' + (variance === 0 ? '–' : (variance > 0 ? '+' : '') + fmtWhole(variance)) + '</td>';
      });
      html += '</tr>';

      // Balance: Income minus Expenses, kept in its own Fc/Act pair rather
      // than mixed with the Var column above (Fc balance uses the Fc
      // income/expense projections, Act balance uses what's really been
      // logged - the two shouldn't be blended into one number). Var here
      // compares the two balances themselves (Act minus Fc, same
      // positive-is-green direction as the Income row above) - did the
      // actual bottom line come in better or worse than the planned one.
      html += '<tr><td class="fc-sticky">Balance</td>';
      months.forEach(function (m, i) {
        var fcBalance = incomeFcByMonthArr[i] - fcExpenseByMonth[i];
        var actBalance = incomeActByMonthArr[i] - actualExpenseByMonth[i];
        var fcClass = fcBalance < 0 ? "variance-over" : (fcBalance > 0 ? "variance-under" : "zero");
        var actClass = actBalance < 0 ? "variance-over" : (actBalance > 0 ? "variance-under" : "zero");
        var balanceVariance = actBalance - fcBalance;
        var varClass = balanceVariance > 0 ? "variance-under" : (balanceVariance < 0 ? "variance-over" : "zero");
        html += '<td class="num fc-group-start ' + fcClass + '">' + (fcBalance === 0 ? '–' : (fcBalance > 0 ? '+' : '') + fmtWhole(fcBalance)) + '</td>';
        html += '<td class="num ' + actClass + '">' + (actBalance === 0 ? '–' : (actBalance > 0 ? '+' : '') + fmtWhole(actBalance)) + '</td>';
        html += '<td class="num ' + varClass + '">' + (balanceVariance === 0 ? '–' : (balanceVariance > 0 ? '+' : '') + fmtWhole(balanceVariance)) + '</td>';
      });
      html += '</tr>';

      html += '</tfoot></table></div></div>';
    }

    document.getElementById("tab-forecast").innerHTML = html;
    document.getElementById("forecast-prev").addEventListener("click", function () { shiftForecastWindow(-1); });
    document.getElementById("forecast-next").addEventListener("click", function () { shiftForecastWindow(1); });
  }

  /* ---------- render: transfer ---------- */

  function transferHistory() {
    var byId2 = {};
    state.transactions.filter(function (t) { return t.isTransfer; }).forEach(function (t) {
      if (!byId2[t.transferId]) byId2[t.transferId] = {};
      byId2[t.transferId][t.type] = t;
    });
    var list = [];
    Object.keys(byId2).forEach(function (tid) {
      var pair = byId2[tid];
      if (pair.expense && pair.income) {
        list.push({ id: tid, from: pair.expense.bankCard, to: pair.income.bankCard, amount: pair.expense.amount, date: pair.expense.date, note: pair.expense.note });
      }
    });
    return list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function renderTransfer() {
    var transfers = transferHistory();
    var html = "";
    html += '<div class="card"><p class="footnote" style="margin:0">Move funds between your own bank/card accounts. Both balances update automatically and a matching pair of transactions is recorded on each side.</p></div>';

    if (!transfers.length) {
      html += emptyState("swap", "No transfers yet", "Tap + to move funds between two of your accounts.");
    } else {
      html += '<div class="card" style="padding:4px 16px">';
      transfers.forEach(function (t) {
        html += '<div class="row" data-open-transfer="' + t.id + '">';
        html += '<div class="badge" style="background:var(--accent);width:34px;height:34px">' + icon("swap") + '</div>';

    html += '<div class="field"><label>To</label><select name="to" required><option value="">Select account</option>';

  /* ---------- forms: transaction ---------- */

  function openTransactionForm(id, prefill) {
    var existing = id ? byId(state.transactions, id) : null;
    var pre = existing || prefill || null; // prefill (e.g. from a grocery trip) fills the new-transaction form; nothing is saved until Save
    var html = '<div class="modal-head"><h3>' + (existing ? "Edit Transaction" : "Add Transaction") + '</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<form id="tx-form">';
    html += '<div class="field"><input class="amount-input num" type="number" step="0.01" min="0" inputmode="decimal" name="amount" placeholder="0.00" value="' + (pre ? pre.amount : "") + '" required /></div>';
    html += '<div class="field"><div class="segmented" id="tx-type-seg">';
    html += '<button type="button" data-val="expense" class="' + (!existing || existing.type === "expense" ? "active" : "") + '">Expense</button>';
    html += '<button type="button" data-val="income" class="' + (existing && existing.type === "income" ? "active" : "") + '">Income</button>';
    html += '</div><input type="hidden" name="type" value="' + (existing ? existing.type : "expense") + '" /></div>';
    html += '<div class="field"><label>Merchant</label><input type="text" name="merchant" placeholder="e.g. Carrefour" value="' + escapeAttr(pre ? pre.merchant : "") + '" required /></div>';
    html += '<div class="field"><label>Category</label><select name="categoryId" id="tx-cat-select"><option value="">None</option>';
    state.categories.forEach(function (c) {
      html += '<option value="' + c.id + '"' + (pre && pre.categoryId === c.id ? " selected" : "") + '>' + escapeHtml(c.name) + '</option>';
    });
    html += '</select></div>';
    // Only shown once there's a goal to contribute to - picking one is the
    // regular-transaction path onto the same isGoalContribution/goalId data
    // the Goals page's own "Add Funds" shortcut writes, so both stay
    // interchangeable (either can create or edit the same transaction).
    if (state.goals.length) {
      html += '<div class="field"><label>Contribute to Goal (optional)</label><select name="goalId" id="tx-goal-select"><option value="">None</option>';
      state.goals.forEach(function (g) {
        html += '<option value="' + g.id + '"' + (existing && existing.goalId === g.id ? " selected" : "") + '>' + escapeHtml(g.name) + '</option>';
      });
      html += '</select></div>';
    }
    html += '<div class="field"><label>Bank / Card</label><select name="bankCard"><option value="">None</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (existing && existing.bankCard === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select></div>';
    html += '<div class="field"><label>Date</label><input type="date" name="date" value="' + (pre && pre.date ? pre.date : todayISO()) + '" required /></div>';
    html += '<div class="field"><label>Note (optional)</label><input type="text" name="note" value="' + escapeAttr(pre ? pre.note : "") + '" /></div>';
    if (existing) {
      html += '<button type="submit" class="btn primary">Save</button>';
      html += '<button type="button" class="btn danger" style="margin-top:10px" data-delete>Delete</button>';
    } else {
      html += '<div class="btn-row"><button type="submit" class="btn primary">Save</button><button type="button" class="btn plain secondary" id="tx-save-another">Save &amp; add another</button></div>';
      html += '<div class="save-flash" id="tx-saved" role="status" aria-live="polite"></div>';
    }
    html += '</form>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);

    var typeInput = document.querySelector('input[name="type"]');
    var catManuallyPicked = !!(pre && pre.categoryId);
    var goalSelect = document.getElementById("tx-goal-select");
    document.querySelectorAll("#tx-type-seg button").forEach(function (b) {
      b.addEventListener("click", function () {
        // A goal contribution is always money leaving, never income - while
        // one's selected, Income is a no-op instead of a state that would
        // contradict it.
        if (b.getAttribute("data-val") === "income" && goalSelect && goalSelect.value) return;
        document.querySelectorAll("#tx-type-seg button").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        typeInput.value = b.getAttribute("data-val");
      });
    });
    document.querySelector('input[name="merchant"]').addEventListener("input", function (e) {
      if (catManuallyPicked) return;
      var suggestion = suggestCategoryFromHistory(e.target.value) || suggestCategory(e.target.value);
      if (suggestion) document.getElementById("tx-cat-select").value = suggestion;
    });
    document.getElementById("tx-cat-select").addEventListener("change", function () { catManuallyPicked = true; });
    if (goalSelect) goalSelect.addEventListener("change", function () {
      if (!goalSelect.value) return;
      document.querySelectorAll("#tx-type-seg button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-val") === "expense");
      });
      typeInput.value = "expense";
      document.getElementById("tx-cat-select").value = "savings";
      catManuallyPicked = true;
      var merchantInput = document.querySelector('input[name="merchant"]');
      if (!merchantInput.value.trim()) {
        var goal = byId(state.goals, goalSelect.value);
        merchantInput.value = "Goal: " + (goal ? goal.name : "");
      }
    });

    if (existing) document.querySelector("[data-delete]").addEventListener("click", function () {
      confirmAction("Delete this transaction?", "Delete", function () {
        state.transactions = state.transactions.filter(function (t) { return t.id !== existing.id; });
        save(); renderAll();
      });
    });

    // Shared by Save and "Save & add another". Returns true when saved.
    function saveTransaction(form) {
      var f = new FormData(form);
      var goalId = f.get("goalId") || null;
      var record = {
        id: existing ? existing.id : uid(),
        amount: parseFloat(f.get("amount")),
        merchant: f.get("merchant").trim(),
        note: (f.get("note") || "").trim(),
        date: f.get("date"),
        // Belt-and-suspenders, not a UI escape hatch - the Income button is
        // already blocked while a goal is selected (see tx-type-seg above).
        type: goalId ? "expense" : f.get("type"),
        categoryId: f.get("categoryId") || null,
        bankCard: f.get("bankCard") || null,
        isGoalContribution: !!goalId,
        goalId: goalId
      };
      if (isNaN(record.amount) || !record.merchant) return false;
      if (existing) {
        var idx = state.transactions.findIndex(function (t) { return t.id === existing.id; });
        state.transactions[idx] = record;
      } else {
        state.transactions.push(record);
        if (prefill && prefill.onSave) prefill.onSave(record);
      }
      assignCategorySlots();
      save(); renderAll();
      return true;
    }

    document.getElementById("tx-form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (saveTransaction(e.target)) closeModal();
    });

    var anotherBtn = document.getElementById("tx-save-another");
    if (anotherBtn) anotherBtn.addEventListener("click", function () {
      var form = document.getElementById("tx-form");
      if (!form.reportValidity() || !saveTransaction(form)) return;
      // Keep the date, card and type so repeated entries are quick; the
      // category/goal follow the merchant, so they start over with it.
      var amountInput = form.querySelector('input[name="amount"]');
      amountInput.value = "";
      form.querySelector('input[name="merchant"]').value = "";
      form.querySelector('input[name="note"]').value = "";
      document.getElementById("tx-cat-select").value = "";
      if (goalSelect) goalSelect.value = "";
      catManuallyPicked = false;
      var flash = document.getElementById("tx-saved");
      flash.textContent = "Saved"; flash.classList.add("show");
      clearTimeout(flash._t); flash._t = setTimeout(function () { flash.classList.remove("show"); }, 1600);
      amountInput.focus();
    });
  }

  // Unlike MoneyQuill's relational schema (cards have a stable id, label is
  // just a display field), finance-tracker identifies a card by its label
  // string everywhere - state.bankCardConfig is keyed by it, and every
  // transaction/recurring item/loan stores the raw label in its own
  // bankCard field, not a foreign key. So renaming isn't just one field:
  // every one of those has to be migrated to the new label too, or the
  // rename would silently orphan all of that card's history exactly like
  // Remove does (acceptable there, not here).
  function openRenameBankCardForm(oldLabel) {
    var html = '<div class="modal-head"><h3>Rename Account</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<form id="rename-bank-form">';
    html += '<div class="field"><label>Name</label><input type="text" name="label" value="' + escapeAttr(oldLabel) + '" required /></div>';
    html += '<button type="submit" class="btn primary">Save</button>';
    html += '</form>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);

    document.getElementById("rename-bank-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(e.target);
      var newLabel = f.get("label").trim();
      if (!newLabel || newLabel === oldLabel) { closeModal(); return; }
      if (allBankCards().indexOf(newLabel) !== -1) {
        showMessage("You already have an account named \"" + newLabel + "\".");
        return;
      }

      var custom = state.customBankCards.filter(function (c) { return c.label === oldLabel; })[0];
      if (custom) {
        custom.label = newLabel;
      } else {
        // Built-in bank (from the hardcoded BANK_CARDS list, not owned by
        // the user) - hide the old name and add the new one as a custom
        // card, same overlay pattern Remove already uses for built-ins.
        state.removedBankCards.push(oldLabel);
        state.customBankCards.push({ label: newLabel, type: bankCardType(oldLabel) });
      }

      if (state.bankCardConfig[oldLabel]) {
        state.bankCardConfig[newLabel] = state.bankCardConfig[oldLabel];

      }
      state.transactions.forEach(function (t) { if (t.bankCard === oldLabel) t.bankCard = newLabel; });
      state.recurring.forEach(function (r) { if (r.bankCard === oldLabel) r.bankCard = newLabel; });
      state.loans.forEach(function (l) { if (l.bankCard === oldLabel) l.bankCard = newLabel; });

      save(); closeModal(); renderAll();
    });
  }

  /* Saves a file to the viewer's device. Prefers window.claude.downloads (the
     Artifact runtime's viewer-consented save prompt) and falls back to a plain
     anchor-click Blob download when that API isn't present — e.g. when this
     page is opened outside claude.ai (GitHub Pages, a local file, etc). */
  function saveFile(filename, text, mime) {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: text }).catch(function () {
        downloadViaAnchor(filename, text, mime);
      });
    } else {
      downloadViaAnchor(filename, text, mime);
    }
  }

  function downloadViaAnchor(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // A value starting with =, +, -, @ (or a tab/CR) is read as a formula by
  // Excel/Sheets even inside a quoted CSV field - quoting alone only
  // escapes commas/newlines, not this. Merchant/note text isn't typed by
  // the user alone: it can also come from the screenshot-import feature,
  // i.e. from a vision model reading an attacker-supplied image, so a
  // crafted screenshot could otherwise plant a formula that runs when the
  // exported file is opened. Prefixing a leading apostrophe is the
  // standard neutralization - spreadsheet apps treat it as "force text"
  // and it isn't visible in the opened cell.
  function csvSafe(v) {
    var s = String(v);
    return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
  }
  function exportCSV() {
    var rows = [["Date","Type","Merchant","Category","Bank/Card","Amount","Note"]];
    state.transactions.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (t) {
      var cat = byId(state.categories, t.categoryId);
      rows.push([t.date, t.type, t.merchant, cat ? cat.name : "", t.bankCard || "", t.amount, t.note || ""]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + csvSafe(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    saveFile("transactions.csv", csv, "text/csv");
  }

  function exportBackup() {
    saveFile("finance-tracker-backup.json", JSON.stringify(state, null, 2), "application/json");
  }

  function restoreBackupFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e) {
        showMessage("That file isn't a valid backup (couldn't parse JSON).");
        return;
      }
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.transactions)) {
        showMessage("That file doesn't look like a Finance Tracker backup.");
        return;
      }
      confirmAction("Restore this backup? It will replace all data currently in the app.", "Restore", function () {
        state = normalizeState(parsed);
        save();
        renderAll();
      });
    };
    reader.readAsText(file);
  }

  /* ---------- Lists: Grocery, tasks shortcut, Home screen ---------- */
  /* ---------- grocery ----------
     state.grocery = { items, trips, learned }:
       items:   [{ id, name, brand, cat, qty, unit, price (per unit) | null, status "pending"|"got"|"unavailable", addedAt }]
       trips:   [{ id, date "YYYY-MM-DDTHH:MM", items [{ name, brand, cat, qty, unit, price }], total | null, expenseTxId }]  newest first
       learned: { "<lower-case name>": { name, cat, unit, price, brand, brands[], bp {brand: price}, uses, last } }
                what the person's own list taught the autofill: last unit, brand, aisle and price per item.
     Complete trip moves the Got items into trips; Unavailable and not-yet-picked items stay on the list.
     It is part of the one synced state blob, so save() carries it to the cloud and to Backup/Restore.
     normalizeGrocery runs from load(), before the vars below exist, so it only uses hoisted functions. */

  function groCatIds() { return ["fv", "dairy", "eggs", "meat", "fish", "chilled", "frozen", "canned", "bakery", "pantry", "snacks", "drinks", "house", "care", "baby", "pets", "other"]; }
  function groUnitList() { return ["pcs", "kg", "g", "L", "ml", "pack", "box", "bottle", "can", "dozen", "bag"]; }
  function groPos(v) { var n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) && n > 0 ? Math.min(Math.round(n * 100) / 100, 9999999) : null; }
  function groStr(v, n) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim().slice(0, n); }
  function normalizeGroItem(i, snapshot) {
    if (!i || typeof i !== "object") return null;
    var name = groStr(i.name, 120); if (!name) return null;
    var o = {
      id: i.id != null && i.id !== "" ? String(i.id) : uid(),
      name: name,
      brand: groStr(i.brand, 60),
      cat: groCatIds().indexOf(i.cat) !== -1 ? i.cat : "other",
      qty: groPos(i.qty) || 1,
      unit: groUnitList().indexOf(i.unit) !== -1 ? i.unit : "pcs",
      price: groPos(i.price)
    };
    if (!snapshot) {
      o.status = i.status === "got" ? "got" : (i.status === "unavailable" || i.status === "na") ? "unavailable" : "pending";
      o.addedAt = typeof i.addedAt === "string" ? i.addedAt.slice(0, 16) : "";
    }
    return o;
  }
  function groItemsTotal(items) { var s = 0; items.forEach(function (i) { if (i.price) s += i.price * i.qty; }); return Math.round(s * 100) / 100; }
  function normalizeGroTrip(t) {
    if (!t || typeof t !== "object") return null;
    var items = (Array.isArray(t.items) ? t.items : []).map(function (i) { return normalizeGroItem(i, true); }).filter(Boolean);
    if (!items.length) return null;
    var total = groPos(t.total); if (total === null) total = groItemsTotal(items) || null;

      var f = new FormData(e.target), title = String(f.get("title") || "").trim(); if (!title) return;
      var lk = String(f.get("linked") || ""), ci = lk.indexOf(":"), linked = lk ? { type: lk.slice(0, ci), id: lk.slice(ci + 1) } : null;
      var pending = document.getElementById("todo-sub-new").value.trim(); if (pending) subs.push({ id: uid(), title: pending, done: false });
      var upd = { title: title, notes: String(f.get("notes") || ""), dueDate: String(f.get("dueDate") || ""), dueTime: String(f.get("dueTime") || ""), priority: pri, tag: String(f.get("tag") || "").trim(), repeat: String(f.get("repeat") || ""), linked: linked, subtasks: subs };
      if (existing) {
        if (upd.dueDate !== existing.dueDate) existing.snoozedUntil = "";
        var n = normalizeTask(Object.assign({}, existing, upd)); Object.keys(n).forEach(function (k) { existing[k] = n[k]; });
        todoFlash = existing.id;
      } else {
        var nt = todoAddTask(Object.assign({}, upd)); todoFlash = nt.id;
      }
      var due = upd.dueDate; todoView = !due ? "all" : due <= todayISO() ? "today" : "upcoming";
      closeModal(); todoSave();
    });
  }

  /* ----- templates ----- */
  function todoTemplates() {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth(), today = todayISO();
    var pay = todoIso(new Date(y, m, 25, 12)); if (pay < today) pay = todoIso(new Date(y, m + 1, 25, 12));
    return [
      { name: "Payday", due: pay, tag: "money", priority: "high", repeat: "monthly", notes: "Do this within an hour of salary landing.", items: ["Check the salary arrived", "Move savings first: 10% to an emergency fund", "Pay rent and utilities", "Pay card minimums", "Fund this month's goals"] },
      { name: "Month-end", due: todoIso(new Date(y, m + 1, 0, 12)), tag: "money", priority: "med", repeat: "monthly", notes: "Close the month so the next one starts clean.", items: ["Categorize uncategorized transactions", "Compare spending to each budget", "Check the Forecast for next month", "Save a backup"] },
      { name: "New subscription check", due: todoAddDays(today, 3), tag: "bills", priority: "med", repeat: "", notes: "Run this 3 days after signing up for something.", items: ["Add it to Recurring with the renewal date", "Decide: keep or cancel", "Cancel any overlapping service"] }
    ];
  }
  function openTodoTemplates() {
    var tpls = todoTemplates();
    var html = '<div class="modal-head"><h3>Templates</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + "</button></div>";
    html += '<p class="footnote" style="margin:-6px 0 14px">Each one adds a checklist task with its steps as subtasks.</p>';
    tpls.forEach(function (t, i) {
      html += '<div class="todo-tpl"><h3>' + escapeHtml(t.name) + "<small>" + t.items.length + " steps" + (t.repeat ? " · Monthly" : "") + "</small></h3><ul>" + t.items.map(function (x) { return "<li>" + escapeHtml(x) + "</li>"; }).join("") + '</ul><button type="button" class="btn primary" data-tpl="' + i + '">Add to my list</button></div>';
    });
    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelectorAll("[data-tpl]").forEach(function (b) {
      b.addEventListener("click", function () {
        var t = tpls[+b.getAttribute("data-tpl")], before = JSON.stringify(state.tasks);
        var nt = todoAddTask({ title: t.name + " checklist", dueDate: t.due, priority: t.priority, tag: t.tag, repeat: t.repeat, notes: t.notes, subtasks: t.items.map(function (x) { return { id: uid(), title: x, done: false }; }) });
        todoExpanded = nt.id; closeModal(); todoSave();
        todoToast(t.name + " checklist added for " + todoDueLabel(nt.dueDate).toLowerCase(), "Undo", function () { state.tasks = JSON.parse(before); todoSave(); });
      });
    });
  }

  /* ---------- shared bits ---------- */

  function emptyState(iconName, title, body) {
    return '<div class="empty">' + icon(iconName) + '<p style="font-weight:600;color:var(--ink-2);margin-bottom:4px">' + title + '</p><p>' + body + '</p></div>';
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function renderAll() {
    if (JSON.stringify(state.nav) !== navSig) rebuildDial(); // new arrangement from sync / restore / reset
    renderDashboard();
    renderTransactions();
    renderRecurring();
    renderForecast();
    renderLoans();
    renderGoals();
    renderTodo();
    renderGrocery();
    renderCardsPage();
    renderCategoriesPage();
    renderTransfer();
    renderSettings();
    if (homeIsOpen()) renderHome();
    try { checkBillReminders(); } catch (e) {}
  }

  /* An iOS home-screen app (and long-lived browser tabs generally) gets
     suspended in the background rather than reloaded, so it can resume
     days later still holding the month it was on when backgrounded. If
     the dashboard was tracking "the current month" (rather than some
     month the user deliberately paged to), snap it forward to match
     reality whenever the page becomes visible again. */
  var trackedMonthKey = today().getFullYear() + "-" + today().getMonth();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    var now = today();
    var nowKey = now.getFullYear() + "-" + now.getMonth();
    if (nowKey !== trackedMonthKey) {
      var wasOnTrackedMonth = viewPeriod.type === "month" && (viewPeriod.year + "-" + (viewPeriod.month - 1)) === trackedMonthKey;
      if (wasOnTrackedMonth) viewPeriod = { type: "month", year: now.getFullYear(), month: now.getMonth() + 1 };
      trackedMonthKey = nowKey;
    }
    renderAll();
  });

  /* ---------- bill due-date reminders ----------
     Best-effort only: fires via the Notification API while this tab/app is
     open on this device, not a true background push (that would need a
     service worker + push server). The "already notified" record is kept
     outside synced state - it's a per-device concern, not app data. */

  var NOTIFIED_KEY = "ledger.financeTracker.notified.v1";

  function loadNotified() {
    try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || {}; } catch (e) { return {}; }
  }

  function fmtMoneyPlain(amount) {
    var num;
    try {
      num = new Intl.NumberFormat(navigator.language || "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
    } catch (e) { num = amount.toFixed(2); }
    return state.settings.currency + " " + num;
  }

  function checkBillReminders() {
    if (!state.settings.notifyBills) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var notified = loadNotified();
    var changed = false;
    state.recurring.filter(function (r) { return r.isActive; }).forEach(function (r) {
      var d = daysUntil(r.nextDueDate);
      if (d < 0 || d > 2) return;
      if (notified[r.id] === r.nextDueDate) return;
      try {
        var title = r.kind === "income" ? "Income expected soon" : "Bill due soon";
        new Notification(title, { body: r.name + " · " + fmtMoneyPlain(r.amount) + " · " + fmtDateShort(r.nextDueDate) });
      } catch (e) {}
      notified[r.id] = r.nextDueDate;
      changed = true;
    });
    if (changed) localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  }

  if (!state.ui.homeSeen) openHome();

  initCloud();
})();
</script>
