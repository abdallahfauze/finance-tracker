<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
(function () {
  "use strict";

  /* ---------- constants ---------- */

  /* 24 chart colors, assigned automatically so a new category never starts
     grey. Slots 0-7 are the original eight (unchanged, so existing categories
     keep the color they already have); 8-23 were chosen to stay clearly apart
     from each other and from those eight, in both light and dark mode. The
     values themselves live in the --catN tokens in the stylesheet. */
  var CAT_COLORS = [];
  for (var ci = 0; ci < 24; ci++) CAT_COLORS.push("var(--cat" + ci + ")");
  var OTHER_COLOR = "var(--cat-other)";

  var DEFAULT_CATEGORIES = [
    { id: "transport", name: "Transport", slot: null, isSystem: true, keywords: ["uber","careem","lyft","taxi","fuel","petrol","gas station","parking","metro","adnoc","enoc"] },
    { id: "dining", name: "Dining", slot: null, isSystem: true, keywords: ["restaurant","cafe","coffee","starbucks","costa","mcdonald","kfc","talabat","deliveroo","doordash","uber eats"] },
    { id: "groceries", name: "Groceries", slot: null, isSystem: true, keywords: ["carrefour","lulu","spinneys","whole foods","trader joe","kroger","grocery","supermarket","market"] },
    { id: "utilities", name: "Utilities", slot: null, isSystem: true, keywords: ["electricity","water bill","etisalat","telecom","internet","utility","dewa","sewa"] },
    { id: "shopping", name: "Shopping", slot: null, isSystem: true, keywords: ["amazon","noon","shein","mall","store","shop"] },
    { id: "rent", name: "Rent & Housing", slot: null, isSystem: true, keywords: ["rent","mortgage","landlord","housing"] },
    { id: "subscriptions", name: "Subscriptions", slot: null, isSystem: true, keywords: ["netflix","spotify","icloud","youtube premium","disney+","amazon prime","shahid","osn"] },
    { id: "entertainment", name: "Entertainment", slot: null, isSystem: true, keywords: ["cinema","movie","vox","theatre","concert","game"] },
    { id: "health", name: "Health", slot: null, isSystem: true, keywords: ["pharmacy","clinic","hospital","doctor","insurance"] },
    { id: "savings", name: "Savings", slot: null, isSystem: true, keywords: [] },
    { id: "income", name: "Income", slot: null, isSystem: true, keywords: ["salary","payroll","deposit","transfer in","refund"] },
    { id: "other", name: "Other", slot: null, isSystem: true, keywords: [] }
  ];

  /* Every category gets a color slot automatically, first come first served,
     and keeps it from then on - so a category's color never shifts under the
     user when something else is added. "Income" and "Other" deliberately stay
     grey (they are not spending categories). Only when there are more
     categories than colors (24) does the ranking matter: the ones with the
     highest lifetime expense total keep a color, and the rest stay grey and
     fold into "Other / Uncategorized" on the donut. A category that loses its
     slot that way is recomputed here too, not just appended to, so a heavy
     spender that shows up late is never stuck without one. */
  var NEUTRAL_CATEGORY_IDS = { income: true, other: true };

  function assignCategorySlots() {
    var totals = {};
    state.transactions.forEach(function (t) {
      if (t.type !== "expense" || !t.categoryId || t.isGoalContribution) return;
      totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount;
    });
    var order = {};
    state.categories.forEach(function (c, i) { order[c.id] = i; });
    var eligible = state.categories.filter(function (c) { return !NEUTRAL_CATEGORY_IDS[c.id]; });
    eligible.sort(function (a, b) {
      var diff = (totals[b.id] || 0) - (totals[a.id] || 0);
      return diff !== 0 ? diff : order[a.id] - order[b.id];
    });
    var keep = {};
    eligible.slice(0, CAT_COLORS.length).forEach(function (c) { keep[c.id] = true; });

    var changed = false;
    var used = {};
    state.categories.forEach(function (c) {
      if (typeof c.slot !== "number") return;
      if (!keep[c.id] || c.slot >= CAT_COLORS.length || used[c.slot]) { c.slot = null; changed = true; }
      else used[c.slot] = true;
    });
    eligible.slice(0, CAT_COLORS.length).forEach(function (c) {
      if (typeof c.slot === "number") return;
      for (var i = 0; i < CAT_COLORS.length; i++) {
        if (!used[i]) { c.slot = i; used[i] = true; changed = true; break; }
      }
    });
    return changed;
  }

  var CURRENCIES = ["USD","EUR","GBP","AED","SAR","EGP","KWD","QAR"];

  // Curated rather than a free-color picker: each preset's light/dark pair
  // is hand-tuned (see the matching [data-accent] rules in the stylesheet)
  // so accent-ink text stays legible on it and it doesn't drift into the
  // hues already claimed by status colors (warning/critical/etc). "hex" is
  // only used to draw the swatch itself here in Settings.
  var ACCENT_PRESETS = [
    { key: "teal", name: "Teal", hex: "#0A7A6C" },
    { key: "sky", name: "Sky", hex: "#0E7FBF" },
    { key: "indigo", name: "Indigo", hex: "#3452D9" },
    { key: "violet", name: "Violet", hex: "#7A42E0" },
    { key: "rose", name: "Rose", hex: "#C22E72" },
    { key: "orange", name: "Orange", hex: "#E5622F" }
  ];

  var BANK_CARDS = [
    "SAB VISA 4576",
    "SAB VISA 6438",
    "SAB MADA 5007",
    "SAB MADA 8929",
    "SNB MASTER 9341",
    "SNB MADA 4649",
    "RAJHI MADA 0464",
    "SAIB MADA 9590"
  ];

  function bankCardType(label) {
    var custom = state.customBankCards.filter(function (c) { return c.label === label; })[0];
    if (custom) return custom.type;
    return label.indexOf("MADA") !== -1 ? "debit" : "credit";
  }

  function allBankCards() {
    return BANK_CARDS.concat(state.customBankCards.map(function (c) { return c.label; }))
      .filter(function (l) { return state.removedBankCards.indexOf(l) === -1; });
  }

  function defaultBankCardConfig() {
    var config = {};
    BANK_CARDS.forEach(function (label) { config[label] = { value: 0 }; });
    return config;
  }

  var STORAGE_KEY = "ledger.financeTracker.v1";

  /* ---------- state ---------- */

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
  }

  /* Dial pages in their default order (Settings is the gear, never on the dial).
     state.nav = { order: [page ids], hidden: [page ids] } is saved per user in
     the synced state, so it follows the account and rides along in Backup. */
  var NAV_ORDER = ["dashboard", "transactions", "recurring", "loans", "cards", "categories", "goals", "transfer", "forecast"]; // the Money space; To-Do and Grocery live in Lists
  var NAV_ICONS = { dashboard: "pie", transactions: "list", recurring: "refresh", loans: "trend-down", cards: "card", categories: "tag", goals: "target", todo: "todo", grocery: "grocery", transfer: "swap", forecast: "grid" };
  var LISTS_ORDER = ["todo", "grocery"]; // fixed order for now
  var NAV_MIN_VISIBLE = 1;

  function defaultNav() { return { order: NAV_ORDER.slice(), hidden: [] }; }
  // Whatever comes in (old state without the field, unknown or duplicate pages,
  // pages added later, everything hidden) comes out as a usable arrangement.
  function normalizeNav(raw) {
    var order = [], hidden = [];
    if (raw && Array.isArray(raw.order)) raw.order.forEach(function (k) { if (NAV_ORDER.indexOf(k) !== -1 && order.indexOf(k) === -1) order.push(k); });
    NAV_ORDER.forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); }); // new pages join at the end
    if (raw && Array.isArray(raw.hidden)) raw.hidden.forEach(function (k) { if (order.indexOf(k) !== -1 && hidden.indexOf(k) === -1) hidden.push(k); });
    if (order.length - hidden.length < NAV_MIN_VISIBLE) hidden = [];
    return { order: order, hidden: hidden };
  }

  /* state.ui = { homeSeen, space }: homeSeen is false until the person has picked a space on the
     Home screen (so it shows once on a first launch); space is the one the app last used. */
  function defaultUi() { return { homeSeen: false, space: "money" }; }
  function normalizeUi(raw) {
    raw = raw && typeof raw === "object" ? raw : {};
    return { homeSeen: !!raw.homeSeen, space: raw.space === "lists" ? "lists" : "money" };
  }

  function defaultState() {
    return {
      // Categories are generic enough to be useful out of the box, but bank
      // cards are specific accounts - a brand-new account shouldn't start
      // with 8 example cards that aren't real, so all of them start removed
      // and the user adds their own via Settings.
      categories: DEFAULT_CATEGORIES.map(function (c) { return Object.assign({}, c); }),
      transactions: [],
      recurring: [],
      loans: [],
      goals: [],
      tasks: [],
      grocery: defaultGrocery(),
      cards: [],
      customBankCards: [],
      removedBankCards: BANK_CARDS.slice(),
      bankCardConfig: defaultBankCardConfig(),
      nav: defaultNav(),
      ui: defaultUi(),
      settings: { currency: guessCurrency(), accentColor: "orange" }
    };
  }

  function guessCurrency() {
    return "SAR";
  }

  var state = load();
  if (assignCategorySlots()) save();
  applyAccentColor();

  function normalizeState(parsed) {
    if (!parsed.categories || !parsed.categories.length) parsed.categories = defaultState().categories;
    if (!parsed.transactions) parsed.transactions = [];
    if (!parsed.recurring) parsed.recurring = [];
    if (!parsed.loans) parsed.loans = [];
    if (!parsed.goals) parsed.goals = [];
    if (!parsed.cards) parsed.cards = [];
    // To-Do tasks arrived later: backfill for existing accounts, and drop anything malformed.
    parsed.tasks = (Array.isArray(parsed.tasks) ? parsed.tasks : []).map(normalizeTask).filter(Boolean);
    // So did the Grocery list (items, past trips, what the autofill has learned).
    parsed.grocery = normalizeGrocery(parsed.grocery);
    if (!parsed.customBankCards) parsed.customBankCards = [];
    if (!parsed.removedBankCards) parsed.removedBankCards = [];
    if (!parsed.bankCardConfig) parsed.bankCardConfig = defaultBankCardConfig();
    parsed.nav = normalizeNav(parsed.nav);
    parsed.ui = normalizeUi(parsed.ui);
    BANK_CARDS.concat(parsed.customBankCards.map(function (c) { return c.label; })).forEach(function (label) {
      if (!parsed.bankCardConfig[label]) parsed.bankCardConfig[label] = { value: 0 };
    });
    if (!parsed.settings) parsed.settings = { currency: guessCurrency() };
    if (parsed.settings.currency === "USD") parsed.settings.currency = "SAR";
    // Anything unknown (e.g. the removed "forest" preset) falls back to Teal.
    if (!ACCENT_PRESETS.some(function (p) { return p.key === parsed.settings.accentColor; })) parsed.settings.accentColor = "teal";
    // One-time migration: chart color slots used to be permanently baked into
    // the 8 original default categories regardless of use, which starved any
    // custom category of ever getting a real color. Clear that out once so
    // usage-based assignment (assignCategorySlots) can take over.
    if (!parsed.categorySlotsMigratedV2) {
      parsed.categories.forEach(function (c) { c.slot = null; });
      parsed.categorySlotsMigratedV2 = true;
    }
    // One-time migration: slots used to be first-come-first-served and never
    // released, so a category used early could permanently hog a color even
    // after a heavier-spend category came along later with nowhere left to
    // go. Clear slots once more so the new spend-ranked assignment can
    // recompute them correctly for existing accounts.
    if (!parsed.categorySlotsMigratedV3) {
      parsed.categories.forEach(function (c) { c.slot = null; });
      parsed.categorySlotsMigratedV3 = true;
    }
    parsed.categories.forEach(function (c) { if (typeof c.budget !== "number") c.budget = 0; });
    // Goal contributions default to a "Savings" category (see openTransactionForm
    // and openGoalContributionForm) - existing accounts predate it, so backfill
    // it the same way a brand-new account gets it from DEFAULT_CATEGORIES.
    if (!byId(parsed.categories, "savings")) {
      parsed.categories.push({ id: "savings", name: "Savings", slot: null, isSystem: true, keywords: [], budget: 0 });
    }
    if (!parsed.settings.notifyBills) parsed.settings.notifyBills = false;
    // Recurring items didn't used to have a start/end window - backfill
    // existing ones as having always been open-ended, so this migration
    // can't retroactively clip a forecast or trend that already worked.
    parsed.recurring.forEach(function (r) {
      if (!r.startDate) r.startDate = "1970-01-01";
      if (r.endDate === undefined) r.endDate = null;
      if (!r.kind) r.kind = "subscription";
    });
    return parsed;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return normalizeState(JSON.parse(raw));
    } catch (e) { return defaultState(); }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    pushToCloud();
  }

  /* ---------- cloud sync (Firebase Auth + Firestore) ----------
     Multi-tenant: each person signs up with their own email + PIN, backed
     by a real Firebase Auth account so the PIN is genuinely verified
     server-side rather than a fake local lock screen. Firestore documents
     are already keyed by auth UID and the security rules already scope
     each one to its owner, so per-user data isolation needed no changes -
     only the sign-in screen itself was hardcoded to a single email. */

  var LAST_EMAIL_KEY = "ledger.financeTracker.lastEmail";
  var firebaseConfig = {
    apiKey: "AIzaSyA-YbIZYUxgc-4lPR1XJIc30WzuKIjuAeM",
    authDomain: "finance-tracker-32c9e.firebaseapp.com",
    projectId: "finance-tracker-32c9e",
    storageBucket: "finance-tracker-32c9e.firebasestorage.app",
    messagingSenderId: "474926389794",
    appId: "1:474926389794:web:043d382fb237b0c502c87b"
  };

  var cloudEnabled = typeof firebase !== "undefined";
  var auth = null, db = null;
  var isApplyingRemoteUpdate = false;
  var unsubscribeSnapshot = null;
  var pendingFirstAccount = false;

  function pushToCloud() {
    if (!cloudEnabled || isApplyingRemoteUpdate || !auth.currentUser) return;
    // Firestore rejects any field valued `undefined`; round-tripping through
    // JSON strips those defensively rather than risking a write failure.
    var payload = JSON.parse(JSON.stringify(state));
    db.collection("users").doc(auth.currentUser.uid).set(payload).catch(function (err) {
      console.error("Cloud sync failed (will retry once back online):", err);
    });
  }

  function startSync(uid) {
    stopSync();
    unsubscribeSnapshot = db.collection("users").doc(uid).onSnapshot(function (snap) {
      if (snap.metadata.hasPendingWrites) return; // our own optimistic write echoing back
      var data = snap.data();
      if (!data) { pushToCloud(); return; } // brand-new account, seed the cloud doc
      isApplyingRemoteUpdate = true;
      state = normalizeState(data);
      // A category-slot migration inside normalizeState only clears slots -
      // it doesn't reassign them, so a synced device needs this to avoid
      // showing every category as colorless "Other" until its next edit.
      var slotsChanged = assignCategorySlots();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      applyAccentColor();
      renderAll();
      isApplyingRemoteUpdate = false;
      if (slotsChanged) save();
    }, function (err) {
      console.error("Cloud sync listener error:", err);
    });
  }

  function stopSync() {
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  }

  function showLockScreen(mode) {
    pendingFirstAccount = mode === "setup";
    document.getElementById("lock-screen").classList.add("open");
    document.getElementById("lock-pin-confirm").style.display = mode === "setup" ? "block" : "none";
    document.getElementById("lock-title").textContent = mode === "setup" ? "Set Your PIN" : "Enter PIN";
    document.getElementById("lock-sub").textContent = mode === "setup"
      ? "First time here — choose a PIN (6+ characters) to protect and sync your data."
      : "Unlock to sync across your devices.";
    document.getElementById("lock-toggle").textContent = mode === "setup"
      ? "Already have a PIN? Sign in instead"
      : "First time here? Set up your PIN";
    document.getElementById("lock-pin").value = "";
    document.getElementById("lock-pin-confirm").value = "";
    document.getElementById("lock-error").textContent = "";
    document.getElementById("lock-status").textContent = "";
  }

  function hideLockScreen() {
    document.getElementById("lock-screen").classList.remove("open");
  }

  function lockError(message) {
    document.getElementById("lock-error").textContent = message;
  }

  function lockStatus(message) {
    document.getElementById("lock-status").textContent = message;
  }

  function initCloud() {
    if (!cloudEnabled) {
      // Firebase failed to load (offline, blocked, etc.) - degrade to local-only.
      renderAll();
      return;
    }
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

    auth.onAuthStateChanged(function (user) {
      if (user) {
        localStorage.setItem(LAST_EMAIL_KEY, user.email);
        hideLockScreen();
        startSync(user.uid);
        renderAll();
      } else {
        stopSync();
        var rememberedEmail = localStorage.getItem(LAST_EMAIL_KEY);
        if (rememberedEmail) document.getElementById("lock-email").value = rememberedEmail;
        showLockScreen("check");
      }
    });

    document.getElementById("lock-toggle").addEventListener("click", function () {
      showLockScreen(pendingFirstAccount ? "check" : "setup");
    });

    document.getElementById("lock-forgot").addEventListener("click", function () {
      var email = document.getElementById("lock-email").value.trim();
      if (!email) { lockError("Enter your email above first, then tap this again."); return; }
      lockError("");
      lockStatus("Sending reset link…");
      auth.sendPasswordResetEmail(email).then(function () {
        lockStatus("Reset link sent — check your email.");
      }).catch(function (err) {
        lockStatus("");
        lockError(err.message);
      });
    });

    document.getElementById("lock-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("lock-email").value.trim();
      var pin = document.getElementById("lock-pin").value;
      lockError("");
      if (!email) { lockError("Enter your email."); return; }

      if (pendingFirstAccount) {
        var confirmPin = document.getElementById("lock-pin-confirm").value;
        if (pin !== confirmPin) { lockError("PINs don't match — try again."); return; }
        if (pin.length < 6) { lockError("PIN must be at least 6 characters."); return; }
        lockStatus("Setting up…");
        auth.createUserWithEmailAndPassword(email, pin).catch(function (err) {
          lockStatus("");
          if (err.code === "auth/email-already-in-use") {
            showLockScreen("check");
            lockError("An account already exists for that email — enter your PIN to sign in.");
          } else {
            lockError(err.message);
          }
        });
        return;
      }

      lockStatus("Checking…");
      auth.signInWithEmailAndPassword(email, pin).catch(function (err) {
        lockStatus("");
        if (err.code === "auth/user-not-found") {
          showLockScreen("setup");
        } else if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
          lockError("Incorrect email or PIN.");
        } else {
          lockError(err.message);
        }
      });
    });
  }

  /* ---------- helpers ---------- */

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function categoryColor(cat) {
    if (!cat || cat.slot === null || cat.slot === undefined) return OTHER_COLOR;
    return CAT_COLORS[cat.slot] || OTHER_COLOR;
  }

  function monogram(name) {
    var letters = (name || "?").replace(/[^A-Za-z]/g, "");
    return (letters.slice(0, 2) || "?").toUpperCase();
  }

  function fmtMoney(amount) {
    if (state.settings.currency === "SAR") return fmtSAR(amount);
    try {
      return new Intl.NumberFormat(navigator.language || "en-US", { style: "currency", currency: state.settings.currency, currencyDisplay: "narrowSymbol" }).format(amount);
    } catch (e) {
      return state.settings.currency + " " + amount.toFixed(2);
    }
  }

  function fmtSAR(amount) {
    var sign = amount < 0 ? "-" : "";
    var num;
    try {
      num = new Intl.NumberFormat(navigator.language || "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(amount));
    } catch (e) {
      num = Math.abs(amount).toFixed(2);
    }
    return sign + '<span class="sar-symbol">⃁</span> ' + num;
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function fmtDateShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function fmtDateLong(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function currentMonthKey() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }
  function monthKeyOf(iso) { return iso.slice(0, 7); }

  /* ---------- dashboard period (month/year navigation) ---------- */

  /* A function, not a cached Date - a value captured once at page load would
     go stale in a long-running tab (or an iOS home-screen app, which the OS
     suspends in the background rather than reloading), so every "current
     date" read needs to reflect the real moment it's called, not whenever
     the script first ran. */
  function today() { return new Date(); }
  var viewPeriod = { type: "month", year: today().getFullYear(), month: today().getMonth() + 1 };

  function periodRange(period) {
    if (period.type === "year") {
      return {
        start: period.year + "-01-01",
        end: (period.year + 1) + "-01-01",
        label: String(period.year)
      };
    }
    var start = period.year + "-" + pad(period.month) + "-01";
    var nextMonthDate = new Date(period.year, period.month, 1);
    var end = nextMonthDate.getFullYear() + "-" + pad(nextMonthDate.getMonth() + 1) + "-01";
    var label = new Date(period.year, period.month - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    return { start: start, end: end, label: label };
  }

  function isCurrentMonthPeriod(period) {
    return period.type === "month" && period.year === today().getFullYear() && period.month === today().getMonth() + 1;
  }

  function shiftPeriod(delta) {
    if (viewPeriod.type === "year") {
      viewPeriod = { type: "year", year: viewPeriod.year + delta };
    } else {
      var m = viewPeriod.month + delta;
      var y = viewPeriod.year;
      while (m > 12) { m -= 12; y++; }
      while (m < 1) { m += 12; y--; }
      viewPeriod = { type: "month", year: y, month: m };
    }

  }

  function setPeriodType(type) {
    viewPeriod = { type: type, year: viewPeriod.year, month: viewPeriod.month };
    renderDashboard();
  }

  function transactionsInRange(start, end) {
    return state.transactions.filter(function (t) { return t.date >= start && t.date < end; });
  }

  function addInterval(iso, frequency) {
    var d = new Date(iso + "T00:00:00");
    if (frequency === "weekly") d.setDate(d.getDate() + 7);
    else if (frequency === "quarterly") d.setMonth(d.getMonth() + 3);
    else if (frequency === "biannual") d.setMonth(d.getMonth() + 6);
    else if (frequency === "yearly") d.setFullYear(d.getFullYear() + 1);
    else d.setMonth(d.getMonth() + 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function subtractInterval(iso, frequency) {
    var d = new Date(iso + "T00:00:00");
    if (frequency === "weekly") d.setDate(d.getDate() - 7);
    else if (frequency === "quarterly") d.setMonth(d.getMonth() - 3);
    else if (frequency === "biannual") d.setMonth(d.getMonth() - 6);
    else if (frequency === "yearly") d.setFullYear(d.getFullYear() - 1);
    else d.setMonth(d.getMonth() - 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  /* How many times a recurring schedule anchored at anchorISO lands inside
     [rangeStart, rangeEnd) - walking backward first when the anchor is
     already past rangeStart, so this works equally well for a future month
     (the common case) and a past one (Spending Trend's actual-vs-forecast
     needs the same schedule projected backward across recent history). */
  /* itemStart/itemEnd are the recurring item's (or loan's) own active
     window - a promotional subscription that ends in March shouldn't keep
     projecting into April just because its weekly/monthly schedule would
     otherwise carry on forever. Both are optional; omit either to leave
     that side unbounded. */

    var d = anchorISO;
    var guard = 0;
    if (d < rangeStart) {
      while (d < rangeStart && guard < 600) { d = addInterval(d, frequency); guard++; }
    } else {
      while (d >= rangeStart && guard < 600) { d = subtractInterval(d, frequency); guard++; }
      guard = 0;
      while (d < rangeStart && guard < 600) { d = addInterval(d, frequency); guard++; }
    }
    var count = 0;
    guard = 0;
    while (d < rangeEnd && guard < 600) {
      if ((!itemEnd || d <= itemEnd) && (!itemStart || d >= itemStart)) count++;
      d = addInterval(d, frequency);
      guard++;

    return count;
  }

     generalized to any date range instead of a matrix keyed by category -
     Spending Trend needs one flat total per month, past or present.
     Recurring income (salary etc.) is deliberately excluded - this feeds
     an expense-only forecast, same as the Forecast tab's own matrix. */
  function forecastTotalForRange(rangeStart, rangeEnd) {
    var total = 0;
    state.recurring.filter(function (r) { return r.isActive && r.kind !== "income"; }).forEach(function (r) {
      total += occurrencesInRange(r.nextDueDate, r.frequency, rangeStart, rangeEnd, r.startDate, r.endDate) * r.amount;
    });
    state.loans.filter(function (l) { return l.isActive; }).forEach(function (l) {
      total += occurrencesInRange(l.nextPaymentDate, "monthly", rangeStart, rangeEnd, l.startDate, l.endDate) * l.monthlyPayment;
    });
    return total;
  }

     period picker (which only affects the stat cards above). */
  function lastNMonths(n) {

    var months = [];
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      var next = new Date(base.getFullYear(), base.getMonth() - i + 1, 1);

        start: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-01",
        end: next.getFullYear() + "-" + pad(next.getMonth() + 1) + "-01"

    }
    return months;
  }

     based estimate (loan balance, in particular) would draw a smooth trend
     line for a period that was never actually tracked. Returns null if
     there's no transaction history at all. */

    if (!state.transactions.length) return null;
    var earliest = state.transactions.reduce(function (a, t) { return t.date < a ? t.date : a; }, state.transactions[0].date);

    var base = new Date(today().getFullYear(), today().getMonth(), 1);

    if (count < 2) return null;

  function callImportApi(payload) {

    // serverless function that never comes back) leaves the caller's
    // button disabled forever with no way out - 45s is generous for a
    // model call but still short enough that a real hang doesn't strand
    // the user indefinitely.

    var timeoutId = controller && setTimeout(function () { timedOut = true; controller.abort(); }, 45000);

    // The import endpoint requires a signed-in finance-tracker user (every
    // real user already is one - the app itself is locked behind Firebase
    // auth) so it can verify the caller server-side instead of being a
    // fully anonymous public endpoint anyone with the URL can hammer.
    var idTokenPromise = (cloudEnabled && auth && auth.currentUser) ? auth.currentUser.getIdToken() : Promise.resolve(null);

      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.detail ? (data.error + ": " + data.detail) : (data.error || "Import failed"));

      return found;
    }, function (err) {

      var type = t.type === "income" ? "income" : "expense";
      var date = (t.date && /^\d{4}-\d{2}-\d{2}$/.test(t.date)) ? t.date : todayISO();
      var categoryId = suggestCategoryFromHistory(merchant) || suggestCategory(merchant);
      state.transactions.push({

        type: type,
        categoryId: categoryId || null,
        bankCard: null,
        isGoalContribution: false,
        goalId: null,
        needsReview: true

  }

    html += '<p class="footnote" id="text-import-count" style="margin:-6px 0 12px"></p>';

        .map(function (r) { return { kind: "recurring", id: r.id, name: r.name, categoryId: r.categoryId, dueDate: r.nextDueDate, amount: r.amount }; });
      var upcomingLoans = state.loans
        .filter(function (l) { return l.isActive && !loanProgress(l).isPaidOff && daysUntil(l.nextPaymentDate) <= 30; })
        .map(function (l) { return { kind: "loan", id: l.id, name: l.name, categoryId: l.categoryId, dueDate: l.nextPaymentDate, amount: l.monthlyPayment }; });
      var upcoming = upcomingBills.concat(upcomingLoans)
        .sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; });
      if (upcoming.length) {
        html += '<div class="card card-upcoming"><h2>Upcoming Bills</h2>';
        upcoming.forEach(function (item) {
          var cat = byId(state.categories, item.categoryId);
          var d = daysUntil(item.dueDate);
          html += '<div class="row" data-open-' + item.kind + '="' + item.id + '">';
          html += badgeHtml(cat, 30);
          html += '<div class="main"><div class="title">' + escapeHtml(item.name) + '</div><div class="meta">' + fmtDateShort(item.dueDate) + (item.kind === "loan" ? " · Loan" : "") + (d <= 3 ? dueChip(d, true) : "") + '</div></div>';
          html += '<div class="amount num">' + fmtMoney(item.amount) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }
    }

    if (!periodTx.length) {
      html += emptyState("inbox", "Nothing yet", "Add a transaction to see your dashboard come to life.");
    }

    document.getElementById("tab-dashboard").innerHTML = html;
    wireDashboardEvents();
    animateDashboardStats(spent, income, income - spent);

    if (monthPickerScroll !== null) {
      var newMonthPicker = document.querySelector("#tab-dashboard .month-picker");
      if (newMonthPicker) newMonthPicker.scrollLeft = monthPickerScroll;
    }
    wireMonthScroll();
  }

  /* Counts the three headline stats up/down from their last-rendered value
     rather than just snapping to the new one - runs on every dashboard
     render (data change, period navigation), so it doubles as a "this
     number just changed" cue. Starts from 0 on first paint. Skipped
     entirely under reduced-motion, where the final value is shown as-is. */
  var lastStatValues = null;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function animateDashboardStats(spent, income, net) {
    var targets = { spent: spent, income: income, net: net };
    var from = lastStatValues || { spent: 0, income: 0, net: 0 };
    lastStatValues = targets;

    Object.keys(targets).forEach(function (key) {
      var el = document.getElementById("stat-" + key);
      if (!el) return;
      if (reduceMotion || from[key] === targets[key]) { el.innerHTML = fmtMoney(targets[key]); return; }
      var start = null;
      var duration = 500;
      function step(ts) {
        if (start === null) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.innerHTML = fmtMoney(from[key] + (targets[key] - from[key]) * eased);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function dueChip(d, small) {
    var label = d <= 0 ? "Due today" : "Due in " + d + "d";
    var cls = d <= 1 ? "critical" : "warning";
    return '<span class="chip ' + cls + (small ? " chip-sm" : "") + '">' + icon("alert") + label + '</span>';
  }

  /* Budgets are set per category (Settings > Categories > edit a category)
     and only make sense against a single month, so this card is hidden in
     Year view. byCat is the same expense-by-category map the donut chart
     already computed for the current period - no separate pass needed. */
  function renderBudgetsCard(byCat) {
    if (viewPeriod.type !== "month") return "";
    var budgeted = state.categories.filter(function (c) { return c.budget > 0; });
    if (!budgeted.length) return "";
    var html = '<div class="card"><h2>Budgets</h2>';
    budgeted.forEach(function (c) {
      var spent = byCat[c.id] || 0;
      var ratio = spent / c.budget;
      var status = utilStatus(ratio);
      var remaining = c.budget - spent;
      html += '<div style="margin-bottom:14px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:baseline">';
      html += '<span style="font-size:14px;font-weight:600">' + escapeHtml(c.name) + '</span>';
      html += '<span class="chip ' + status + '">' + (remaining < 0 ? "Over by " + fmtMoney(-remaining) : fmtMoney(remaining) + " left") + '</span>';
      html += '</div>';
      html += '<div class="bar-track"><div class="bar-fill ' + status + '" style="width:' + (Math.min(ratio, 1) * 100) + '%"></div></div>';
      html += '<div class="footnote num">' + fmtMoney(spent) + ' of ' + fmtMoney(c.budget) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function expensedInRange(label, start, end) {
    return state.transactions
      .filter(function (t) { return t.bankCard === label && t.type === "expense" && t.date >= start && t.date < end; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
  }

  function incomeInRange(label, start, end) {
    return state.transactions
      .filter(function (t) { return t.bankCard === label && t.type === "income" && t.date >= start && t.date < end; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
  }

  /* A transfer only nets to zero - and so should be excluded from
     Income/Expenses - when BOTH legs land inside the same aggregate being
     summed (e.g. moving money between two of the user's own debit cards:
     it's an expense on one and income on the other, canceling out). A
     transfer whose other leg falls outside that aggregate is real money
     crossing the boundary and should count like any ordinary transaction
     - most commonly, paying a credit card bill from a debit account is a
     genuine outgoing payment (expense) on the debit side, not a wash,
     even though it's stored as a transfer. */
  function isInternalTransfer(t, cardSet) {
    if (!t.isTransfer) return false;
    var other = state.transactions.filter(function (o) { return o.transferId === t.transferId && o.id !== t.id; })[0];
    return !!(other && cardSet.indexOf(other.bankCard) !== -1);
  }

  /* A debit card's opening balance for any period is derived, not stored:
     the one-time starting balance (set in Settings), net of every expense
     (subtracted) and income/deposit (added) dated before the period began.
     So "close" a month simply by moving to the next one - its opening
     balance is automatically last month's closing available balance, with
     no explicit rollover step needed. */
  function openingBalanceAt(label, periodStartISO) {
    var initial = (state.bankCardConfig[label] && state.bankCardConfig[label].value) || 0;
    var priorNet = state.transactions
      .filter(function (t) { return t.bankCard === label && t.date < periodStartISO && (t.type === "expense" || t.type === "income"); })
      .reduce(function (s, t) { return s + (t.type === "income" ? t.amount : -t.amount); }, 0);
    return initial + priorNet;
  }

  /* A credit card's balance owed carries forward exactly like a debit
     card's opening balance does (see openingBalanceAt above), just in
     the opposite direction: every expense before the period increases
     what's owed, every payment before it decreases what's owed. Without
     this, "Used" only reflected the current period's own charges and
     silently dropped any unpaid balance the moment the month rolled
     over - the same all-time carry-forward the Net Worth card's
     Liabilities figure already does correctly (see renderNetWorthCard),
     just missing here on the Cards page itself. */
  function creditOwedBefore(label, periodStartISO) {
    return state.transactions
      .filter(function (t) { return t.bankCard === label && t.date < periodStartISO && (t.type === "expense" || t.type === "income"); })
      .reduce(function (s, t) { return s + (t.type === "expense" ? t.amount : -t.amount); }, 0);
  }

  function renderBankCardSummary(range) {
    var debitCards = allBankCards().filter(function (l) { return bankCardType(l) === "debit"; });
    var creditCards = allBankCards().filter(function (l) { return bankCardType(l) === "credit"; });

    var html = "";
    html += '<div class="card"><h2>Debit Cards (MADA)</h2>';
    debitCards.forEach(function (label) {
      var opening = openingBalanceAt(label, range.start);
      var expensed = expensedInRange(label, range.start, range.end);
      var income = incomeInRange(label, range.start, range.end);
      var available = opening + income - expensed;
      var effectiveBase = opening + income;
      var pct = effectiveBase > 0 ? Math.min(Math.max(expensed / effectiveBase, 0), 1) : 0;
      var status = available < 0 ? "critical" : utilStatus(pct);
      html += bankCardRow(label, "Opening", opening, "Expensed", expensed, available, status, pct, income);
    });
    html += '</div>';

    html += '<div class="card"><h2>Credit Cards (Visa / Mastercard)</h2>';
    creditCards.forEach(function (label) {
      var limit = (state.bankCardConfig[label] && state.bankCardConfig[label].value) || 0;
      var owedBefore = creditOwedBefore(label, range.start);
      var usedThisPeriod = expensedInRange(label, range.start, range.end);
      var paidThisPeriod = incomeInRange(label, range.start, range.end);
      var used = owedBefore + usedThisPeriod - paidThisPeriod;
      var available = limit - used;
      var pct = limit > 0 ? Math.min(Math.max(used / limit, 0), 1) : 0;
      var status = available < 0 ? "critical" : utilStatus(pct);
      html += bankCardRow(label, "Limit", limit, "Used", used, available, status, pct, paidThisPeriod);
    });
    html += '</div>';

    return html;
  }

  function bankCardRow(label, capLabel, capValue, usedLabel, usedValue, available, status, pct, income) {
    var html = '<div style="margin-bottom:14px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline">';
    html += '<span style="font-size:14px;font-weight:600">' + escapeHtml(label) + '</span>';
    html += '<span class="chip ' + status + '">' + fmtMoney(available) + ' left</span>';
    html += '</div>';
    html += '<div class="bar-track"><div class="bar-fill ' + status + '" style="width:' + (pct * 100) + '%"></div></div>';
    html += '<div class="footnote num">' + capLabel + ' ' + fmtMoney(capValue) +
      (income ? ' · Income ' + fmtMoney(income) : '') +
      ' · ' + usedLabel + ' ' + fmtMoney(usedValue) + '</div>';
    html += '</div>';
    return html;
  }

  /* squashY < 1 flattens the circle into an ellipse - the standard trick
     for reading a flat 2D shape as a disc viewed from above at an angle
     (isometric-style) rather than dead-on. Applied to every y coordinate
     and to the arc's y-radius so the curve itself is elliptical too, not
     just the points. */
  function donutWedgePath(cx, cy, rInner, rOuter, a0, a1, squashY) {
    var largeArc = (a1 - a0) > Math.PI ? 1 : 0;
    var p0x = cx + rOuter * Math.cos(a0), p0y = cy + rOuter * Math.sin(a0) * squashY;
    var p1x = cx + rOuter * Math.cos(a1), p1y = cy + rOuter * Math.sin(a1) * squashY;
    var p2x = cx + rInner * Math.cos(a1), p2y = cy + rInner * Math.sin(a1) * squashY;
    var p3x = cx + rInner * Math.cos(a0), p3y = cy + rInner * Math.sin(a0) * squashY;
    return "M" + p0x.toFixed(2) + "," + p0y.toFixed(2) +
      " A" + rOuter + "," + (rOuter * squashY).toFixed(2) + " 0 " + largeArc + " 1 " + p1x.toFixed(2) + "," + p1y.toFixed(2) +
      " L" + p2x.toFixed(2) + "," + p2y.toFixed(2) +
      " A" + rInner + "," + (rInner * squashY).toFixed(2) + " 0 " + largeArc + " 0 " + p3x.toFixed(2) + "," + p3y.toFixed(2) +
      " Z";
  }

  /* The extruded "side" of one wedge - not a flat duplicate shifted down
     (which reads as a drop shadow, not a solid edge), but an actual wall
     following the wedge's full silhouette: both straight radial cuts and
     the curved outer rim, each rendered as its own quad running from the
     top surface down to top+depth. Built as one multi-subpath `d` string
     (a plain SVG path can hold any number of "M...Z" pieces and still
     fill as a single shape) so it stays one <path> element - the same
     shape used to work with the existing bounce/explode CSS, which only
     ever cares about the element's class, not what's inside `d`.

     Only the front half of a tilted disc's rim actually has visible
     thickness - the far/back half's wall is physically occluded by the
     disc's own bulk, the same reason you can't see the far edge of a
     tilted coin. Drawing a full-height wall all the way around (the
     previous version of this function) is what made the wedges sitting
     near the back of the disc - inevitably the smaller slices, since the
     big ones dominate the front - look like a flat colored top plate
     with an unrelated dark plate floating under it rather than one solid
     3D shape: there was no front rim there to explain the dark shape's
     presence. frontDepth() below fades each point's wall height to zero
     by sin(angle) (our convention: sin>0 is the near/bottom half of the
     ellipse, i.e. toward the viewer) instead of a hard cutoff, so the
     wall tapers smoothly to nothing right at the silhouette edge instead
     of snapping off into a visible shelf. */
  function frontDepth(a, depth) { return depth * Math.max(0, Math.sin(a)); }
  function wallQuad(px, py, qx, qy, pDepth, qDepth) {
    return "M" + px.toFixed(2) + "," + py.toFixed(2) +
      "L" + qx.toFixed(2) + "," + qy.toFixed(2) +
      "L" + qx.toFixed(2) + "," + (qy + qDepth).toFixed(2) +
      "L" + px.toFixed(2) + "," + (py + pDepth).toFixed(2) + "Z";
  }
  function wedgeWallPath(cx, cy, rOuter, a0, a1, squashY, depth) {
    var steps = Math.max(4, Math.ceil((a1 - a0) / (Math.PI / 36)));
    var pts = [];
    for (var i = 0; i <= steps; i++) {
      var a = a0 + (a1 - a0) * (i / steps);
      pts.push({ x: cx + rOuter * Math.cos(a), y: cy + rOuter * Math.sin(a) * squashY, d: frontDepth(a, depth) });
    }
    var d = "";
    if (pts[0].d > 0.01) d += wallQuad(cx, cy, pts[0].x, pts[0].y, pts[0].d, pts[0].d);
    for (var j = 0; j < pts.length - 1; j++) {
      var p = pts[j], q = pts[j + 1];
      if (p.d > 0.01 || q.d > 0.01) d += wallQuad(p.x, p.y, q.x, q.y, p.d, q.d);
    }
    var last = pts[pts.length - 1];
    if (last.d > 0.01) d += wallQuad(last.x, last.y, cx, cy, last.d, last.d);
    return d;
  }

  /* Resolves any CSS color (a var(--catN) reference included) to its
     actual rendered [r, g, b] via a throwaway probe element - works
     everywhere, unlike color-mix(), which the donut's gradients used to
     lean on directly inside SVG stop-color/fill attributes. That
     combination (a CSS Color Level 5 function, nested var() resolution,
     inside an SVG presentation attribute rather than a stylesheet) needs a
     fairly recent Chromium and can silently fail on an older WebView -
     MoneyQuill's Android build (same donut code, ported from here) hit
     exactly that: the whole donut rendered invisibly on-device despite
     looking correct in desktop/mobile browser testing. Resolving here and
     blending manually below sidesteps the compatibility gap entirely. */
  function resolveColorRgb(cssColor) {
    var probe = document.createElement("span");
    probe.style.color = cssColor;
    probe.style.display = "none";
    document.body.appendChild(probe);
    var resolved = getComputedStyle(probe).color;
    document.body.removeChild(probe);
    var m = resolved.match(/[\d.]+/g);
    return m ? [Number(m[0]), Number(m[1]), Number(m[2])] : [0, 0, 0];
  }

  /* Picks readable text ink for a wedge's own fill rather than a fixed
     white, since the categorical palette's lighter hues (yellow, aqua)
     don't clear contrast with white. */
  function donutLabelColor(cssColor) {
    var rgb = resolveColorRgb(cssColor);
    var lum = 0.2126 * (rgb[0] / 255) + 0.7152 * (rgb[1] / 255) + 0.0722 * (rgb[2] / 255);
    return lum > 0.6 ? "#171717" : "#ffffff";
  }

  /* Mirrors color-mix(in srgb, cssColor <pct*100>%, mixWithRgb) - blends
     pct of cssColor's resolved RGB with the given RGB, in plain rgb()
     output rather than a CSS function, so it renders identically
     everywhere. */
  function mixColor(cssColor, pct, mixWithRgb) {
    var rgb = resolveColorRgb(cssColor);
    var mr = Math.round(rgb[0] * pct + mixWithRgb[0] * (1 - pct));
    var mg = Math.round(rgb[1] * pct + mixWithRgb[1] * (1 - pct));
    var mb = Math.round(rgb[2] * pct + mixWithRgb[2] * (1 - pct));
    return "rgb(" + mr + ", " + mg + ", " + mb + ")";
  }

  /* The ring itself is capped at the 24-color palette (see
     assignCategorySlots) - a 25th distinct category folds its arc into
     one shared grey "Other" slice rather than generating an unvalidated
     extra hue. But that's purely a ring-color limitation, not a categorization
     one: every category the user actually assigned still gets its own named
     row in the legend below, each keeping its real name and exact amount.
     Only genuinely uncategorized spend (no categoryId at all) is ever
     labeled "Uncategorized" - a category without a color slot is never
     mistaken for one. */
  // The opt-in "soft" skin (see the data-skin CSS) draws the chart as a
  // flat ring in a pressed dish instead of the tilted, extruded pie.
  function isSoftSkin() {
    return document.documentElement.getAttribute("data-skin") === "soft";
  }

  function renderDonut(byCat, total) {
    var soft = isSoftSkin();
    var SQUASH_Y = soft ? 1 : 0.6, WALL_DEPTH = soft ? 0 : 14;
    var cx = 88, cy = 88 - WALL_DEPTH / 2, rOuter = 74, rInner = soft ? 50 : 0, rLabel = soft ? (rOuter + rInner) / 2 : rOuter * 0.6;
    var gapRad = soft ? 0.07 : 0.045, explodeDist = soft ? 0 : 3;

    var ordered = state.categories.filter(function (c) { return c.slot !== null && c.slot !== undefined; })
      .sort(function (a, b) { return a.slot - b.slot; });

    var ringSegments = [];
    var legendRows = [];
    ordered.forEach(function (c) {
      var amt = byCat[c.id] || 0;
      if (amt <= 0) return;
      var segIndex = ringSegments.length;
      var color = categoryColor(c);
      ringSegments.push({ amt: amt, color: color });
      legendRows.push({ name: c.name, amt: amt, color: color, segIndex: segIndex });
    });

    var otherSegIndex = -1, otherAmt = 0;
    function foldIntoOther(name, amt) {
      if (otherSegIndex === -1) {
        otherSegIndex = ringSegments.length;
        ringSegments.push({ amt: 0, color: OTHER_COLOR });
      }
      otherAmt += amt;
      legendRows.push({ name: name, amt: amt, color: OTHER_COLOR, segIndex: otherSegIndex });
    }
    state.categories.filter(function (c) { return c.slot === null || c.slot === undefined; }).forEach(function (c) {
      var amt = byCat[c.id] || 0;
      if (amt > 0) foldIntoOther(c.name, amt);
    });
    if (byCat["__none"]) foldIntoOther("Uncategorized", byCat["__none"]);
    if (otherSegIndex !== -1) ringSegments[otherSegIndex].amt = otherAmt;

    var n = ringSegments.length;
    var startAngle = -Math.PI / 2;
    var cum = 0;
    var defsSvg = "", shadowsSvg = "", wedgesSvg = "", labelsSvg = "";

    // A single light position shared by every wedge, fixed in disc space
    // rather than each wedge's own bounding box, is what makes the ring
    // read as one lit object instead of N separately-lit chips - with a
    // per-wedge-relative highlight (the old objectBoundingBox default),
    // every wedge gets its own bright spot in its own corner regardless of
    // where it sits on the disc, which is exactly what breaks the illusion
    // of one continuous surface and makes it look like loose, separate
    // pieces. Placed up and to the left of disc center, like an overhead
    // light from that direction.
    var lightCx = cx - rOuter * 0.4;
    var lightCy = cy - rOuter * SQUASH_Y * 0.55;
    var lightR = rOuter * 1.4;

    // The wall's own vertical gradient, shared bounds for every wedge: it
    // starts at the top face's own rim color (seg.color, unmixed - the
    // same color the radial gradient above settles to at the rim) and
    // only then darkens going down. A flat, pre-darkened wall color here
    // instead creates a hard brightness jump right at the seam where the
    // top face meets the wall, which is what makes the two pieces read as
    // separate flat surfaces stacked together rather than one curved
    // object - the gradient keeps the wall a continuation of the same lit
    // surface instead of an unrelated dark panel glued on underneath.
    var wallGradTopY = cy;
    var wallGradBottomY = cy + rOuter * SQUASH_Y + WALL_DEPTH;
    ringSegments.forEach(function (seg, i) {
      var frac = seg.amt / total;
      var a0 = startAngle + cum * 2 * Math.PI;
      var a1 = startAngle + (cum + frac) * 2 * Math.PI;
      // A lone full-circle arc has identical start and end points, which SVG
      // draws as nothing - stop a hair short so a single category still shows.
      if (soft && frac > 0.9999) a1 = a0 + 2 * Math.PI * 0.9999;
      cum += frac;
      var pad = n > 1 ? Math.min(gapRad / 2, ((a1 - a0) / 2) * 0.9) : 0;
      var pa0 = a0 + pad, pa1 = a1 - pad;
      var mid = (pa0 + pa1) / 2;
      var tx = (Math.cos(mid) * explodeDist).toFixed(2);
      var ty = (Math.sin(mid) * explodeDist * SQUASH_Y).toFixed(2);
      var d = donutWedgePath(cx, cy, rInner, rOuter, pa0, pa1, SQUASH_Y);
      var wallD = soft ? "" : wedgeWallPath(cx, cy, rOuter, pa0, pa1, SQUASH_Y, WALL_DEPTH);
      var styleVars = "--tx:" + tx + "px;--ty:" + ty + "px;--i:" + i;

      // A radial highlight (light near the center, true color at the rim)
      // is what sells the top face as a lit, slightly curved surface
      // rather than a flat tinted shape; the wall beneath (wedgeWallPath,
      // flat dark fill, no gradient) is what actually reads as thickness.
      // gradientUnits="userSpaceOnUse" with the shared lightCx/lightCy/lightR
      // computed above (rather than the objectBoundingBox default) is what
      // keeps that highlight at one fixed spot on the disc for every wedge.
      var gradId = "donut-grad-" + i;
      var gradStart = mixColor(seg.color, 0.55, [255, 255, 255]);
      if (!soft) defsSvg += '<radialGradient id="' + gradId + '" gradientUnits="userSpaceOnUse" cx="' + lightCx.toFixed(2) + '" cy="' + lightCy.toFixed(2) + '" r="' + lightR.toFixed(2) + '">' +
        '<stop offset="0%" stop-color="' + gradStart + '" />' +
        '<stop offset="100%" stop-color="' + seg.color + '" />' +
        '</radialGradient>';
      var wallGradId = "donut-wallgrad-" + i;
      if (!soft) defsSvg += '<linearGradient id="' + wallGradId + '" gradientUnits="userSpaceOnUse" x1="0" y1="' + wallGradTopY.toFixed(2) + '" x2="0" y2="' + wallGradBottomY.toFixed(2) + '">' +
        '<stop offset="0%" stop-color="' + seg.color + '" />' +
        '<stop offset="100%" stop-color="' + mixColor(seg.color, 0.45, [0, 0, 0]) + '" />' +
        '</linearGradient>';
      if (!soft) shadowsSvg += '<path class="donut-seg-shadow" data-seg="' + i + '" d="' + wallD + '" fill="url(#' + wallGradId + ')" style="' + styleVars + '"></path>';
      wedgesSvg += '<path class="donut-seg" data-seg="' + i + '" d="' + d + '" fill="' + (soft ? seg.color : 'url(#' + gradId + ')') + '" style="' + styleVars + '"></path>';

      var pct = Math.round(frac * 100);
      if (pct >= 6) {
        var lx = (cx + Math.cos(mid) * rLabel).toFixed(2);
        var ly = (cy + Math.sin(mid) * rLabel * SQUASH_Y).toFixed(2);
        labelsSvg += '<text class="donut-seg-label" data-seg="' + i + '" x="' + lx + '" y="' + ly + '" fill="' + donutLabelColor(seg.color) + '" style="' + styleVars + '">' + pct + '%</text>';
      }
    });

    // A soft blurred ellipse under the whole shape sells it as an object
    // resting on a surface rather than floating flat against the page -
    // feGaussianBlur is basic SVG 1.1, safe on any WebView old enough to
    // matter here (unlike color-mix(), see resolveColorRgb() above).
    var groundShadowD = '<ellipse cx="' + cx + '" cy="' + (cy + rOuter * SQUASH_Y + WALL_DEPTH + 5).toFixed(2) + '" rx="' + (rOuter * 0.94).toFixed(2) + '" ry="' + (rOuter * SQUASH_Y * 0.24).toFixed(2) + '" fill="rgba(0,0,0,0.18)" filter="url(#donut-ground-blur)"></ellipse>';
    var groundFilter = '<filter id="donut-ground-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5" /></filter>';

    var svg = '<svg viewBox="0 0 176 176" class="donut-svg"><defs>' + (soft ? "" : groundFilter) + defsSvg + '</defs>' + (soft ? "" : groundShadowD) + shadowsSvg + wedgesSvg + labelsSvg + '</svg>';

    var html = soft
      ? '<div class="donut-wrap donut-soft">' + svg + '<div class="donut-core"><div class="amt num">' + fmtMoney(total) + '</div><div class="lbl">Total spent</div></div></div>'
      : '<div class="donut-wrap">' + svg + '</div>' +
        '<div class="donut-total"><div class="amt num">' + fmtMoney(total) + '</div><div class="lbl">Total spent</div></div>';

    var sortedLegend = legendRows.slice().sort(function (a, b) { return b.amt - a.amt; });
    html += '<div class="legend">';
    sortedLegend.forEach(function (row) {
      var pct = Math.round((row.amt / total) * 100);
      html += '<div class="legend-row" data-seg="' + row.segIndex + '">' +
        '<span class="dot" style="background:' + row.color + '"></span>' +
        '<div class="legend-main">' +
        '<div class="legend-top"><span class="name">' + escapeHtml(row.name) + '</span><span class="amt num">' + fmtMoney(row.amt) + '</span></div>' +
        '<div class="legend-bar-track"><div class="legend-bar-fill" style="width:' + pct + '%;background:' + row.color + '"></div></div>' +
        '</div>' +
        '<span class="pct num">' + pct + '%</span></div>';
    });
    html += '</div>';
    return html;
  }

  function wireDonutHover() {
    var wrap = document.querySelector("#tab-dashboard .donut-wrap");
    if (!wrap) return;
    var segs = document.querySelectorAll("#tab-dashboard .donut-seg, #tab-dashboard .donut-seg-shadow");
    var labels = document.querySelectorAll("#tab-dashboard .donut-seg-label");
    var rows = document.querySelectorAll("#tab-dashboard .legend-row");
    function setActive(idx) {
      wrap.classList.toggle("hovering", idx !== null);
      segs.forEach(function (s) { s.classList.toggle("active", s.getAttribute("data-seg") === idx); });
      labels.forEach(function (l) { l.classList.toggle("active", l.getAttribute("data-seg") === idx); });
      rows.forEach(function (r) { r.classList.toggle("dim", idx !== null && r.getAttribute("data-seg") !== idx); });
    }
    // mouseenter/mouseleave alone never fire on a touch device, so on phones
    // - this app's actual primary platform - tapping a wedge or legend row
    // did nothing at all. pinnedIdx adds a tap-to-toggle on top of the
    // existing hover behavior: tapping pins a segment active (ignoring
    // hover) until it's tapped again, which also doubles as a "lock the
    // highlight" convenience on desktop.
    var pinnedIdx = null;
    function hoverOn(idx) { if (pinnedIdx === null) setActive(idx); }
    function hoverOff() { if (pinnedIdx === null) setActive(null); }
    function toggleTap(idx) {
      pinnedIdx = (pinnedIdx === idx) ? null : idx;
      setActive(pinnedIdx);
    }
    segs.forEach(function (s) {
      var idx = s.getAttribute("data-seg");
      s.addEventListener("mouseenter", function () { hoverOn(idx); });
      s.addEventListener("mouseleave", hoverOff);
      s.addEventListener("click", function () { toggleTap(idx); });
    });
    rows.forEach(function (r) {
      var idx = r.getAttribute("data-seg");
      r.addEventListener("mouseenter", function () { hoverOn(idx); });
      r.addEventListener("mouseleave", hoverOff);
      r.addEventListener("click", function () { toggleTap(idx); });
    });
  }

  /* Wedges render already in their resting (exploded) position by default,
     so the chart is correct even without this. What this adds is the
     scroll-triggered flourish: each time the donut card enters the
     viewport, it briefly resets to collapsed-at-center and replays the
     wiggle-into-place entrance - not just once ever, but every time the
     user scrolls back to it. */
  // Every dashboard render calls this, and each one replaces #tab-dashboard's
  // whole innerHTML - without disconnecting, the previous observer would go
  // on holding a strong reference to the now-detached old .donut-wrap
  // forever, one leaked observer per render.
  var donutScrollObserver = null;

  function wireDonutScrollAnim() {
    if (donutScrollObserver) { donutScrollObserver.disconnect(); donutScrollObserver = null; }
    var wrap = document.querySelector("#tab-dashboard .donut-wrap");
    if (!wrap || !window.IntersectionObserver || reduceMotion) return;
    var segCount = wrap.querySelectorAll(".donut-seg").length;
    var totalMs = segCount * 55 + 700;
    var settleTimer = null;

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          clearTimeout(settleTimer);
          wrap.classList.remove("animating");
          wrap.classList.add("pending");
          void wrap.offsetWidth; // force reflow so the reset is visible before replaying
          wrap.classList.remove("pending");
          wrap.classList.add("animating");
          settleTimer = setTimeout(function () { wrap.classList.remove("animating"); }, totalMs);
        } else {
          clearTimeout(settleTimer);
          wrap.classList.remove("animating");
          wrap.classList.add("pending");
        }
      });
    }, { threshold: 0.4 });
    donutScrollObserver = observer;
    observer.observe(wrap);
  }

  function renderSpendingTrendCard() {
    var months = trendMonths(6);
    if (!months) return "";
    var totals = months.map(function (m) {
      return state.transactions.filter(function (t) {
        return !t.isTransfer && !t.isGoalContribution && t.type === "expense" && t.date >= m.start && t.date < m.end;
      }).reduce(function (s, t) { return s + t.amount; }, 0);
    });
    if (!totals.some(function (v) { return v > 0; })) return "";

    // Same projection the Forecast tab runs, just flattened per month
    // instead of split by category - active recurring bills and loans,
    // walked backward across recent history the same way they're walked
    // forward there.
    var forecasts = months.map(function (m) { return forecastTotalForRange(m.start, m.end); });

    var max = Math.max.apply(null, totals.concat(forecasts).concat([1]));
    var html = '<div class="card card-trend"><h2>Spending Trend</h2>';
    html += '<div class="trend-legend">' +
      '<span class="trend-legend-item"><span class="trend-swatch actual"></span>Actual</span>' +
      '<span class="trend-legend-item"><span class="trend-swatch forecast"></span>Forecast</span>' +
      '</div>';
    html += '<div class="trend-bars">';
    months.forEach(function (m, i) {
      var actualH = max > 0 ? Math.max((totals[i] / max) * 100, 2) : 2;
      var forecastH = max > 0 && forecasts[i] > 0 ? Math.max((forecasts[i] / max) * 100, 2) : 0;
      html += '<div class="trend-bar-col">';
      html += '<div class="trend-bar-values">';
      html += '<div class="actual num">' + fmtCompact(totals[i]) + '</div>';
      if (forecasts[i] > 0) html += '<div class="forecast num">' + fmtCompact(forecasts[i]) + '</div>';
      html += '</div>';
      html += '<div class="trend-bar-slot"><div class="trend-bar-overlay" style="height:' + Math.max(actualH, forecastH).toFixed(0) + 'px">';
      if (forecastH > 0) html += '<div class="trend-bar-fill forecast" style="height:' + forecastH.toFixed(0) + 'px"></div>';
      html += '<div class="trend-bar-fill actual" style="height:' + actualH.toFixed(0) + 'px"></div>';
      html += '</div></div>';
      html += '<div class="trend-bar-label">' + m.label + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
    return html;
  }

  /* This card has its own month, independent of the dashboard's main
     Month/Year period selector above - it's just for quickly comparing
     opening balances across months without changing what the rest of the
     dashboard (Spent/Income/Net, budgets, etc.) is showing. null means
     "the real current month"; resets to that on every fresh page load
     since it's not persisted. */
  var totalFundsMonthKey = null;

  /* Opening balance, income, expenses, and what's left - all summed
     across every debit card for the picked month. Opening reuses the
     exact same openingBalanceAt each card's own row already computes.
     Income and Expenses walk every debit-card transaction directly
     (rather than reusing incomeInRange/expensedInRange) so a transfer can
     be classified by where its other leg lands: a transfer between two of
     the user's own debit cards is excluded from both (an internal wash),
     while a transfer to/from a credit card - most commonly paying a
     credit card bill from a debit account - counts as an ordinary expense
     or income, since it's real money crossing in or out of the debit
     total. That keeps the bottom figure reconciling with just Income and
     Expenses, no separate Transfers line needed. Credit cards aren't
     included in the debit total itself: a credit limit isn't money you
     actually have, it's money you can borrow. */
  /* A real-time snapshot (not scoped to the dashboard's Month/Year period,
     same as Total Available Funds below it) - Available Funds is every
     debit card's running balance as of today (openingBalanceAt with
     tomorrow as the cutoff, so today's own transactions are included).
     Liabilities is what's actually owed right now: each credit card's
     all-time expensed minus all-time paid down (floored at 0 - an
     overpaid card isn't a negative liability), plus every active,
     not-yet-paid-off loan's remaining balance. */
  function renderNetWorthCard() {
    if (!allBankCards().length && !state.loans.length) return "";

    var tomorrow = new Date(today());
    tomorrow.setDate(tomorrow.getDate() + 1);
    var asOf = tomorrow.getFullYear() + "-" + pad(tomorrow.getMonth() + 1) + "-" + pad(tomorrow.getDate());
    var EPOCH = "0001-01-01";

    var debitCards = allBankCards().filter(function (l) { return bankCardType(l) === "debit"; });
    var creditCards = allBankCards().filter(function (l) { return bankCardType(l) === "credit"; });

    var availableFunds = debitCards.reduce(function (s, l) { return s + openingBalanceAt(l, asOf); }, 0);
    var creditOwed = creditCards.reduce(function (s, l) {
      var owed = expensedInRange(l, EPOCH, asOf) - incomeInRange(l, EPOCH, asOf);
      return s + Math.max(owed, 0);
    }, 0);
    var loanBalance = state.loans
      .filter(function (l) { return l.isActive && !loanProgress(l).isPaidOff; })
      .reduce(function (s, l) { return s + loanProgress(l).balance; }, 0);

    var liabilities = creditOwed + loanBalance;
    var netWorth = availableFunds - liabilities;

    var html = '<div class="card card-ledger"><h2>Net Worth</h2>';
    html += '<p class="hero-num num" style="font-size:28px;margin:0 0 14px;color:' + (netWorth < 0 ? "var(--critical)" : "var(--ink)") + '">' + fmtMoney(netWorth) + '</p>';
    html += '<div class="disclosure" style="margin-bottom:8px"><span>Available Funds</span><span class="num">' + fmtMoney(availableFunds) + '</span></div>';
    html += '<div class="disclosure"><span>Liabilities</span><span class="num">' + (liabilities > 0 ? "-" : "") + fmtMoney(liabilities) + '</span></div>';
    html += '</div>';
    return html;
  }

  function renderTotalFundsCard() {
    var debitCards = allBankCards().filter(function (l) { return bankCardType(l) === "debit"; });
    if (!debitCards.length) return "";

    var now = today();
    var year = now.getFullYear();
    var activeKey = totalFundsMonthKey || (year + "-" + pad(now.getMonth() + 1));
    var monthStart = activeKey + "-01";
    var monthStartDate = new Date(monthStart + "T00:00:00");
    var nextMonthDate = new Date(monthStartDate.getFullYear(), monthStartDate.getMonth() + 1, 1);
    var monthEnd = nextMonthDate.getFullYear() + "-" + pad(nextMonthDate.getMonth() + 1) + "-01";
    var monthLabel = monthStartDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });

    var opening = debitCards.reduce(function (s, label) { return s + openingBalanceAt(label, monthStart); }, 0);
    var income = 0, expenses = 0;
    state.transactions.forEach(function (t) {
      if (debitCards.indexOf(t.bankCard) === -1) return;
      if (t.date < monthStart || t.date >= monthEnd) return;
      if (isInternalTransfer(t, debitCards)) return;
      if (t.type === "income") income += t.amount;
      else if (t.type === "expense") expenses += t.amount;
    });
    var available = opening + income - expenses;
    // Only the real current month is still "in progress" - a past month's
    // figure is final, and the label should say so rather than implying
    // it could still change.
    var isCurrentMonth = activeKey === (now.getFullYear() + "-" + pad(now.getMonth() + 1));
    var balanceLabel = isCurrentMonth ? "Current Balance" : "Available Balance at End of Month";

    var html = '<div class="card card-ledger"><h2>Total Available Funds</h2>';
    html += '<div class="footnote" style="margin:0 0 10px">' + monthLabel + '</div>';
    html += '<div class="disclosure" style="margin-bottom:8px"><span>Total available funds <span class="footnote" style="display:inline">(at start of month)</span></span><span class="num">' + fmtMoney(opening) + '</span></div>';
    html += '<div class="disclosure" style="margin-bottom:8px"><span>Income <span class="footnote" style="display:inline">(during month)</span></span><span class="num">+' + fmtMoney(income) + '</span></div>';
    html += '<div class="disclosure" style="margin-bottom:10px"><span>Expenses <span class="footnote" style="display:inline">(during month)</span></span><span class="num">-' + fmtMoney(expenses) + '</span></div>';
    html += '<div class="disclosure" style="padding-top:10px;border-top:1px solid var(--line)"><span style="font-weight:600">' + balanceLabel + '</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(available) + '</span></div>';
    html += '<div class="month-picker-row">';
    html += '<button type="button" class="icon-btn accent-ghost month-scroll" data-month-scroll="-1" aria-label="Earlier months" style="width:32px;height:32px">' + icon("chevron", "chevron-flip") + '</button>';
    html += '<div class="month-picker">';
    for (var m = 1; m <= 12; m++) {
      var key = year + "-" + pad(m);
      var mLabel = new Date(key + "-01T00:00:00").toLocaleDateString(undefined, { month: "short" });
      html += '<button type="button" class="month-picker-btn' + (key === activeKey ? " active" : "") + '" data-month="' + key + '">' + mLabel + '</button>';
    }
    html += '</div>';
    html += '<button type="button" class="icon-btn accent-ghost month-scroll" data-month-scroll="1" aria-label="Later months" style="width:32px;height:32px">' + icon("chevron") + '</button>';
    html += '</div></div>';
    return html;
  }

  /* Mirrors Upcoming Bills below it - omitted entirely rather than shown

  // The month strip in Total Available Funds scrolls sideways; these arrows
  // page it left/right (and grey out at either end) so every month is
  // reachable without a swipe.
  function wireMonthScroll() {
    var picker = document.querySelector("#tab-dashboard .month-picker");
    var arrows = document.querySelectorAll("#tab-dashboard [data-month-scroll]");
    if (!picker || !arrows.length) return;
    function update() {
      var max = picker.scrollWidth - picker.clientWidth;
      arrows.forEach(function (a) {
        var dir = parseInt(a.getAttribute("data-month-scroll"), 10);
        var off = dir < 0 ? picker.scrollLeft <= 1 : picker.scrollLeft >= max - 1;
        a.disabled = off;
        a.style.opacity = off ? "0.35" : "";
      });
    }
    arrows.forEach(function (a) {
      a.addEventListener("click", function () {
        var dir = parseInt(a.getAttribute("data-month-scroll"), 10);
        picker.scrollBy({ left: dir * Math.max(120, picker.clientWidth * 0.7), behavior: reduceMotion ? "auto" : "smooth" });
      });
    });
    picker.addEventListener("scroll", update, { passive: true });
    update();
  }

  /* ---------- render: transactions ---------- */
