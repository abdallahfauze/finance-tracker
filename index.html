  /* ---------- quick calculator ---------- */

  var CALC_HISTORY_KEY = "ledger.financeTracker.calcHistory";

  function openCalculator() {
    var html = '<div class="modal-head"><h3 id="calc-title">Quick Calculator</h3>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="icon-btn ghost" id="calc-history-toggle" aria-label="Calculation history" style="width:30px;height:30px">' + icon("history") + '</button>' +
      '<button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button>' +
      '</div></div>';
    html += '<div id="calc-view">';
    html += '<div class="calc-display">';
    html += '<button class="calc-copy" id="calc-copy" aria-label="Copy result">' + icon("copy") + '</button>';
    html += '<div class="calc-expr num" id="calc-expr">&nbsp;</div>';
    html += '<div class="calc-result num" id="calc-result">0</div>';
    html += '</div>';
    html += '<div class="calc-grid">';
    html += '<button class="calc-btn calc-fn" data-fn="clear">C</button>';
    html += '<button class="calc-btn calc-fn" data-fn="back">⌫</button>';
    html += '<button class="calc-btn calc-fn" data-fn="percent">%</button>';
    html += '<button class="calc-btn calc-op" data-op="÷">÷</button>';
    ["7", "8", "9"].forEach(function (d) { html += '<button class="calc-btn" data-digit="' + d + '">' + d + '</button>'; });
    html += '<button class="calc-btn calc-op" data-op="×">×</button>';
    ["4", "5", "6"].forEach(function (d) { html += '<button class="calc-btn" data-digit="' + d + '">' + d + '</button>'; });
    html += '<button class="calc-btn calc-op" data-op="−">−</button>';
    ["1", "2", "3"].forEach(function (d) { html += '<button class="calc-btn" data-digit="' + d + '">' + d + '</button>'; });
    html += '<button class="calc-btn calc-op" data-op="+">+</button>';
    html += '<button class="calc-btn calc-zero" data-digit="0">0</button>';
    html += '<button class="calc-btn" data-digit=".">.</button>';
    html += '<button class="calc-btn calc-eq" data-fn="equals">=</button>';
    html += '</div></div>';
    html += '<div id="calc-history-view" class="hidden">';
    html += '<div class="calc-history-list" id="calc-history-list"></div>';
    html += '<div class="calc-history-empty" id="calc-history-empty">No calculations yet</div>';
    html += '<button class="btn plain" id="calc-history-clear" style="margin-top:12px">Clear history</button>';
    html += '</div>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);

    // Fresh state every time the calculator is opened - it's a floating
    // utility, not a tab, so there's no reason a stale in-progress sum
    // from earlier should still be sitting there next time.
    var current = "0";
    var stored = null;
    var pendingOp = null;
    // True right after "=" or an operator is pressed - the next digit
    // should start a brand new number instead of appending onto the
    // operand/result that's only sitting in `current` for display.
    var startFresh = false;
    // The small line above the result. While an operator is pending it's
    // derived live from stored/pendingOp/current; once "=" fires that
    // state clears for computation, so the completed equation is
    // captured here first and just persists on screen (mirroring how
    // Apple's Calculator keeps "10,000÷15" visible above the answer)
    // until the next operator starts a genuinely new one.
    var lastExpr = "";

    var exprEl = document.getElementById("calc-expr");
    var resultEl = document.getElementById("calc-result");

    function fmtDisplay(n) {
      if (n === "Error") return n;
      var num = parseFloat(n);
      if (isNaN(num)) return "0";
      if (Math.abs(num) >= 1e12) return num.toExponential(4);
      var str = num.toString();
      if (str.length > 12) str = parseFloat(num.toPrecision(10)).toString();
      return str;
    }

    function applyOp(a, op, b) {
      a = parseFloat(a); b = parseFloat(b);
      if (op === "+") return a + b;
      if (op === "−") return a - b;
      if (op === "×") return a * b;
      if (op === "÷") return b === 0 ? NaN : a / b;
      return b;
    }

    function liveExpr() {
      if (stored === null || !pendingOp) return null;
      if (startFresh) return fmtDisplay(stored) + " " + pendingOp;
      return fmtDisplay(stored) + " " + pendingOp + " " + fmtDisplay(current);
    }

    function render() {
      resultEl.textContent = fmtDisplay(current);
      var live = liveExpr();
      exprEl.textContent = live !== null ? live : (lastExpr || " ");
    }

    function pressDigit(d) {
      if (current === "Error" || startFresh) { current = ""; startFresh = false; }
      if (d === "." && current.indexOf(".") !== -1) return;
      if (current === "0" && d !== ".") current = "";
      current = (current || "") + d;
      if (current === "") current = "0";
      render();
    }

    function pressOp(op) {
      if (current === "Error") return;
      if (stored !== null && pendingOp && !startFresh) {
        // A full operand was typed since the last operator - chain-evaluate
        // immediately (simple pocket-calculator behavior, no precedence).
        var r = applyOp(stored, pendingOp, current);
        stored = isNaN(r) ? "Error" : r;
      } else if (stored === null) {
        stored = current;
      }
      // else: operator pressed again with no new digits typed in between -
      // just swap which operator is pending, without recomputing anything.
      current = String(stored);
      pendingOp = op;
      startFresh = true;
      render();
    }

    function pressEquals() {
      if (current === "Error" || stored === null || !pendingOp) return;
      var r = applyOp(stored, pendingOp, current);
      var exprForHistory = fmtDisplay(stored) + " " + pendingOp + " " + fmtDisplay(current);
      current = isNaN(r) ? "Error" : String(r);
      lastExpr = exprForHistory;
      stored = null;
      pendingOp = null;
      startFresh = true;
      if (current !== "Error") addHistoryEntry(exprForHistory, current);
      render();
    }

    function pressClear() {
      current = "0"; stored = null; pendingOp = null; startFresh = false; lastExpr = "";
      render();
    }

    function pressBack() {
      if (current === "Error" || startFresh) { pressClear(); return; }
      current = current.length > 1 ? current.slice(0, -1) : "0";
      render();
    }

    function pressPercent() {
      if (current === "Error") return;
      current = String(parseFloat(current) / 100);
      render();
    }

    document.querySelectorAll(".calc-btn[data-digit]").forEach(function (b) {
      b.addEventListener("click", function () { pressDigit(b.getAttribute("data-digit")); });
    });
    document.querySelectorAll(".calc-btn[data-op]").forEach(function (b) {
      b.addEventListener("click", function () { pressOp(b.getAttribute("data-op")); });
    });
    document.querySelector('[data-fn="equals"]').addEventListener("click", pressEquals);
    document.querySelector('[data-fn="clear"]').addEventListener("click", pressClear);
    document.querySelector('[data-fn="back"]').addEventListener("click", pressBack);
    document.querySelector('[data-fn="percent"]').addEventListener("click", pressPercent);

    document.getElementById("calc-copy").addEventListener("click", function () {
      var btn = this;
      var text = fmtDisplay(current);
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject())
        .catch(function () {})
        .then(function () {
          btn.classList.add("copied");
          setTimeout(function () { btn.classList.remove("copied"); }, 900);
        });
    });

    // ---------- history ----------
    var calcHistory = [];
    try { calcHistory = JSON.parse(localStorage.getItem(CALC_HISTORY_KEY) || "[]"); } catch (e) { calcHistory = []; }

    function saveHistory() { localStorage.setItem(CALC_HISTORY_KEY, JSON.stringify(calcHistory)); }

    function addHistoryEntry(expr, result) {
      calcHistory.unshift({ expr: expr, result: result });
      if (calcHistory.length > 20) calcHistory = calcHistory.slice(0, 20);
      saveHistory();
      renderHistory();
    }

    var historyListEl = document.getElementById("calc-history-list");
    var historyEmptyEl = document.getElementById("calc-history-empty");

    function renderHistory() {
      historyEmptyEl.classList.toggle("hidden", calcHistory.length > 0);
      historyListEl.innerHTML = calcHistory.map(function (h, i) {
        return '<div class="calc-history-row" data-idx="' + i + '">' +
          '<div class="calc-history-expr num">' + escapeHtml(h.expr) + ' =</div>' +
          '<div class="calc-history-result num">' + escapeHtml(fmtDisplay(h.result)) + '</div>' +
          '</div>';
      }).join("");
      historyListEl.querySelectorAll(".calc-history-row").forEach(function (row) {
        row.addEventListener("click", function () {
          var entry = calcHistory[parseInt(row.getAttribute("data-idx"), 10)];
          current = entry.result;
          stored = null; pendingOp = null; startFresh = true; lastExpr = entry.expr;
          render();
          showCalcView();
        });
      });
    }
    renderHistory();

    var calcViewEl = document.getElementById("calc-view");
    var historyViewEl = document.getElementById("calc-history-view");
    var calcTitleEl = document.getElementById("calc-title");
    var showingHistory = false;

    function showCalcView() {
      showingHistory = false;
      calcViewEl.classList.remove("hidden");
      historyViewEl.classList.add("hidden");
      calcTitleEl.textContent = "Quick Calculator";
    }
    function showHistoryView() {
      showingHistory = true;
      calcViewEl.classList.add("hidden");
      historyViewEl.classList.remove("hidden");
      calcTitleEl.textContent = "History";
    }
    document.getElementById("calc-history-toggle").addEventListener("click", function () {
      if (showingHistory) showCalcView(); else showHistoryView();
    });
    document.getElementById("calc-history-clear").addEventListener("click", function () {
      calcHistory = [];
      saveHistory();
      renderHistory();
    });

    render();
  }

  document.getElementById("calc-fab").addEventListener("click", openCalculator);

  /* ---------- render: dashboard ---------- */

  /* Only meaningful for the real current month - a past month is fully
     elapsed and a future one hasn't started, so both would just show a
     stuck 100%/0% bar with nothing useful to say. Reuses the same
     .bar-track/.bar-fill gauge already used for budgets and card
     utilization, so it reads as this app's instrument rather than a
     bolted-on generic progress bar. */
  function renderMonthProgress() {
    if (!isCurrentMonthPeriod(viewPeriod)) return "";
    var now = today();
    var elapsed = now.getDate();
    var total = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    var remaining = total - elapsed;
    var pct = Math.min(elapsed / total, 1) * 100;

    var html = '<div class="month-progress">';
    html += '<div class="bar-track"><div class="bar-fill good" style="width:' + pct.toFixed(2) + '%"></div>';
    html += '<div class="today-marker" style="left:' + pct.toFixed(2) + '%" title="Today"></div></div>';
    html += '<div class="month-progress-labels">';
    html += '<span>' + elapsed + (elapsed === 1 ? " day in" : " days in") + '</span>';
    html += '<span>' + (remaining === 0 ? "last day" : remaining + (remaining === 1 ? " day left" : " days left")) + '</span>';
    html += '</div></div>';
    return html;
  }

  function renderDashboard() {
    // renderDashboard() rebuilds the whole tab on every change, including
    // clicking a month in the Total Available Funds picker - that destroys
    // and recreates the scrollable strip as a new DOM node each time, which
    // resets its scroll position to 0. Capture/restore it the same way the
    // transactions search box's focus is preserved across its own rebuilds.
    var monthPickerEl = document.querySelector("#tab-dashboard .month-picker");
    var monthPickerScroll = monthPickerEl ? monthPickerEl.scrollLeft : null;

    var range = periodRange(viewPeriod);
    var periodTx = transactionsInRange(range.start, range.end);
    // Transfers move money between the user's own accounts - they aren't
    // real spending or income, so they're excluded from these totals (but
    // still count toward each individual card's balance, see renderBankCardSummary).
    var realTx = periodTx.filter(function (t) { return !t.isTransfer; });
    var spent = realTx.filter(function (t) { return t.type === "expense"; }).reduce(function (s, t) { return s + t.amount; }, 0);
    var income = realTx.filter(function (t) { return t.type === "income"; }).reduce(function (s, t) { return s + t.amount; }, 0);

    var byCat = {};
    realTx.filter(function (t) { return t.type === "expense"; }).forEach(function (t) {
      byCat[t.categoryId || "__none"] = (byCat[t.categoryId || "__none"] || 0) + t.amount;
    });

    var html = "";
    html += '<div class="card">';
    html += '<div class="segmented" id="period-type-seg">';
    html += '<button type="button" data-val="month" class="' + (viewPeriod.type === "month" ? "active" : "") + '">Month</button>';
    html += '<button type="button" data-val="year" class="' + (viewPeriod.type === "year" ? "active" : "") + '">Year</button>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px">';
    html += '<button class="icon-btn accent-ghost" id="period-prev" aria-label="Previous" style="width:32px;height:32px">' + icon("chevron", "chevron-flip") + '</button>';
    html += '<h2 style="margin:0;font-size:15px">' + range.label + '</h2>';
    html += '<button class="icon-btn accent-ghost" id="period-next" aria-label="Next" style="width:32px;height:32px">' + icon("chevron") + '</button>';
    html += '</div>';
    html += renderMonthProgress();
    html += '<div class="stat-row" style="margin-top:14px">';
    html += '<div class="stat spent"><div class="label">Spent</div><div class="value num" id="stat-spent"></div></div>';
    html += '<div class="stat income"><div class="label">Income</div><div class="value num" id="stat-income"></div></div>';
    html += '<div class="stat net"><div class="label">Net</div><div class="value num" id="stat-net"></div></div>';
    html += '</div></div>';

    html += renderBudgetsCard(byCat);
    html += renderTotalFundsCard();
    html += renderBankCardSummary(range);

    if (spent > 0) {
      html += '<div class="card"><h2>Spending by Category</h2>';
      html += renderDonut(byCat, spent);
      html += '</div>';
    }

    html += renderSpendingTrendCard();

    if (isCurrentMonthPeriod(viewPeriod)) {
      var upcoming = state.recurring.filter(function (r) { return r.isActive && r.kind !== "income" && daysUntil(r.nextDueDate) <= 30; })
        .sort(function (a, b) { return a.nextDueDate < b.nextDueDate ? -1 : 1; });
      if (upcoming.length) {
        html += '<div class="card"><h2>Upcoming Bills</h2>';
        upcoming.forEach(function (r) {
          var cat = byId(state.categories, r.categoryId);
          var d = daysUntil(r.nextDueDate);
          html += '<div class="row" data-open-recurring="' + r.id + '">';
          html += badgeHtml(cat, 30);
          html += '<div class="main"><div class="title">' + escapeHtml(r.name) + '</div><div class="meta">' + fmtDateShort(r.nextDueDate) + '</div></div>';
          if (d <= 3) html += dueChip(d);
          html += '<div class="amount num">' + fmtMoney(r.amount) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }
    }

    if (!periodTx.length) {
      html += emptyState("inbox", "Nothing yet", "Add a transaction to see your dashboard come to life.");
    }

    document.getElementById("tab-dashboard").innerHTML = html;
    wireDashboardEvents();
    animateDashboardStats(spent, income, income - spent);

    if (monthPickerScroll !== null) {
      var newMonthPicker = document.querySelector("#tab-dashboard .month-picker");
      if (newMonthPicker) newMonthPicker.scrollLeft = monthPickerScroll;
    }
  }

  /* Counts the three headline stats up/down from their last-rendered value
     rather than just snapping to the new one - runs on every dashboard
     render (data change, period navigation), so it doubles as a "this
     number just changed" cue. Starts from 0 on first paint. Skipped
     entirely under reduced-motion, where the final value is shown as-is. */
  var lastStatValues = null;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function animateDashboardStats(spent, income, net) {
    var targets = { spent: spent, income: income, net: net };
    var from = lastStatValues || { spent: 0, income: 0, net: 0 };
    lastStatValues = targets;

    Object.keys(targets).forEach(function (key) {
      var el = document.getElementById("stat-" + key);
      if (!el) return;
      if (reduceMotion || from[key] === targets[key]) { el.innerHTML = fmtMoney(targets[key]); return; }
      var start = null;
      var duration = 500;
      function step(ts) {
        if (start === null) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.innerHTML = fmtMoney(from[key] + (targets[key] - from[key]) * eased);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function dueChip(d) {
    var label = d <= 0 ? "Due today" : "Due in " + d + "d";
    var cls = d <= 1 ? "critical" : "warning";
    return '<span class="chip ' + cls + '">' + icon("alert") + label + '</span>';
  }

  /* Budgets are set per category (Settings > Categories > edit a category)
     and only make sense against a single month, so this card is hidden in
     Year view. byCat is the same expense-by-category map the donut chart
     already computed for the current period - no separate pass needed. */
  function renderBudgetsCard(byCat) {
    if (viewPeriod.type !== "month") return "";
    var budgeted = state.categories.filter(function (c) { return c.budget > 0; });
    if (!budgeted.length) return "";
    var html = '<div class="card"><h2>Budgets</h2>';
    budgeted.forEach(function (c) {
      var spent = byCat[c.id] || 0;
      var ratio = spent / c.budget;
      var status = utilStatus(ratio);
      var remaining = c.budget - spent;
      html += '<div style="margin-bottom:14px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:baseline">';
      html += '<span style="font-size:14px;font-weight:600">' + escapeHtml(c.name) + '</span>';
      html += '<span class="chip ' + status + '">' + (remaining < 0 ? "Over by " + fmtMoney(-remaining) : fmtMoney(remaining) + " left") + '</span>';
      html += '</div>';
      html += '<div class="bar-track"><div class="bar-fill ' + status + '" style="width:' + (Math.min(ratio, 1) * 100) + '%"></div></div>';
      html += '<div class="footnote num">' + fmtMoney(spent) + ' of ' + fmtMoney(c.budget) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function expensedInRange(label, start, end) {
    return state.transactions
      .filter(function (t) { return t.bankCard === label && t.type === "expense" && t.date >= start && t.date < end; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
  }

  function incomeInRange(label, start, end) {
    return state.transactions
      .filter(function (t) { return t.bankCard === label && t.type === "income" && t.date >= start && t.date < end; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
  }

  /* A debit card's opening balance for any period is derived, not stored:
     the one-time starting balance (set in Settings), net of every expense
     (subtracted) and income/deposit (added) dated before the period began.
     So "close" a month simply by moving to the next one - its opening
     balance is automatically last month's closing available balance, with
     no explicit rollover step needed. */
  function openingBalanceAt(label, periodStartISO) {
    var initial = (state.bankCardConfig[label] && state.bankCardConfig[label].value) || 0;
    var priorNet = state.transactions
      .filter(function (t) { return t.bankCard === label && t.date < periodStartISO && (t.type === "expense" || t.type === "income"); })
      .reduce(function (s, t) { return s + (t.type === "income" ? t.amount : -t.amount); }, 0);
    return initial + priorNet;
  }

  function renderBankCardSummary(range) {
    var debitCards = allBankCards().filter(function (l) { return bankCardType(l) === "debit"; });
    var creditCards = allBankCards().filter(function (l) { return bankCardType(l) === "credit"; });

    var html = "";
    html += '<div class="card"><h2>Debit Cards (MADA)</h2>';
    debitCards.forEach(function (label) {
      var opening = openingBalanceAt(label, range.start);
      var expensed = expensedInRange(label, range.start, range.end);
      var income = incomeInRange(label, range.start, range.end);
      var available = opening + income - expensed;
      var effectiveBase = opening + income;
      var pct = effectiveBase > 0 ? Math.min(Math.max(expensed / effectiveBase, 0), 1) : 0;
      var status = available < 0 ? "critical" : utilStatus(pct);
      html += bankCardRow(label, "Opening", opening, "Expensed", expensed, available, status, pct, income);
    });
    html += '</div>';

    html += '<div class="card"><h2>Credit Cards (Visa / Mastercard)</h2>';
    creditCards.forEach(function (label) {
      var limit = (state.bankCardConfig[label] && state.bankCardConfig[label].value) || 0;
      var used = expensedInRange(label, range.start, range.end);
      var refunded = incomeInRange(label, range.start, range.end);
      var available = limit + refunded - used;
      var pct = limit > 0 ? Math.min(Math.max(used / limit, 0), 1) : 0;
      var status = available < 0 ? "critical" : utilStatus(pct);
      html += bankCardRow(label, "Limit", limit, "Used", used, available, status, pct, refunded);
    });
    html += '</div>';

    return html;
  }

  function bankCardRow(label, capLabel, capValue, usedLabel, usedValue, available, status, pct, income) {
    var html = '<div style="margin-bottom:14px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline">';
    html += '<span style="font-size:14px;font-weight:600">' + escapeHtml(label) + '</span>';
    html += '<span class="chip ' + status + '">' + fmtMoney(available) + ' left</span>';
    html += '</div>';
    html += '<div class="bar-track"><div class="bar-fill ' + status + '" style="width:' + (pct * 100) + '%"></div></div>';
    html += '<div class="footnote num">' + capLabel + ' ' + fmtMoney(capValue) +
      (income ? ' · Income ' + fmtMoney(income) : '') +
      ' · ' + usedLabel + ' ' + fmtMoney(usedValue) + '</div>';
    html += '</div>';
    return html;
  }

  function donutWedgePath(cx, cy, rInner, rOuter, a0, a1) {
    var largeArc = (a1 - a0) > Math.PI ? 1 : 0;
    var p0x = cx + rOuter * Math.cos(a0), p0y = cy + rOuter * Math.sin(a0);
    var p1x = cx + rOuter * Math.cos(a1), p1y = cy + rOuter * Math.sin(a1);
    var p2x = cx + rInner * Math.cos(a1), p2y = cy + rInner * Math.sin(a1);
    var p3x = cx + rInner * Math.cos(a0), p3y = cy + rInner * Math.sin(a0);
    return "M" + p0x.toFixed(2) + "," + p0y.toFixed(2) +
      " A" + rOuter + "," + rOuter + " 0 " + largeArc + " 1 " + p1x.toFixed(2) + "," + p1y.toFixed(2) +
      " L" + p2x.toFixed(2) + "," + p2y.toFixed(2) +
      " A" + rInner + "," + rInner + " 0 " + largeArc + " 0 " + p3x.toFixed(2) + "," + p3y.toFixed(2) +
      " Z";
  }

  /* Picks readable text ink for a wedge's own fill rather than a fixed
     white - resolves the CSS color (a var(--catN) reference) to its actual
     rendered RGB via a throwaway probe element, since the categorical
     palette's lighter hues (yellow, aqua) don't clear contrast with white. */
  function donutLabelColor(cssColor) {
    var probe = document.createElement("span");
    probe.style.color = cssColor;
    probe.style.display = "none";
    document.body.appendChild(probe);
    var resolved = getComputedStyle(probe).color;
    document.body.removeChild(probe);
    var m = resolved.match(/[\d.]+/g);
    if (!m) return "#ffffff";
    var r = m[0] / 255, g = m[1] / 255, b = m[2] / 255;
    var lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return lum > 0.6 ? "#171717" : "#ffffff";
  }

  /* The ring itself is capped at the validated 8-hue categorical palette
     (see assignCategorySlots) - a 9th distinct category folds its arc into
     one shared grey "Other" slice rather than generating an unvalidated
     9th hue. But that's purely a ring-color limitation, not a categorization
     one: every category the user actually assigned still gets its own named
     row in the legend below, each keeping its real name and exact amount.
     Only genuinely uncategorized spend (no categoryId at all) is ever
     labeled "Uncategorized" - a category without a color slot is never
     mistaken for one. */
  function renderDonut(byCat, total) {
    var cx = 88, cy = 88, rOuter = 74, rInner = 0, rLabel = rOuter * 0.6;
    var gapRad = 0.045, explodeDist = 6;

    var ordered = state.categories.filter(function (c) { return c.slot !== null && c.slot !== undefined; })
      .sort(function (a, b) { return a.slot - b.slot; });

    var ringSegments = [];
    var legendRows = [];
    ordered.forEach(function (c) {
      var amt = byCat[c.id] || 0;
      if (amt <= 0) return;
      var segIndex = ringSegments.length;
      var color = categoryColor(c);
      ringSegments.push({ amt: amt, color: color });
      legendRows.push({ name: c.name, amt: amt, color: color, segIndex: segIndex });
    });

    var otherSegIndex = -1, otherAmt = 0;
    function foldIntoOther(name, amt) {
      if (otherSegIndex === -1) {
        otherSegIndex = ringSegments.length;
        ringSegments.push({ amt: 0, color: OTHER_COLOR });
      }
      otherAmt += amt;
      legendRows.push({ name: name, amt: amt, color: OTHER_COLOR, segIndex: otherSegIndex });
    }
    state.categories.filter(function (c) { return c.slot === null || c.slot === undefined; }).forEach(function (c) {
      var amt = byCat[c.id] || 0;
      if (amt > 0) foldIntoOther(c.name, amt);
    });
    if (byCat["__none"]) foldIntoOther("Uncategorized", byCat["__none"]);
    if (otherSegIndex !== -1) ringSegments[otherSegIndex].amt = otherAmt;

    var n = ringSegments.length;
    var startAngle = -Math.PI / 2;
    var cum = 0;
    var defsSvg = "", shadowsSvg = "", wedgesSvg = "", labelsSvg = "";
    ringSegments.forEach(function (seg, i) {
      var frac = seg.amt / total;
      var a0 = startAngle + cum * 2 * Math.PI;
      var a1 = startAngle + (cum + frac) * 2 * Math.PI;
      cum += frac;
      var pad = n > 1 ? Math.min(gapRad / 2, ((a1 - a0) / 2) * 0.9) : 0;
      var pa0 = a0 + pad, pa1 = a1 - pad;
      var mid = (pa0 + pa1) / 2;
      var tx = (Math.cos(mid) * explodeDist).toFixed(2);
      var ty = (Math.sin(mid) * explodeDist).toFixed(2);
      var d = donutWedgePath(cx, cy, rInner, rOuter, pa0, pa1);
      var styleVars = "--tx:" + tx + "px;--ty:" + ty + "px;--i:" + i;

      // A radial highlight (light near the center, true color at the rim)
      // plus a darker twin sitting underneath is what sells the slice as
      // having thickness rather than being a flat tinted shape.
      var gradId = "donut-grad-" + i;
      defsSvg += '<radialGradient id="' + gradId + '" cx="35%" cy="30%" r="75%">' +
        '<stop offset="0%" stop-color="color-mix(in srgb, ' + seg.color + ' 55%, white)" />' +
        '<stop offset="100%" stop-color="' + seg.color + '" />' +
        '</radialGradient>';
      var shadowColor = "color-mix(in srgb, " + seg.color + " 72%, black)";
      shadowsSvg += '<path class="donut-seg-shadow" data-seg="' + i + '" d="' + d + '" fill="' + shadowColor + '" style="' + styleVars + '"></path>';
      wedgesSvg += '<path class="donut-seg" data-seg="' + i + '" d="' + d + '" fill="url(#' + gradId + ')" style="' + styleVars + '"></path>';

      var pct = Math.round(frac * 100);
      if (pct >= 6) {
        var lx = (cx + Math.cos(mid) * rLabel).toFixed(2);
        var ly = (cy + Math.sin(mid) * rLabel).toFixed(2);
        labelsSvg += '<text class="donut-seg-label" data-seg="' + i + '" x="' + lx + '" y="' + ly + '" fill="' + donutLabelColor(seg.color) + '" style="' + styleVars + '">' + pct + '%</text>';
      }
    });

    var svg = '<svg viewBox="0 0 176 176" class="donut-svg"><defs>' + defsSvg + '</defs>' + shadowsSvg + wedgesSvg + labelsSvg + '</svg>';

    var html = '<div class="donut-wrap">' + svg + '</div>' +
      '<div class="donut-total"><div class="amt num">' + fmtMoney(total) + '</div><div class="lbl">Total spent</div></div>';

    var sortedLegend = legendRows.slice().sort(function (a, b) { return b.amt - a.amt; });
    html += '<div class="legend">';
    sortedLegend.forEach(function (row) {
      var pct = Math.round((row.amt / total) * 100);
      html += '<div class="legend-row" data-seg="' + row.segIndex + '">' +
        '<span class="dot" style="background:' + row.color + '"></span>' +
        '<div class="legend-main">' +
        '<div class="legend-top"><span class="name">' + escapeHtml(row.name) + '</span><span class="amt num">' + fmtMoney(row.amt) + '</span></div>' +
        '<div class="legend-bar-track"><div class="legend-bar-fill" style="width:' + pct + '%;background:' + row.color + '"></div></div>' +
        '</div>' +
        '<span class="pct num">' + pct + '%</span></div>';
    });
    html += '</div>';
    return html;
  }

  function wireDonutHover() {
    var wrap = document.querySelector("#tab-dashboard .donut-wrap");
    if (!wrap) return;
    var segs = document.querySelectorAll("#tab-dashboard .donut-seg, #tab-dashboard .donut-seg-shadow");
    var labels = document.querySelectorAll("#tab-dashboard .donut-seg-label");
    var rows = document.querySelectorAll("#tab-dashboard .legend-row");
    function setActive(idx) {
      wrap.classList.toggle("hovering", idx !== null);
      segs.forEach(function (s) { s.classList.toggle("active", s.getAttribute("data-seg") === idx); });
      labels.forEach(function (l) { l.classList.toggle("active", l.getAttribute("data-seg") === idx); });
      rows.forEach(function (r) { r.classList.toggle("dim", idx !== null && r.getAttribute("data-seg") !== idx); });
    }
    segs.forEach(function (s) {
      s.addEventListener("mouseenter", function () { setActive(s.getAttribute("data-seg")); });
      s.addEventListener("mouseleave", function () { setActive(null); });
    });
    rows.forEach(function (r) {
      r.addEventListener("mouseenter", function () { setActive(r.getAttribute("data-seg")); });
      r.addEventListener("mouseleave", function () { setActive(null); });
    });
  }

  /* Wedges render already in their resting (exploded) position by default,
     so the chart is correct even without this. What this adds is the
     scroll-triggered flourish: each time the donut card enters the
     viewport, it briefly resets to collapsed-at-center and replays the
     wiggle-into-place entrance - not just once ever, but every time the
     user scrolls back to it. */
  // Every dashboard render calls this, and each one replaces #tab-dashboard's
  // whole innerHTML - without disconnecting, the previous observer would go
  // on holding a strong reference to the now-detached old .donut-wrap
  // forever, one leaked observer per render.
  var donutScrollObserver = null;

  function wireDonutScrollAnim() {
    if (donutScrollObserver) { donutScrollObserver.disconnect(); donutScrollObserver = null; }
    var wrap = document.querySelector("#tab-dashboard .donut-wrap");
    if (!wrap || !window.IntersectionObserver || reduceMotion) return;
    var segCount = wrap.querySelectorAll(".donut-seg").length;
    var totalMs = segCount * 55 + 700;
    var settleTimer = null;

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          clearTimeout(settleTimer);
          wrap.classList.remove("animating");
          wrap.classList.add("pending");
          void wrap.offsetWidth; // force reflow so the reset is visible before replaying
          wrap.classList.remove("pending");
          wrap.classList.add("animating");
          settleTimer = setTimeout(function () { wrap.classList.remove("animating"); }, totalMs);
        } else {
          clearTimeout(settleTimer);
          wrap.classList.remove("animating");
          wrap.classList.add("pending");
        }
      });
    }, { threshold: 0.4 });
    donutScrollObserver = observer;
    observer.observe(wrap);
  }

  function renderSpendingTrendCard() {
    var months = trendMonths(6);
    if (!months) return "";
    var totals = months.map(function (m) {
      return state.transactions.filter(function (t) {
        return !t.isTransfer && t.type === "expense" && t.date >= m.start && t.date < m.end;
      }).reduce(function (s, t) { return s + t.amount; }, 0);
    });
    if (!totals.some(function (v) { return v > 0; })) return "";

    // Same projection the Forecast tab runs, just flattened per month
    // instead of split by category - active recurring bills and loans,
    // walked backward across recent history the same way they're walked
    // forward there.
    var forecasts = months.map(function (m) { return forecastTotalForRange(m.start, m.end); });

    var max = Math.max.apply(null, totals.concat(forecasts).concat([1]));
    var html = '<div class="card"><h2>Spending Trend</h2>';
    html += '<div class="trend-legend">' +
      '<span class="trend-legend-item"><span class="trend-swatch actual"></span>Actual</span>' +
      '<span class="trend-legend-item"><span class="trend-swatch forecast"></span>Forecast</span>' +
      '</div>';
    html += '<div class="trend-bars">';
    months.forEach(function (m, i) {
      var actualH = max > 0 ? Math.max((totals[i] / max) * 100, 2) : 2;
      var forecastH = max > 0 && forecasts[i] > 0 ? Math.max((forecasts[i] / max) * 100, 2) : 0;
      html += '<div class="trend-bar-col">';
      html += '<div class="trend-bar-values">';
      html += '<div class="actual num">' + fmtCompact(totals[i]) + '</div>';
      if (forecasts[i] > 0) html += '<div class="forecast num">' + fmtCompact(forecasts[i]) + '</div>';
      html += '</div>';
      html += '<div class="trend-bar-overlay" style="height:' + Math.max(actualH, forecastH).toFixed(0) + 'px">';
      if (forecastH > 0) html += '<div class="trend-bar-fill forecast" style="height:' + forecastH.toFixed(0) + 'px"></div>';
      html += '<div class="trend-bar-fill actual" style="height:' + actualH.toFixed(0) + 'px"></div>';
      html += '</div>';
      html += '<div class="trend-bar-label">' + m.label + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
    return html;
  }

  /* This card has its own month, independent of the dashboard's main
     Month/Year period selector above - it's just for quickly comparing
     opening balances across months without changing what the rest of the
     dashboard (Spent/Income/Net, budgets, etc.) is showing. null means
     "the real current month"; resets to that on every fresh page load
     since it's not persisted. */
  var totalFundsMonthKey = null;

  /* Opening balance, income, expenses, and what's left - all summed
     across every debit card for the picked month. Opening, Income, and
     Expensed reuse the exact same openingBalanceAt/incomeInRange/
     expensedInRange each card's own row already computes, and all three
     are shown so the bottom figure visibly reconciles instead of looking
     like Opening minus Expenses when it isn't. Credit cards aren't
     included: a credit limit isn't money you actually have, it's money
     you can borrow. */
  function renderTotalFundsCard() {
    var debitCards = allBankCards().filter(function (l) { return bankCardType(l) === "debit"; });
    if (!debitCards.length) return "";

    var now = today();
    var year = now.getFullYear();
    var activeKey = totalFundsMonthKey || (year + "-" + pad(now.getMonth() + 1));
    var monthStart = activeKey + "-01";
    var monthStartDate = new Date(monthStart + "T00:00:00");
    var nextMonthDate = new Date(monthStartDate.getFullYear(), monthStartDate.getMonth() + 1, 1);
    var monthEnd = nextMonthDate.getFullYear() + "-" + pad(nextMonthDate.getMonth() + 1) + "-01";
    var monthLabel = monthStartDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });

    var opening = debitCards.reduce(function (s, label) { return s + openingBalanceAt(label, monthStart); }, 0);
    var expenses = debitCards.reduce(function (s, label) { return s + expensedInRange(label, monthStart, monthEnd); }, 0);
    var income = debitCards.reduce(function (s, label) { return s + incomeInRange(label, monthStart, monthEnd); }, 0);
    var available = opening + income - expenses;
    // Only the real current month is still "in progress" - a past month's
    // figure is final, and the label should say so rather than implying
    // it could still change.
    var isCurrentMonth = activeKey === (now.getFullYear() + "-" + pad(now.getMonth() + 1));
    var balanceLabel = isCurrentMonth ? "Current Balance" : "Available Balance at End of Month";

    var html = '<div class="card"><h2>Total Available Funds</h2>';
    html += '<div class="footnote" style="margin:0 0 10px">' + monthLabel + '</div>';
    html += '<div class="disclosure" style="margin-bottom:8px"><span>Total available funds <span class="footnote" style="display:inline">(at start of month)</span></span><span class="num">' + fmtMoney(opening) + '</span></div>';
    html += '<div class="disclosure" style="margin-bottom:8px"><span>Income <span class="footnote" style="display:inline">(during month)</span></span><span class="num">+' + fmtMoney(income) + '</span></div>';
    html += '<div class="disclosure" style="margin-bottom:10px"><span>Expenses <span class="footnote" style="display:inline">(during month)</span></span><span class="num">-' + fmtMoney(expenses) + '</span></div>';
    html += '<div class="disclosure" style="padding-top:10px;border-top:1px solid var(--line)"><span style="font-weight:600">' + balanceLabel + '</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(available) + '</span></div>';
    html += '<div class="month-picker">';
    for (var m = 1; m <= 12; m++) {
      var key = year + "-" + pad(m);
      var mLabel = new Date(key + "-01T00:00:00").toLocaleDateString(undefined, { month: "short" });
      html += '<button type="button" class="month-picker-btn' + (key === activeKey ? " active" : "") + '" data-month="' + key + '">' + mLabel + '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function wireDashboardEvents() {
    document.querySelectorAll("#tab-dashboard [data-open-recurring]").forEach(function (el) {
      el.addEventListener("click", function () { openRecurringForm(el.getAttribute("data-open-recurring")); });
    });
    document.querySelectorAll("#tab-dashboard [data-month]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        totalFundsMonthKey = btn.getAttribute("data-month");
        renderDashboard();
      });
    });
    document.querySelectorAll("#period-type-seg button").forEach(function (b) {
      b.addEventListener("click", function () { setPeriodType(b.getAttribute("data-val")); });
    });
    document.getElementById("period-prev").addEventListener("click", function () { shiftPeriod(-1); });
    document.getElementById("period-next").addEventListener("click", function () { shiftPeriod(1); });
    wireDonutHover();
    wireDonutScrollAnim();
  }

  /* ---------- render: transactions ---------- */

  var txSearch = "";
  var txFilterCat = "";
  var txFilterBank = "";
  var txFilterMonth = "";

  function renderTransactions() {
    // renderTransactions() rebuilds this whole tab's HTML on every keystroke
    // in the search box (see the "input" listener below), which destroys
    // and recreates #tx-search as a new DOM node each time - the browser
    // can't keep focus (or the on-screen keyboard) on an element that no
    // longer exists, so typing would drop focus after every character.
    // Capturing focus/cursor position here and restoring it after the
    // rebuild keeps the keyboard open across keystrokes.
    var searchHadFocus = document.activeElement && document.activeElement.id === "tx-search";
    var searchCaret = searchHadFocus ? document.getElementById("tx-search").selectionStart : null;

    var list = state.transactions.slice().sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    if (txSearch) {
      var q = txSearch.toLowerCase();
      list = list.filter(function (t) { return t.merchant.toLowerCase().indexOf(q) !== -1 || (t.note || "").toLowerCase().indexOf(q) !== -1; });
    }
    if (txFilterCat) list = list.filter(function (t) { return t.categoryId === txFilterCat; });
    if (txFilterBank) list = list.filter(function (t) { return t.bankCard === txFilterBank; });
    if (txFilterMonth) list = list.filter(function (t) { return monthKeyOf(t.date) === txFilterMonth; });

    var html = '<div class="search-wrap">' + icon("search") + '<input type="text" id="tx-search" placeholder="Search merchant or note" value="' + escapeAttr(txSearch) + '" /></div>';

    html += '<select id="tx-filter-cat" style="margin-bottom:10px">';
    html += '<option value="">All categories</option>';
    state.categories.forEach(function (c) {
      html += '<option value="' + c.id + '"' + (txFilterCat === c.id ? " selected" : "") + '>' + escapeHtml(c.name) + '</option>';
    });
    html += '</select>';

    html += '<select id="tx-filter-bank" style="margin-bottom:10px">';
    html += '<option value="">All banks / cards</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (txFilterBank === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select>';

    var monthKeys = [];
    state.transactions.forEach(function (t) {
      var k = monthKeyOf(t.date);
      if (monthKeys.indexOf(k) === -1) monthKeys.push(k);
    });
    monthKeys.sort(function (a, b) { return a < b ? 1 : -1; });
    html += '<select id="tx-filter-month" style="margin-bottom:16px">';
    html += '<option value="">All months</option>';
    monthKeys.forEach(function (k) {
      var label = new Date(k + "-01T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" });
      html += '<option value="' + k + '"' + (txFilterMonth === k ? " selected" : "") + '>' + label + '</option>';
    });
    html += '</select>';

    if (!list.length) {
      html += emptyState("list", "No transactions", "Tap + to add your first one.");
    } else {
      var groups = [];
      var byDate = {};
      list.forEach(function (t) {
        if (!byDate[t.date]) { byDate[t.date] = []; groups.push(t.date); }
        byDate[t.date].push(t);
      });
      groups.forEach(function (date) {
        html += '<div class="section-title">' + fmtDateLong(date) + '</div><div class="card" style="padding:4px 16px">';
        byDate[date].forEach(function (t) {
          if (t.isTransfer) {
            html += '<div class="row" data-open-transfer="' + t.transferId + '">';
            html += '<div class="badge" style="background:var(--accent);width:34px;height:34px">' + icon("swap") + '</div>';
            html += '<div class="main"><div class="title">' + escapeHtml(t.merchant) + '</div>';
            html += '<div class="meta">Transfer' + (t.note ? " · " + escapeHtml(t.note) : "") + '</div></div>';
            html += '<div class="amount num' + (t.type === "income" ? " income" : "") + '">' + (t.type === "income" ? "+" : "") + fmtMoney(t.amount) + '</div>';
            html += '</div>';
            return;
          }
          var cat = byId(state.categories, t.categoryId);
          html += '<div class="row" data-open-tx="' + t.id + '">';
          html += badgeHtml(cat, 34);
          html += '<div class="main"><div class="title">' + escapeHtml(t.merchant) + '</div>';
          html += '<div class="meta">' + (cat ? escapeHtml(cat.name) : "Uncategorized") + (t.bankCard ? " · " + escapeHtml(t.bankCard) : "") + (t.note ? " · " + escapeHtml(t.note) : "") + '</div></div>';
          html += '<div class="amount num' + (t.type === "income" ? " income" : "") + '">' + (t.type === "income" ? "+" : "") + fmtMoney(t.amount) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      });

      // Totals for whatever's currently filtered - transfers are excluded
      // from Spent/Income here too, same as the Dashboard, since moving
      // money between your own accounts isn't real spending or income.
      var realList = list.filter(function (t) { return !t.isTransfer; });
      var filteredSpent = realList.filter(function (t) { return t.type === "expense"; }).reduce(function (s, t) { return s + t.amount; }, 0);
      var filteredIncome = realList.filter(function (t) { return t.type === "income"; }).reduce(function (s, t) { return s + t.amount; }, 0);
      html += '<div class="card"><div class="footnote" style="margin:0 0 10px">' + list.length + (list.length === 1 ? " transaction" : " transactions") + '</div>';
      html += '<div class="stat-row">';
      html += '<div class="stat spent"><div class="label">Spent</div><div class="value num">' + fmtMoney(filteredSpent) + '</div></div>';
      html += '<div class="stat income"><div class="label">Income</div><div class="value num">' + fmtMoney(filteredIncome) + '</div></div>';
      html += '<div class="stat net"><div class="label">Net</div><div class="value num">' + fmtMoney(filteredIncome - filteredSpent) + '</div></div>';
      html += '</div></div>';
    }

    document.getElementById("tab-transactions").innerHTML = html;

    if (searchHadFocus) {
      var searchEl = document.getElementById("tx-search");
      searchEl.focus();
      if (searchCaret !== null) searchEl.setSelectionRange(searchCaret, searchCaret);
    }

    document.getElementById("tx-search").addEventListener("input", function (e) { txSearch = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-cat").addEventListener("change", function (e) { txFilterCat = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-bank").addEventListener("change", function (e) { txFilterBank = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-month").addEventListener("change", function (e) { txFilterMonth = e.target.value; renderTransactions(); });
    document.querySelectorAll("#tab-transactions [data-open-tx]").forEach(function (el) {
      el.addEventListener("click", function () { openTransactionForm(el.getAttribute("data-open-tx")); });
    });
    document.querySelectorAll("#tab-transactions [data-open-transfer]").forEach(function (el) {
      el.addEventListener("click", function () { openTransferDetail(el.getAttribute("data-open-transfer")); });
    });
  }

  /* ---------- render: recurring ---------- */

  var recurringSortMode = "date";
  var recurringFilterCat = "";
  var recurringFilterBank = "";

  function sortRecurring(list) {
    var sorted = list.slice();
    if (recurringSortMode === "amount") {
      sorted.sort(function (a, b) { return a.amount - b.amount; });
    } else {
      sorted.sort(function (a, b) { return a.nextDueDate < b.nextDueDate ? -1 : (a.nextDueDate > b.nextDueDate ? 1 : 0); });
    }
    return sorted;
  }

  function renderRecurring() {
    var filtered = state.recurring.slice();
    if (recurringFilterCat) filtered = filtered.filter(function (r) { return r.categoryId === recurringFilterCat; });
    if (recurringFilterBank) filtered = filtered.filter(function (r) { return r.bankCard === recurringFilterBank; });

    var fixed = sortRecurring(filtered.filter(function (r) { return r.kind === "fixed"; }));
    var subs = sortRecurring(filtered.filter(function (r) { return r.kind === "subscription"; }));
    var income = sortRecurring(filtered.filter(function (r) { return r.kind === "income"; }));
    // Reflects whatever's currently filtered, same as the Transactions tab's
    // filtered total - not every recurring item regardless of the filters.
    // Outgoing and income are kept as two separate figures rather than one
    // net number, so this reads the same way as the rest of the app (Spent
    // vs Income on the dashboard) instead of inventing a new convention.
    var monthlyOut = filtered.filter(function (r) { return r.isActive && r.kind !== "income"; }).reduce(function (s, r) { return s + monthlyEquivalent(r); }, 0);
    var monthlyIn = filtered.filter(function (r) { return r.isActive && r.kind === "income"; }).reduce(function (s, r) { return s + monthlyEquivalent(r); }, 0);

    var html = '<div class="card"><div class="disclosure"' + (income.length ? ' style="margin-bottom:8px"' : '') + '><span style="font-weight:600">Monthly total</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(monthlyOut) + '</span></div>';
    if (income.length) html += '<div class="disclosure"><span style="font-weight:600">Monthly income</span><span class="num" style="font-size:18px;font-weight:700;color:var(--good)">+' + fmtMoney(monthlyIn) + '</span></div>';
    html += '</div>';

    if (state.recurring.length) {
      html += '<select id="recurring-filter-cat" style="margin-bottom:10px">';
      html += '<option value="">All categories</option>';
      state.categories.forEach(function (c) {
        html += '<option value="' + c.id + '"' + (recurringFilterCat === c.id ? " selected" : "") + '>' + escapeHtml(c.name) + '</option>';
      });
      html += '</select>';

      html += '<select id="recurring-filter-bank" style="margin-bottom:14px">';
      html += '<option value="">All banks / cards</option>';
      allBankCards().forEach(function (bc) {
        html += '<option value="' + escapeAttr(bc) + '"' + (recurringFilterBank === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
      });
      html += '</select>';

      html += '<div class="segmented" id="recurring-sort-seg" style="margin-bottom:14px">';
      html += '<button type="button" data-val="date" class="' + (recurringSortMode === "date" ? "active" : "") + '">Date: Nearest first</button>';
      html += '<button type="button" data-val="amount" class="' + (recurringSortMode === "amount" ? "active" : "") + '">Amount: Low to high</button>';
      html += '</div>';
    }

    if (!filtered.length) {
      html += state.recurring.length
        ? emptyState("refresh", "No matches", "Try a different category or bank/card filter.")
        : emptyState("refresh", "No recurring payments", "Add fixed bills, subscriptions, or recurring income like a salary to track them here.");
    } else {
      if (fixed.length) html += '<div class="section-title">Fixed Payments</div>' + recurringList(fixed);
      if (subs.length) html += '<div class="section-title">Subscriptions</div>' + recurringList(subs);
      if (income.length) html += '<div class="section-title">Income</div>' + recurringList(income);
    }

    document.getElementById("tab-recurring").innerHTML = html;

    document.querySelectorAll("#tab-recurring [data-open-recurring]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-mark-paid]")) return;
        openRecurringForm(el.getAttribute("data-open-recurring"));
      });
    });
    document.querySelectorAll("#tab-recurring [data-mark-paid]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openMarkPaidConfirm(el.getAttribute("data-mark-paid"));
      });
    });
    document.querySelectorAll("#recurring-sort-seg button").forEach(function (b) {
      b.addEventListener("click", function () { recurringSortMode = b.getAttribute("data-val"); renderRecurring(); });
    });
    var filterCatEl = document.getElementById("recurring-filter-cat");
    if (filterCatEl) filterCatEl.addEventListener("change", function (e) { recurringFilterCat = e.target.value; renderRecurring(); });
    var filterBankEl = document.getElementById("recurring-filter-bank");
    if (filterBankEl) filterBankEl.addEventListener("change", function (e) { recurringFilterBank = e.target.value; renderRecurring(); });
  }

  function openMarkPaidConfirm(id) {
    var r = byId(state.recurring, id);
    if (!r) return;
    var isIncome = r.kind === "income";

    var html = '<div class="modal-head"><h3>' + (isIncome ? "Mark as Received" : "Mark as Paid") + '</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2);margin:0 0 16px">' + escapeHtml(r.name) + ' · ' + fmtMoney(r.amount) + '</p>';
    html += '<div class="field"><label>' + (isIncome ? "Received into" : "Paid with") + '</label><select name="bankCard" id="mark-paid-bank"><option value="">None</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (r.bankCard === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select></div>';
    html += '<button type="button" class="btn primary" data-confirm-paid>' + (isIncome ? "Confirm Receipt" : "Confirm Payment") + '</button>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelector("[data-confirm-paid]").addEventListener("click", function () {
      var bankCard = document.getElementById("mark-paid-bank").value || null;

  function recurringList(list) {
    var html = '<div class="card" style="padding:4px 16px;margin-bottom:14px">';
    list.forEach(function (r) {
      var cat = byId(state.categories, r.categoryId);
      var isIncome = r.kind === "income";
      html += '<div class="row" data-open-recurring="' + r.id + '" style="opacity:' + (r.isActive ? 1 : 0.45) + '">';
      html += badgeHtml(cat, 34);
      html += '<div class="main"><div class="title">' + escapeHtml(r.name) + '</div><div class="meta">' + (FREQUENCY_LABELS[r.frequency] || capitalize(r.frequency)) + ' · due ' + fmtDateShort(r.nextDueDate) +
        (r.endDate ? ' · ends ' + fmtDateShort(r.endDate) : '') +
        (r.bankCard ? ' · ' + escapeHtml(r.bankCard) : '') + '</div></div>';
      html += '<div class="amount num' + (isIncome ? " income" : "") + '">' + (isIncome ? "+" : "") + fmtMoney(r.amount) + '</div>';
      html += '<button class="icon-btn ghost" data-mark-paid="' + r.id + '" aria-label="' + (isIncome ? "Mark as received" : "Mark as paid") + '" style="width:30px;height:30px">' + icon("check") + '</button>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function markPaid(id, bankCard) {
    var r = byId(state.recurring, id);
    if (!r) return;
    var isIncome = r.kind === "income";
    state.transactions.push({
      id: uid(), amount: r.amount, merchant: r.name,
      note: isIncome ? "Recurring income" : "Recurring payment",
      date: todayISO(), type: isIncome ? "income" : "expense",
      categoryId: r.categoryId, bankCard: bankCard || null
    });
    r.bankCard = bankCard || null;
    r.nextDueDate = addInterval(r.nextDueDate, r.frequency);
    assignCategorySlots();
    save();
    renderAll();
  }

  /* ---------- render: loans ---------- */

  function loanProgress(loan) {
    var amountPaid = Math.min(loan.paymentsMade * loan.monthlyPayment, loan.totalAmount);
    var balance = Math.max(loan.totalAmount - amountPaid, 0);
    var pct = loan.totalAmount > 0 ? Math.min(amountPaid / loan.totalAmount, 1) : 0;
    var estTotalPayments = loan.monthlyPayment > 0 ? Math.ceil(loan.totalAmount / loan.monthlyPayment) : loan.paymentsMade;
    return { amountPaid: amountPaid, balance: balance, pct: pct, estTotalPayments: estTotalPayments, isPaidOff: balance <= 0 };
  }

  function renderLoans() {
    var html = "";
    if (!state.loans.length) {
      html += emptyState("trend-down", "No loans tracked", "Add a car payment, personal loan, or other long-term debt to track its payoff progress.");
    } else {
      var totalBalance = state.loans.filter(function (l) { return l.isActive; }).reduce(function (s, l) { return s + loanProgress(l).balance; }, 0);
      // Excludes paid-off loans, even ones the user hasn't gotten around to
      // toggling Active off for - a loan with nothing left to pay has no
      // ongoing monthly obligation regardless of that flag.
      var totalMonthly = state.loans.filter(function (l) { return l.isActive && !loanProgress(l).isPaidOff; }).reduce(function (s, l) { return s + l.monthlyPayment; }, 0);
      html += '<div class="card"><div class="disclosure" style="margin-bottom:8px"><span style="font-weight:600">Total balance remaining</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(totalBalance) + '</span></div>';

  function loanCard(loan) {
    var p = loanProgress(loan);
    var d = daysUntil(loan.nextPaymentDate);
    var remainingInstallments = Math.max(p.estTotalPayments - loan.paymentsMade, 0);

    var html = '<div data-open-loan="' + loan.id + '" style="margin-bottom:16px;opacity:' + (loan.isActive ? 1 : 0.5) + '">';

    html += '<div class="loan-details">';
    html += loanDetailRow("Loan amount", loan.totalAmount);
    html += loanDetailRow("Paid", p.amountPaid, loan.paymentsMade + (loan.paymentsMade === 1 ? " installment" : " installments"));

  /* ---------- render: forecast ---------- */

  function renderForecast() {
    var base = new Date(today().getFullYear(), today().getMonth(), 1);
    var months = [];
    for (var i = 0; i < 12; i++) {
      var d = new Date(base.getFullYear(), base.getMonth() + i, 1);
      months.push({
        key: d.getFullYear() + "-" + pad(d.getMonth() + 1),
        label: d.toLocaleDateString(undefined, { month: "short" }) + " " + String(d.getFullYear()).slice(2)
      });
    }
    var windowStart = months[0].key + "-01";
    var windowEndDate = new Date(base.getFullYear(), base.getMonth() + 12, 1);
    var windowEnd = windowEndDate.getFullYear() + "-" + pad(windowEndDate.getMonth() + 1) + "-01";

    var matrix = {};
    var catTotals = {};

    function addToMatrix(catKey, monthKey, amount) {
      if (!matrix[catKey]) matrix[catKey] = {};
      matrix[catKey][monthKey] = (matrix[catKey][monthKey] || 0) + amount;
      catTotals[catKey] = (catTotals[catKey] || 0) + amount;
    }

    // Recurring income (salary etc.) sits outside this expense forecast,
    // same as Spending Trend's forecastTotalForRange.
    state.recurring.filter(function (r) { return r.isActive && r.kind !== "income"; }).forEach(function (r) {
      var catKey = r.categoryId || "__none";
      var d2 = r.nextDueDate;
      var guard = 0;
      // If nextDueDate has already advanced past windowStart (e.g. this
      // month's bill was already marked paid), walk backward first to
      // recover the occurrence that falls in this window - same
      // normalization occurrencesInRange() uses elsewhere.
      if (d2 >= windowStart) {
        while (d2 >= windowStart && guard < 500) { d2 = subtractInterval(d2, r.frequency); guard++; }
      }
      guard = 0;
      while (d2 < windowStart && guard < 500) { d2 = addInterval(d2, r.frequency); guard++; }
      guard = 0;
      while (d2 < windowEnd && guard < 500) {
        if (r.endDate && d2 > r.endDate) break;
        if (!r.startDate || d2 >= r.startDate) addToMatrix(catKey, d2.slice(0, 7), r.amount);
        d2 = addInterval(d2, r.frequency);
        guard++;
      }
    });

    // Loans are finite: unlike recurring bills, projection stops once the
    // loan would be paid off, instead of continuing indefinitely.
    state.loans.filter(function (l) { return l.isActive; }).forEach(function (l) {
      var catKey = l.categoryId || "__none";
      var d2 = l.nextPaymentDate;
      var paymentsSoFar = l.paymentsMade;
      var guard = 0;
      // Same backward-normalization as the recurring-bills loop above:
      // if this month's installment was already marked paid,
      // nextPaymentDate has already advanced past windowStart.
      if (d2 >= windowStart) {
        while (d2 >= windowStart && paymentsSoFar > 0 && guard < 500) {
          d2 = subtractInterval(d2, "monthly");
          paymentsSoFar--;
          guard++;
        }
      }
      guard = 0;
      while (d2 < windowStart && paymentsSoFar * l.monthlyPayment < l.totalAmount && guard < 500) {
        d2 = addInterval(d2, "monthly");
        paymentsSoFar++;
        guard++;
      }
      guard = 0;
      while (d2 < windowEnd && paymentsSoFar * l.monthlyPayment < l.totalAmount && guard < 500) {
        addToMatrix(catKey, d2.slice(0, 7), l.monthlyPayment);
        d2 = addInterval(d2, "monthly");
        paymentsSoFar++;
        guard++;
      }
    });

    // Actual: what's really been logged as transactions in this window,
    // regardless of whether that category has any forecast entry at all
    // (e.g. Dining has no recurring bill or loan, but still belongs in
    // this comparison if money was actually spent there).
    var actualMatrix = {};
    var actualTotals = {};
    state.transactions.forEach(function (t) {
      if (t.type !== "expense" || t.isTransfer) return;
      if (t.date < windowStart || t.date >= windowEnd) return;
      var catKey = t.categoryId || "__none";
      var mk = monthKeyOf(t.date);
      if (!actualMatrix[catKey]) actualMatrix[catKey] = {};
      actualMatrix[catKey][mk] = (actualMatrix[catKey][mk] || 0) + t.amount;
      actualTotals[catKey] = (actualTotals[catKey] || 0) + t.amount;
    });

    var catKeySet = {};
    Object.keys(matrix).forEach(function (k) { catKeySet[k] = true; });
    Object.keys(actualMatrix).forEach(function (k) { catKeySet[k] = true; });
    var catKeys = Object.keys(catKeySet).sort(function (a, b) {
      return ((catTotals[b] || 0) + (actualTotals[b] || 0)) - ((catTotals[a] || 0) + (actualTotals[a] || 0));
    });

    var html = '<div class="card"><p class="footnote" style="margin:0">Forecast is projected from your active recurring payments and loans. Actual is what\'s really been logged as transactions. Variance is Forecast minus Actual - positive means you spent less than planned, negative means you spent more.</p></div>';

    if (!catKeys.length) {
      html += emptyState("grid", "Nothing to forecast", "Add active recurring payments or loans, or log some transactions, to see forecast vs. actual here.");
    } else {
      html += '<div class="card"><div class="forecast-scroll"><table class="forecast-table"><thead>';
      html += '<tr><th class="fc-sticky" rowspan="2">Category</th>';
      months.forEach(function (m) { html += '<th colspan="3">' + m.label + '</th>'; });
      html += '</tr><tr>';
      months.forEach(function () { html += '<th class="fc-group-start">Fc</th><th>Act</th><th>Var</th>'; });
      html += '</tr></thead><tbody>';
      catKeys.forEach(function (catKey) {
        var cat = catKey === "__none" ? null : byId(state.categories, catKey);
        html += '<tr><td class="fc-sticky">' + escapeHtml(cat ? cat.name : "Uncategorized") + '</td>';
        months.forEach(function (m) {
          var fc = (matrix[catKey] && matrix[catKey][m.key]) || 0;
          var act = (actualMatrix[catKey] && actualMatrix[catKey][m.key]) || 0;
          var overspent = act - fc;
          // Displayed sign is flipped from the over/under check above:
          // negative shown = spent more than planned, positive shown =
          // spent less. Color still follows the original overspent/under
          // determination, not the displayed number's own sign.
          var variance = fc - act;
          var varClass = overspent > 0 ? "variance-over" : (overspent < 0 ? "variance-under" : "zero");
          html += '<td class="num fc-group-start' + (fc === 0 ? ' zero' : '') + '">' + (fc === 0 ? '–' : fmtWhole(fc)) + '</td>';
          html += '<td class="num' + (act === 0 ? ' zero' : '') + '">' + (act === 0 ? '–' : fmtWhole(act)) + '</td>';
          html += '<td class="num ' + varClass + '">' + (variance === 0 ? '–' : (variance > 0 ? '+' : '') + fmtWhole(variance)) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody><tfoot><tr><td class="fc-sticky">Total</td>';
      var actualExpenseByMonth = months.map(function (m) {
        var actTotal = 0;
        catKeys.forEach(function (catKey) { actTotal += (actualMatrix[catKey] && actualMatrix[catKey][m.key]) || 0; });
        return actTotal;
      });
      months.forEach(function (m, i) {
        var fcTotal = 0;
        catKeys.forEach(function (catKey) { fcTotal += (matrix[catKey] && matrix[catKey][m.key]) || 0; });
        var actTotal = actualExpenseByMonth[i];
        var overspentTotal = actTotal - fcTotal;
        var varTotal = fcTotal - actTotal;
        var varClass = overspentTotal > 0 ? "variance-over" : (overspentTotal < 0 ? "variance-under" : "");
        html += '<td class="num fc-group-start">' + fmtWhole(fcTotal) + '</td>';
        html += '<td class="num">' + fmtWhole(actTotal) + '</td>';
        html += '<td class="num ' + varClass + '">' + (varTotal > 0 ? '+' : '') + fmtWhole(varTotal) + '</td>';
      });
      html += '</tr></tfoot></table></div></div>';

      // Income vs. Actual Expenses: both rows are what's really been
      // logged as transactions - income isn't limited to recurring salary
      // items, so a one-off transfer-in, bonus, or gift you log directly
      // shows up here too, same as any actual expense would. Expenses
      // reuse the exact actual totals already computed for the Total row,
      // so the two tables can never silently disagree.
      var incomeByMonth = {};
      state.transactions.forEach(function (t) {
        if (t.type !== "income" || t.isTransfer) return;
        if (t.date < windowStart || t.date >= windowEnd) return;
        var mk = monthKeyOf(t.date);
        incomeByMonth[mk] = (incomeByMonth[mk] || 0) + t.amount;
      });

      html += '<div class="card"><h2>Income vs. Actual Expenses</h2>';
      html += '<p class="footnote" style="margin:0 0 12px">Both rows are what\'s really been logged as transactions. Variance is Income minus Expenses.</p>';
      html += '<div class="forecast-scroll"><table class="forecast-table"><thead><tr><th class="fc-sticky">&nbsp;</th>';
      months.forEach(function (m) { html += '<th>' + m.label + '</th>'; });
      html += '</tr></thead><tbody>';

      html += '<tr><td class="fc-sticky">Income</td>';
      months.forEach(function (m) {
        var inc = incomeByMonth[m.key] || 0;
        html += '<td class="num' + (inc === 0 ? ' zero' : '') + '">' + (inc === 0 ? '–' : fmtWhole(inc)) + '</td>';
      });
      html += '</tr>';

      html += '<tr><td class="fc-sticky">Actual Expenses</td>';
      months.forEach(function (m, i) {
        var act = actualExpenseByMonth[i];
        html += '<td class="num' + (act === 0 ? ' zero' : '') + '">' + (act === 0 ? '–' : fmtWhole(act)) + '</td>';
      });
      html += '</tr>';

      html += '</tbody><tfoot><tr><td class="fc-sticky">Variance</td>';
      months.forEach(function (m, i) {
        var inc = incomeByMonth[m.key] || 0;
        var act = actualExpenseByMonth[i];
        var variance = inc - act;
        var varClass = variance < 0 ? "variance-over" : (variance > 0 ? "variance-under" : "");
        html += '<td class="num ' + varClass + '">' + (variance === 0 ? '–' : (variance > 0 ? '+' : '') + fmtWhole(variance)) + '</td>';
      });
      html += '</tr></tfoot></table></div></div>';
    }

    document.getElementById("tab-forecast").innerHTML = html;
  }

  /* ---------- render: transfer ---------- */

  function transferHistory() {
    var byId2 = {};
    state.transactions.filter(function (t) { return t.isTransfer; }).forEach(function (t) {
      if (!byId2[t.transferId]) byId2[t.transferId] = {};
      byId2[t.transferId][t.type] = t;
    });
    var list = [];
    Object.keys(byId2).forEach(function (tid) {
      var pair = byId2[tid];
      if (pair.expense && pair.income) {
        list.push({ id: tid, from: pair.expense.bankCard, to: pair.income.bankCard, amount: pair.expense.amount, date: pair.expense.date, note: pair.expense.note });
      }
    });
    return list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function renderTransfer() {
    var transfers = transferHistory();
    var html = "";
    html += '<div class="card"><p class="footnote" style="margin:0">Move funds between your own bank/card accounts. Both balances update automatically and a matching pair of transactions is recorded on each side.</p></div>';

    if (!transfers.length) {
      html += emptyState("swap", "No transfers yet", "Tap + to move funds between two of your accounts.");
    } else {
      html += '<div class="card" style="padding:4px 16px">';
      transfers.forEach(function (t) {
        html += '<div class="row" data-open-transfer="' + t.id + '">';
        html += '<div class="badge" style="background:var(--accent);width:34px;height:34px">' + icon("swap") + '</div>';
        html += '<div class="main"><div class="title">' + escapeHtml(t.from || "None") + ' → ' + escapeHtml(t.to || "None") + '</div><div class="meta">' + fmtDateShort(t.date) + (t.note ? ' · ' + escapeHtml(t.note) : '') + '</div></div>';
        html += '<div class="amount num">' + fmtMoney(t.amount) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    document.getElementById("tab-transfer").innerHTML = html;
    document.querySelectorAll("#tab-transfer [data-open-transfer]").forEach(function (el) {
      el.addEventListener("click", function () { openTransferDetail(el.getAttribute("data-open-transfer")); });
    });

  function openTransferForm() {
    var html = '<div class="modal-head"><h3>Transfer Funds</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<form id="transfer-form">';
    html += '<div class="field"><input class="amount-input num" type="number" step="0.01" min="0.01" inputmode="decimal" name="amount" placeholder="0.00" required /></div>';
    html += '<div class="field"><label>From</label><select name="from" required><option value="">Select account</option>';
    allBankCards().forEach(function (bc) { html += '<option value="' + escapeAttr(bc) + '">' + escapeHtml(bc) + '</option>'; });
    html += '</select></div>';
    html += '<div class="field"><label>To</label><select name="to" required><option value="">Select account</option>';
    allBankCards().forEach(function (bc) { html += '<option value="' + escapeAttr(bc) + '">' + escapeHtml(bc) + '</option>'; });

      var confirmNext = document.getElementById("change-pin-confirm").value;
      var errorEl = document.getElementById("change-pin-error");
      errorEl.textContent = "";

      if (next !== confirmNext) { errorEl.textContent = "New PINs don't match — try again."; return; }
      if (next.length < 6) { errorEl.textContent = "New PIN must be at least 6 characters."; return; }

      var credential = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, current);
      auth.currentUser.reauthenticateWithCredential(credential)
        .then(function () { return auth.currentUser.updatePassword(next); })
        .then(function () {
          closeModal();
          showMessage("Your PIN has been updated. Use the new PIN next time you sign in on another device.");
        })
        .catch(function (err) {
          if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
            errorEl.textContent = "Current PIN is incorrect.";
          } else {
            errorEl.textContent = err.message;
          }
        });
    });
  }

  function openCategoriesManager() {
    var html = '<div class="modal-head"><h3>Categories</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<div class="card" style="padding:4px 16px;margin-bottom:14px">';
    state.categories.forEach(function (c) {
      html += '<div class="row" data-open-cat="' + c.id + '">';
      html += badgeHtml(c, 32);
      html += '<div class="main"><div class="title">' + escapeHtml(c.name) + '</div></div>';
      if (c.isSystem) html += '<span class="footnote">Default</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="btn primary" data-add-cat>Add Category</button>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelector("[data-add-cat]").addEventListener("click", function () { openCategoryForm(null); });
    document.querySelectorAll("[data-open-cat]").forEach(function (el) {
      el.addEventListener("click", function () { openCategoryForm(el.getAttribute("data-open-cat")); });
    });
  }

  /* Saves a file to the viewer's device. Prefers window.claude.downloads (the
     Artifact runtime's viewer-consented save prompt) and falls back to a plain
     anchor-click Blob download when that API isn't present — e.g. when this
     page is opened outside claude.ai (GitHub Pages, a local file, etc). */
  function saveFile(filename, text, mime) {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: text }).catch(function () {
        downloadViaAnchor(filename, text, mime);
      });
    } else {
      downloadViaAnchor(filename, text, mime);
    }
  }

  function downloadViaAnchor(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportCSV() {
    var rows = [["Date","Type","Merchant","Category","Bank/Card","Amount","Note"]];
    state.transactions.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (t) {
      var cat = byId(state.categories, t.categoryId);
      rows.push([t.date, t.type, t.merchant, cat ? cat.name : "", t.bankCard || "", t.amount, t.note || ""]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    saveFile("transactions.csv", csv, "text/csv");
  }

  function exportBackup() {
    saveFile("finance-tracker-backup.json", JSON.stringify(state, null, 2), "application/json");
  }

  function restoreBackupFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e) {
        showMessage("That file isn't a valid backup (couldn't parse JSON).");
        return;
      }
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.transactions)) {
        showMessage("That file doesn't look like a Finance Tracker backup.");
        return;
      }
      confirmAction("Restore this backup? It will replace all data currently in the app.", "Restore", function () {
        state = normalizeState(parsed);
        save();
        renderAll();
      });
    };
    reader.readAsText(file);
  }

  /* ---------- shared bits ---------- */

  function emptyState(iconName, title, body) {
    return '<div class="empty">' + icon(iconName) + '<p style="font-weight:600;color:var(--ink-2);margin-bottom:4px">' + title + '</p><p>' + body + '</p></div>';
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function renderAll() {
    renderDashboard();
    renderTransactions();
    renderRecurring();
    renderForecast();
    renderLoans();
    renderTransfer();
    renderSettings();
    try { checkBillReminders(); } catch (e) {}
  }

  /* An iOS home-screen app (and long-lived browser tabs generally) gets
     suspended in the background rather than reloaded, so it can resume
     days later still holding the month it was on when backgrounded. If
     the dashboard was tracking "the current month" (rather than some
     month the user deliberately paged to), snap it forward to match
     reality whenever the page becomes visible again. */
  var trackedMonthKey = today().getFullYear() + "-" + today().getMonth();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    var now = today();
    var nowKey = now.getFullYear() + "-" + now.getMonth();
    if (nowKey !== trackedMonthKey) {
      var wasOnTrackedMonth = viewPeriod.type === "month" && (viewPeriod.year + "-" + (viewPeriod.month - 1)) === trackedMonthKey;
      if (wasOnTrackedMonth) viewPeriod = { type: "month", year: now.getFullYear(), month: now.getMonth() + 1 };
      trackedMonthKey = nowKey;
    }
    renderAll();
  });

  /* ---------- bill due-date reminders ----------
     Best-effort only: fires via the Notification API while this tab/app is
     open on this device, not a true background push (that would need a
     service worker + push server). The "already notified" record is kept
     outside synced state - it's a per-device concern, not app data. */

  var NOTIFIED_KEY = "ledger.financeTracker.notified.v1";

  function loadNotified() {
    try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || {}; } catch (e) { return {}; }
  }

  function fmtMoneyPlain(amount) {
    var num;
    try {
      num = new Intl.NumberFormat(navigator.language || "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
    } catch (e) { num = amount.toFixed(2); }
    return state.settings.currency + " " + num;
  }

  function checkBillReminders() {
    if (!state.settings.notifyBills) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var notified = loadNotified();
    var changed = false;
    state.recurring.filter(function (r) { return r.isActive; }).forEach(function (r) {
      var d = daysUntil(r.nextDueDate);
      if (d < 0 || d > 2) return;
      if (notified[r.id] === r.nextDueDate) return;
      try {
        var title = r.kind === "income" ? "Income expected soon" : "Bill due soon";
        new Notification(title, { body: r.name + " · " + fmtMoneyPlain(r.amount) + " · " + fmtDateShort(r.nextDueDate) });
      } catch (e) {}
      notified[r.id] = r.nextDueDate;
      changed = true;
    });
    if (changed) localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  }

  initCloud();
})();
</script>
