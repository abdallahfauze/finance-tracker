        nextDueDate: f.get("nextDueDate"),
        categoryId: f.get("categoryId") || null,
        bankCard: f.get("bankCard") || null,
        isActive: f.get("isActive") === "on"
      };
      if (isNaN(record.amount) || !record.name) return;
      if (existing) {
        var idx = state.recurring.findIndex(function (r) { return r.id === existing.id; });
        state.recurring[idx] = record;
      } else {
        state.recurring.push(record);
      }
      save(); closeModal(); renderAll();
    });
  }

  /* ---------- forms: category ---------- */

  function openCategoryForm(id) {
    var existing = id ? byId(state.categories, id) : null;
    var html = '<div class="modal-head"><h3>' + (existing ? "Edit Category" : "Add Category") + '</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<form id="cat-form">';
    html += '<div class="field"><label>Name</label><input type="text" name="name" value="' + escapeAttr(existing ? existing.name : "") + '" required /></div>';
    html += '<div class="field"><label>Keywords (comma separated)</label><input type="text" name="keywords" value="' + escapeAttr(existing ? existing.keywords.join(", ") : "") + '" />';
    html += '<div class="footnote">Used to auto-suggest this category when a merchant name contains one of these words.</div></div>';
    html += '<div class="field"><label>Monthly Budget (optional)</label><input type="number" step="0.01" min="0" name="budget" placeholder="No limit" value="' + (existing && existing.budget ? existing.budget : "") + '" />';
    html += '<div class="footnote">Shows a progress bar on the Dashboard once you start spending in this category.</div></div>';
    html += '<button type="submit" class="btn primary" style="margin-top:8px">Save</button>';
    if (existing) html += '<button type="button" class="btn danger" style="margin-top:10px" data-delete>Delete</button>';
    html += '</form>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);

    if (existing) document.querySelector("[data-delete]").addEventListener("click", function () {
      confirmAction("Delete this category? Transactions using it will become uncategorized.", "Delete", function () {
        state.categories = state.categories.filter(function (c) { return c.id !== existing.id; });
        state.transactions.forEach(function (t) { if (t.categoryId === existing.id) t.categoryId = null; });
        save(); renderAll();
      });
    });

    document.getElementById("cat-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(e.target);
      var keywords = (f.get("keywords") || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      var name = f.get("name").trim();
      var budget = parseFloat(f.get("budget"));
      if (isNaN(budget)) budget = 0;
      if (!name) return;
      if (existing) {
        existing.name = name;
        existing.keywords = keywords;
        existing.budget = budget;
      } else {
        state.categories.push({ id: uid(), name: name, slot: null, isSystem: false, keywords: keywords, budget: budget });
      }
      save(); closeModal(); renderAll();
    });
  }

  /* ---------- render: settings ---------- */

  function bankCardConfigField(label) {
    var value = (state.bankCardConfig[label] && state.bankCardConfig[label].value) || 0;
    var html = '<div class="field" style="margin-bottom:10px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center"><label style="margin-bottom:0">' + escapeHtml(label) + '</label>';
    html += '<button type="button" class="icon-btn ghost" data-remove-bank="' + escapeAttr(label) + '" aria-label="Remove account" style="width:24px;height:24px;flex-shrink:0">' + icon("trash") + '</button>';
    html += '</div>';
    html += '<input type="number" step="0.01" min="0" class="bank-card-config" data-label="' + escapeAttr(label) + '" value="' + value + '" />';
    html += '</div>';
    return html;
  }

  function openAddBankCardForm(type) {
    var typeLabel = type === "debit" ? "Debit Account" : "Credit Card";
    var html = '<div class="modal-head"><h3>Add ' + typeLabel + '</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<form id="add-bank-form">';
    html += '<div class="field"><label>Name</label><input type="text" name="label" placeholder="e.g. ' + (type === "debit" ? "Alinma Savings" : "ENBD Titanium") + '" required /></div>';
    html += '<div class="field"><label>' + (type === "debit" ? "Opening Balance" : "Credit Limit") + '</label><input type="number" step="0.01" min="0" name="value" value="0" required /></div>';
    html += '<button type="submit" class="btn primary">Add</button>';
    html += '</form>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);

    document.getElementById("add-bank-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(e.target);
      var label = f.get("label").trim();
      var value = parseFloat(f.get("value"));
      if (!label || isNaN(value)) return;
      if (allBankCards().indexOf(label) !== -1) {
        showMessage("You already have an account named \"" + label + "\".");
        return;
      }
      state.customBankCards.push({ label: label, type: type });
      state.bankCardConfig[label] = { value: value };
      save(); closeModal(); renderAll();
    });
  }

  function renderSettings() {
    var html = '<div class="card">';
    html += '<h2>Categories</h2>';
    html += '<div class="disclosure" data-manage-categories style="cursor:pointer;padding:2px 0"><span>Manage categories</span>' + icon("chevron") + '</div>';
    html += '</div>';

    html += '<div class="card"><h2>Currency</h2><select id="currency-select">';
    CURRENCIES.forEach(function (c) {
      html += '<option value="' + c + '"' + (state.settings.currency === c ? " selected" : "") + '>' + c + '</option>';
    });
    html += '</select></div>';

    html += '<div class="card">';
    html += '<div class="disclosure" style="margin-bottom:12px"><h2 style="margin:0">Debit Cards — Opening Balance</h2><button class="icon-btn ghost" data-add-bank="debit" aria-label="Add debit account" style="width:26px;height:26px;flex-shrink:0">' + icon("plus") + '</button></div>';
    html += '<p class="footnote" style="margin-top:0;margin-bottom:12px">Set this once, as your starting balance when you began tracking. Each month\'s opening balance after that rolls forward automatically from the previous month\'s closing balance on the Dashboard.</p>';
    allBankCards().filter(function (l) { return bankCardType(l) === "debit"; }).forEach(function (label) {
      html += bankCardConfigField(label);
    });
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="disclosure" style="margin-bottom:12px"><h2 style="margin:0">Credit Cards — Credit Limit</h2><button class="icon-btn ghost" data-add-bank="credit" aria-label="Add credit account" style="width:26px;height:26px;flex-shrink:0">' + icon("plus") + '</button></div>';
    allBankCards().filter(function (l) { return bankCardType(l) === "credit"; }).forEach(function (label) {
      html += bankCardConfigField(label);
    });
    html += '</div>';

    html += '<div class="card"><h2>Account</h2>';
    html += '<p class="footnote" style="margin-top:0;margin-bottom:12px">' + (cloudEnabled && auth && auth.currentUser ? "Signed in — your data syncs automatically across every device you unlock with this PIN." : "Cloud sync is unavailable right now; changes are only saved on this device.") + '</p>';
    if (cloudEnabled && auth && auth.currentUser) html += '<button class="btn plain" id="change-pin" style="margin-bottom:10px">Change PIN</button>';
    if (cloudEnabled) html += '<button class="btn plain" id="sign-out">Sign Out</button>';
    html += '</div>';

    html += '<div class="card"><h2>Notifications</h2>';
    html += '<div class="toggle-row"><span>Bill Reminders</span><label class="switch"><input type="checkbox" id="notify-bills" ' + (state.settings.notifyBills ? "checked" : "") + ' /><span class="track"></span><span class="thumb"></span></label></div>';
    html += '<p class="footnote" style="margin-top:0">Get a notification when a fixed bill or subscription is due within 2 days. Only fires while this tab or app is open on this device — it won\'t wake your phone in the background.</p>';
    html += '</div>';

    html += '<div class="card"><h2>Backup</h2>';
    html += '<p class="footnote" style="margin-top:0;margin-bottom:12px">A local backup is still worth keeping occasionally as a second copy. Tap below to download it, then use your phone’s share sheet or the Files app to save it into Google Drive.</p>';
    html += '<button class="btn primary" id="export-backup" style="margin-bottom:10px">' + icon("download", "") + ' Save Backup (JSON)</button>';
    html += '<button class="btn plain" id="import-backup">Restore from Backup</button>';
    html += '<input type="file" id="import-backup-file" accept="application/json,.json" style="display:none" />';
    html += '</div>';

    html += '<div class="card"><h2>Data</h2>';
    html += '<button class="btn plain" id="export-csv" style="margin-bottom:10px">' + icon("download", "") + ' Export Transactions as CSV</button>';
    html += '<button class="btn danger" id="reset-data">Reset All Data</button>';
    html += '</div>';

    html += '<p class="footnote" style="padding:0 4px">Transactions are entered manually — there\'s no bank connection. Data syncs to your account when cloud sync is available, with a local copy kept for offline use.</p>';

    document.getElementById("tab-settings").innerHTML = html;

    document.querySelector("[data-manage-categories]").addEventListener("click", openCategoriesManager);
    document.getElementById("currency-select").addEventListener("change", function (e) {
      state.settings.currency = e.target.value;
      save(); renderAll();
    });
    document.querySelectorAll(".bank-card-config").forEach(function (input) {
      input.addEventListener("change", function (e) {
        var v = parseFloat(e.target.value);
        state.bankCardConfig[e.target.getAttribute("data-label")] = { value: isNaN(v) ? 0 : v };
        save(); renderAll();
      });
    });
    document.querySelectorAll("[data-add-bank]").forEach(function (btn) {
      btn.addEventListener("click", function () { openAddBankCardForm(btn.getAttribute("data-add-bank")); });
    });
    document.querySelectorAll("[data-remove-bank]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var label = btn.getAttribute("data-remove-bank");
        confirmAction("Remove " + label + "? Existing transactions tagged with it are kept but will show as an unrecognized account.", "Remove", function () {
          var isCustom = state.customBankCards.some(function (c) { return c.label === label; });
          if (isCustom) {
            state.customBankCards = state.customBankCards.filter(function (c) { return c.label !== label; });
          } else if (state.removedBankCards.indexOf(label) === -1) {
            state.removedBankCards.push(label);
          }
          save(); renderAll();
        });
      });
    });
    var changePinBtn = document.getElementById("change-pin");
    if (changePinBtn) changePinBtn.addEventListener("click", openChangePinForm);
    var signOutBtn = document.getElementById("sign-out");
    if (signOutBtn) signOutBtn.addEventListener("click", function () {
      confirmAction("Sign out? You'll need your PIN to unlock this device again.", "Sign Out", function () {
        auth.signOut();
      });
    });
    var notifyToggle = document.getElementById("notify-bills");
    if (notifyToggle) notifyToggle.addEventListener("change", function (e) {
      if (!e.target.checked) {
        state.settings.notifyBills = false;
        save();
        return;
      }
      if (typeof Notification === "undefined") {
        showMessage("Notifications aren't supported in this browser.");
        e.target.checked = false;
        return;
      }
      Notification.requestPermission().then(function (perm) {
        if (perm === "granted") {
          state.settings.notifyBills = true;
          save();
          checkBillReminders();
        } else {
          state.settings.notifyBills = false;
          save();
          e.target.checked = false;
          showMessage("Notifications were blocked. Enable them for this site in your browser's settings to turn reminders on.");
        }
      });
    });
    document.getElementById("export-backup").addEventListener("click", exportBackup);
    document.getElementById("import-backup").addEventListener("click", function () {
      document.getElementById("import-backup-file").click();
    });
    document.getElementById("import-backup-file").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      if (file) restoreBackupFromFile(file);
      e.target.value = "";
    });
    document.getElementById("export-csv").addEventListener("click", exportCSV);
    document.getElementById("reset-data").addEventListener("click", function () {
      confirmAction("Reset all data? This cannot be undone.", "Reset Everything", function () {
        state = defaultState();
        save(); renderAll();
      });
    });
  }

  function openChangePinForm() {
    var html = '<div class="modal-head"><h3>Change PIN</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<div class="field"><label>Current PIN</label><input type="password" autocomplete="off" id="change-pin-current" required /></div>';
    html += '<div class="field"><label>New PIN</label><input type="password" autocomplete="off" id="change-pin-new" required /></div>';
    html += '<div class="field"><label>Confirm New PIN</label><input type="password" autocomplete="off" id="change-pin-confirm" required /></div>';
    html += '<p class="lock-error" id="change-pin-error" style="margin:0 0 12px"></p>';
    html += '<button type="button" class="btn primary" data-save-pin>Update PIN</button>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelector("[data-save-pin]").addEventListener("click", function () {
      var current = document.getElementById("change-pin-current").value;
      var next = document.getElementById("change-pin-new").value;
      var confirmNext = document.getElementById("change-pin-confirm").value;
      var errorEl = document.getElementById("change-pin-error");
      errorEl.textContent = "";

      if (next !== confirmNext) { errorEl.textContent = "New PINs don't match — try again."; return; }
      if (next.length < 6) { errorEl.textContent = "New PIN must be at least 6 characters."; return; }

      var credential = firebase.auth.EmailAuthProvider.credential(ACCOUNT_EMAIL, current);
      auth.currentUser.reauthenticateWithCredential(credential)
        .then(function () { return auth.currentUser.updatePassword(next); })
        .then(function () {
          closeModal();
          showMessage("Your PIN has been updated. Use the new PIN next time you sign in on another device.");
        })
        .catch(function (err) {
          if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
            errorEl.textContent = "Current PIN is incorrect.";
          } else {
            errorEl.textContent = err.message;
          }
        });
    });
  }

  function openCategoriesManager() {
    var html = '<div class="modal-head"><h3>Categories</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<div class="card" style="padding:4px 16px;margin-bottom:14px">';
    state.categories.forEach(function (c) {
      html += '<div class="row" data-open-cat="' + c.id + '">';
      html += badgeHtml(c, 32);
      html += '<div class="main"><div class="title">' + escapeHtml(c.name) + '</div></div>';
      if (c.isSystem) html += '<span class="footnote">Default</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="btn primary" data-add-cat>Add Category</button>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelector("[data-add-cat]").addEventListener("click", function () { openCategoryForm(null); });
    document.querySelectorAll("[data-open-cat]").forEach(function (el) {
      el.addEventListener("click", function () { openCategoryForm(el.getAttribute("data-open-cat")); });
    });
  }

  /* Saves a file to the viewer's device. Prefers window.claude.downloads (the
     Artifact runtime's viewer-consented save prompt) and falls back to a plain
     anchor-click Blob download when that API isn't present — e.g. when this
     page is opened outside claude.ai (GitHub Pages, a local file, etc). */
  function saveFile(filename, text, mime) {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: text }).catch(function () {
        downloadViaAnchor(filename, text, mime);
      });
    } else {
      downloadViaAnchor(filename, text, mime);
    }
  }

  function downloadViaAnchor(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportCSV() {
    var rows = [["Date","Type","Merchant","Category","Bank/Card","Amount","Note"]];
    state.transactions.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (t) {
      var cat = byId(state.categories, t.categoryId);
      rows.push([t.date, t.type, t.merchant, cat ? cat.name : "", t.bankCard || "", t.amount, t.note || ""]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    saveFile("transactions.csv", csv, "text/csv");
  }

  function exportBackup() {
    saveFile("finance-tracker-backup.json", JSON.stringify(state, null, 2), "application/json");
  }

  function restoreBackupFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e) {
        showMessage("That file isn't a valid backup (couldn't parse JSON).");
        return;
      }
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.transactions)) {
        showMessage("That file doesn't look like a Finance Tracker backup.");
        return;
      }
      confirmAction("Restore this backup? It will replace all data currently in the app.", "Restore", function () {
        state = normalizeState(parsed);
        save();
        renderAll();
      });
    };
    reader.readAsText(file);
  }

  /* ---------- shared bits ---------- */

  function emptyState(iconName, title, body) {
    return '<div class="empty">' + icon(iconName) + '<p style="font-weight:600;color:var(--ink-2);margin-bottom:4px">' + title + '</p><p>' + body + '</p></div>';
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function renderAll() {
    renderDashboard();
    renderTransactions();
    renderRecurring();
    renderForecast();
    renderLoans();
    renderTransfer();
    renderSettings();
    try { checkBillReminders(); } catch (e) {}
  }

  /* An iOS home-screen app (and long-lived browser tabs generally) gets
     suspended in the background rather than reloaded, so it can resume
     days later still holding the month it was on when backgrounded. If
     the dashboard was tracking "the current month" (rather than some
     month the user deliberately paged to), snap it forward to match
     reality whenever the page becomes visible again. */
  var trackedMonthKey = today().getFullYear() + "-" + today().getMonth();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    var now = today();
    var nowKey = now.getFullYear() + "-" + now.getMonth();
    if (nowKey !== trackedMonthKey) {
      var wasOnTrackedMonth = viewPeriod.type === "month" && (viewPeriod.year + "-" + (viewPeriod.month - 1)) === trackedMonthKey;
      if (wasOnTrackedMonth) viewPeriod = { type: "month", year: now.getFullYear(), month: now.getMonth() + 1 };
      trackedMonthKey = nowKey;
    }
    renderAll();
  });

  /* ---------- bill due-date reminders ----------
     Best-effort only: fires via the Notification API while this tab/app is
     open on this device, not a true background push (that would need a
     service worker + push server). The "already notified" record is kept
     outside synced state - it's a per-device concern, not app data. */

  var NOTIFIED_KEY = "ledger.financeTracker.notified.v1";

  function loadNotified() {
    try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || {}; } catch (e) { return {}; }
  }

  function fmtMoneyPlain(amount) {
    var num;
    try {
      num = new Intl.NumberFormat(navigator.language || "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
    } catch (e) { num = amount.toFixed(2); }
    return state.settings.currency + " " + num;
  }

  function checkBillReminders() {
    if (!state.settings.notifyBills) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var notified = loadNotified();
    var changed = false;
    state.recurring.filter(function (r) { return r.isActive; }).forEach(function (r) {
      var d = daysUntil(r.nextDueDate);
      if (d < 0 || d > 2) return;
      if (notified[r.id] === r.nextDueDate) return;
      try {
        new Notification("Bill due soon", { body: r.name + " · " + fmtMoneyPlain(r.amount) + " · " + fmtDateShort(r.nextDueDate) });
      } catch (e) {}
      notified[r.id] = r.nextDueDate;
      changed = true;
    });
    if (changed) localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  }

  initCloud();
})();
</script>
