<meta charset="utf-8" />
<title>Finance Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />

<style>
  /*
    "Instrument Ledger" — a precision-instrument reading of a finance app:
    calibrated readouts (tabular mono numerals), gauge-tick progress bars,
    hairline panel seams. Dark mode is a deep-ink control panel; light mode
    is its own thing — technical drawing paper, not an inverted dark mode.
    Accent is a restrained cyan-teal in both, stepped per-surface for contrast.
  */
  :root {
    --page: #F3F5F6;
    --surface: #ffffff;
    --surface-2: #EAEDEF;
    --ink: #161B1E;
    --ink-2: #4B555C;
    --ink-muted: #838C93;
    --line: #DCE1E4;
    --accent: #0A7A6C;
    --accent-soft: #DDF2EE;
    --accent-ink: #ffffff;
    --good: #0ca30c;
    --warning: #b9791f;
    --serious: #ec835a;
    --critical: #d03b3b;
    --cat0: #2a78d6; --cat1: #eb6834; --cat2: #1baf7a; --cat3: #eda100;
    --cat4: #e87ba4; --cat5: #008300; --cat6: #4a3aa7; --cat7: #e34948;
    --cat-other: var(--ink-muted);
    --radius-lg: 12px;
    --radius-md: 8px;
    --radius-sm: 4px;
    --shadow-1: 0 1px 2px rgba(15,23,26,0.05), 0 1px 1px rgba(15,23,26,0.03);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --page: #14171A; --surface: #1B1F23; --surface-2: #20242A;
      --ink: #EAEDEF; --ink-2: #A8B0B6; --ink-muted: #727B82; --line: #2A3034;
      --accent: #3DD9C4; --accent-soft: #16302C; --accent-ink: #0B1413;
      --warning: #d99a3b;
      --cat0: #3987e5; --cat1: #d95926; --cat2: #199e70; --cat3: #c98500;
      --cat4: #d55181; --cat5: #1f9e1f; --cat6: #9085e9; --cat7: #e66767;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #14171A; --surface: #1B1F23; --surface-2: #20242A;
    --ink: #EAEDEF; --ink-2: #A8B0B6; --ink-muted: #727B82; --line: #2A3034;
    --accent: #3DD9C4; --accent-soft: #16302C; --accent-ink: #0B1413;
    --warning: #d99a3b;
    --cat0: #3987e5; --cat1: #d95926; --cat2: #199e70; --cat3: #c98500;
    --cat4: #d55181; --cat5: #1f9e1f; --cat6: #9085e9; --cat7: #e66767;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --page: #F3F5F6; --surface: #ffffff; --surface-2: #EAEDEF;
    --ink: #161B1E; --ink-2: #4B555C; --ink-muted: #838C93; --line: #DCE1E4;
    --accent: #0A7A6C; --accent-soft: #DDF2EE; --accent-ink: #ffffff;
    --warning: #b9791f;
    --cat0: #2a78d6; --cat1: #eb6834; --cat2: #1baf7a; --cat3: #eda100;
    --cat4: #e87ba4; --cat5: #008300; --cat6: #4a3aa7; --cat7: #e34948;
    --shadow-1: 0 1px 2px rgba(15,23,26,0.05), 0 1px 1px rgba(15,23,26,0.03);
    color-scheme: light;
  }

  /* Official Saudi Riyal currency sign (U+20C1), SIL OFL 1.1 licensed font by Emran Alhaddad
     https://github.com/emran-alhaddad/Saudi-Riyal-Font — embedded because system fonts
     don't reliably render this Unicode 17.0 (2025) character yet. */
  @font-face {
    font-family: "SaudiRiyal";
    src: url(data:font/woff2;base64,d09GMgABAAAAAAT0AA0AAAAAC2QAAASeAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP0ZGVE0cGhgGYACCZhEICocEhXcLGgABNgIkAzAEIAWHLgeBBRvVCSCOwnEvSojJ5ORhKiWep9/bPPc32mdnUaW+wXeJKlVIJCg8CIfcQWViVHSETJeZqNqErgZPp/28VaAy13pTkXvNQZv4IHCbHD9In+dyevP5Cfy7K+slmC3ybGwuLx2T18L1PKA2pnPbFCvQCdbLLSJq0N0AB31thACv29f9APD1k6ZUJ0tAD4aoQDO8bhmyFC1UI+oCuAO15AO2Q8G5MwSqDefwClCi9Be6wX9nQPsMEKAeA1AQUIMaLCGACzQCljAqQE+OwoCjcu0D6kv8/x/sl6sfkIpP/3/9/WpgdgoEQAeYoIR0QACkAlSghuJ31w3LAXyr/P+vAvSAOTCAzAK5B6CBQzRNhcGgGoYLL+dYrlnFKgu9iOcEj646uXaI2W3sJ9lTI4EetCRQAgulmH6SYMZBziQb1xBipCaQaS6l0vWRWr1q1aFDnTA52r1fr8fUTpXKWvLQ4KnSwb0+PppFHxtVC1at2uXrO9JOSIUWTzV+QWdXLT0K2uhG0jpJEiZs6WjSR9KuG9Zv1u+P2q1UujpcsT1L3dNzqhQszNevVtPHSYnHKlXoGEWtDpi6yX/duUgVJGGvzwIypcpt/Ni4Jly1atcq32n6zc+V4+ld7k6gz53h7vgOHLKN10L3KkUS7kouYUcPhGVony1zOi//ctkTdm/3kAqubk+P0MptoSFlXH1d5ZyIwuAyWX7+z+picypWzAjs1xCbVaGJLgqt5qqbqg/Y6ntEjm76aneF9Yjvano5HXrdrjSkllfHmVOk+o/IY8O89mBNc9Lbwcoe28z7DRmFzSmN4wbrT5X+B/E2SdMQn2S1PFaUu1OkJfIXKxVt+w1pFa2xjdll47yrvsvczl7/4ETotcmj56Zkzxs3b+7w0ZMNx9wX7srQ8rIsghhH+yj839cG7rwS/FVUQnWXgYUdjUP+HL5C8fybvBJ6ZQRWMKOhfsi7ZqHZEz4e3TZxMtEqXR8kGN0n/5/a9jk9IKKiFlmPtlWvYKy8rF34efCtxR9snP0uNWnu7Jj8kj9HHV1INdJDNT2jhozoFXwqYPLE+VjfWDBpsq7FUrJmU3brXPVwppI6gm8PCAjcX9RU3FdX8KtcJcczkIBc+4K9C8ZdxNPL/LtD9KcF19fLgOpBtODVPMNO+5d0/C2p2BEBPefddskgYA8Aa9mMABgKQwChUg9RkbGjprcJDW9v0SJ+QccrQRhDkk6Os7mYoEtPTCIZQk6xo9ALyCFMI3lIDtjnGFLlm9EzZJUcNNIoAAUACL10ULSMoCUYAkaUk2BRfgAnwm+QoZJMytlMKIQkH0pUBpAqdhjUMjIGGlTuklr2MTzoI92UJ23+wONVGmQ40WC8UgM5iCwsRBYopXLQcHEwXzrQIVosogW4IRrFwqmv4ZzGEQ2Em8tRFmff4c5x4kDgmpXdKAOJhsMnRWOAIg8/SVZ+YGXZ5ee18vMkZYbYopod2PHxMh22lbggxy4aiTp8UzunkRxGMUliNsQgyayTKk8k+l05RzpGmT7YjNb5FSWKKTxHRVTCPj0ISoRIUaJDEZowhCWctufXnHPwkJG/e0pZDQA=) format("woff2");
    font-weight: normal;
    font-style: normal;
  }
  .sar-symbol { font-family: "SaudiRiyal", sans-serif; }

  * { box-sizing: border-box; }
  /* Without this, iOS Safari's own rubber-band bounce on the whole page
     fights with the custom pull-to-refresh gesture below - the page bounces
     natively AND our JS drags `main`, producing a huge, disconnected-looking
     gap instead of one clean controlled motion. */
  html, body { height: 100%; overscroll-behavior-y: none; }
  body {
    margin: 0;
    background: var(--page);
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  button, input, select { font-family: inherit; }

  /* Calibrated-readout numerals: every currency/count value in the app uses
     this class, so this one rule carries the "instrument panel" identity
     everywhere at once. */
  .num {
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--page);
  }

  .appbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 14px) 18px 14px;
    background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .appbar h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .appbar .sub {
    font-size: 11px;
    color: var(--ink-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active { opacity: 0.8; }
  .icon-btn.ghost {
    background: var(--surface-2);
    color: var(--ink);
  }
  .icon-btn.accent-ghost {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main { flex: 1; overflow-y: auto; overscroll-behavior-y: contain; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .pull-indicator {
    position: fixed;
    left: 50%; top: 0;
    width: 36px; height: 36px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-1);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-muted);
    opacity: 0;
    transform: translate(-50%, -100%) rotate(0deg);
    z-index: 15;
    pointer-events: none;
  }
  .pull-indicator svg { width: 18px; height: 18px; }
  .pull-indicator.armed { color: var(--accent); }
  .pull-indicator.spinning { animation: spin-once .6s linear infinite; }

  nav.tabbar {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 480px;
    display: flex;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  nav.tabbar button {
    position: relative;
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 2px 8px;
    color: var(--ink-muted);
    cursor: pointer;
  }
  nav.tabbar button svg { width: 22px; height: 22px; flex-shrink: 0; }
  nav.tabbar button span {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar button.active::before {
    content: "";
    position: absolute; top: 2px; left: 50%;
    width: 5px; height: 5px;
    background: var(--accent);
    transform: translateX(-50%) rotate(45deg);
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    padding: 16px;
  }
  .card + .card { margin-top: 14px; }
  /* Calibration strip - only on cards with a named header, so it reads as a
     panel label's tick marks rather than decorating every surface. */
  .card:has(> h2)::before {
    content: "";
    position: absolute;
    top: 1px; left: 14px; right: 14px;
    height: 3px;
    background-image: repeating-linear-gradient(to right, var(--accent) 0 2px, transparent 2px 7px);
    opacity: 0.85;
    pointer-events: none;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-2);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .hero-num {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .stat-row { display: flex; gap: 10px; }
  .stat {
    flex: 1;
    text-align: center;
    padding: 12px 6px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
  }
  .stat .label { font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .stat .value { font-size: 19px; margin-top: 4px; }
  .stat.spent .value { color: var(--critical); }
  .stat.income .value { color: var(--good); }
  .stat.net .value { color: var(--accent); }

  .donut-wrap { position: relative; width: 176px; height: 176px; margin: 18px auto 4px; }
  .donut-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-center .amt { font-size: 22px; }
  .donut-center .lbl { font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .legend { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
  .legend-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-row .amt { color: var(--ink-2); }
  .legend-row .pct { color: var(--ink-muted); width: 34px; text-align: right; font-size: 12px; }

  .trend-bars { display: flex; align-items: flex-end; gap: 8px; margin-top: 4px; }
  .trend-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .trend-bar-value { font-size: 9.5px; color: var(--ink-muted); margin-bottom: 4px; white-space: nowrap; }
  .trend-bar-fill { width: 100%; max-width: 32px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .trend-bar-label {
    font-size: 10.5px; color: var(--ink-muted); margin-top: 6px; text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .trend-line-wrap { margin-top: 4px; }
  .trend-line-svg { width: 100%; height: auto; display: block; }
  .trend-line-labels {
    display: flex; justify-content: space-between; margin-top: 4px;
    font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .badge {
    width: 34px; height: 34px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.01em;
    flex-shrink: 0;
  }
  .badge svg { width: 16px; height: 16px; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 12px; color: var(--ink-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .amount { font-size: 14.5px; flex-shrink: 0; }
  .row .amount.income { color: var(--good); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 700;
    padding: 3px 8px; border-radius: var(--radius-sm);
    text-transform: uppercase; letter-spacing: 0.04em;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .chip.good { background: var(--accent-soft); color: var(--accent); }
  .chip.warning { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
  .chip.critical { background: color-mix(in srgb, var(--critical) 16%, transparent); color: var(--critical); }
  .chip svg { width: 11px; height: 11px; }

  /* Gauge-tick track: graduation marks read through the untouched portion,
     covered by the fill as it advances - like a real dial's calibration. */
  .bar-track {
    height: 8px; border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden; margin-top: 8px;
    background-image: repeating-linear-gradient(to right, var(--line) 0, var(--line) 1px, transparent 1px, transparent 10%);
  }
  .bar-fill { height: 100%; border-radius: var(--radius-sm); }
  .bar-fill.good { background: var(--accent); }
  .bar-fill.warning { background: var(--warning); }
  .bar-fill.critical { background: var(--critical); }

  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--ink-muted);
    margin: 22px 2px 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .section-title:first-child { margin-top: 0; }

  .empty {
    text-align: center; padding: 40px 20px; color: var(--ink-muted);
  }
  .empty svg { width: 30px; height: 30px; margin-bottom: 10px; opacity: 0.6; }
  .empty p { margin: 0; font-size: 13.5px; }

  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-muted); }
  .search-wrap input { padding-left: 36px; }

  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 15px;
  }
  input:focus, select:focus { border-color: var(--accent); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .segmented { display: flex; border-radius: var(--radius-md); background: var(--surface-2); padding: 3px; }
  .segmented button {
    flex: 1; border: none; background: none; padding: 8px 4px; border-radius: calc(var(--radius-md) - 3px);
    font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer;
  }
  .segmented button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%;
    padding: 13px; border-radius: var(--radius-md); border: none;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.04em;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:disabled { opacity: 0.4; }
  .btn.danger { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
  .btn.plain { background: var(--surface-2); color: var(--ink); }

  .fab-row { display: flex; gap: 10px; margin-top: 4px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.42);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 480px;
    background: var(--page);
    border-radius: 14px 14px 0 0;
    max-height: 88vh; overflow-y: auto;
    padding: 18px 18px calc(28px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { margin: 0; font-size: 17px; }

  .swatch-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 30px; height: 30px; border-radius: 999px; cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.selected { border-color: var(--ink); }

  .amount-input { font-size: 26px; font-weight: 600; text-align: center; padding: 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .chevron-sm { width: 16px; height: 16px; color: var(--ink-muted); flex-shrink: 0; }

  .forecast-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: -4px -16px 0; padding: 4px 16px 4px; }
  .forecast-table { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
  .forecast-table th, .forecast-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  .forecast-table th:first-child, .forecast-table td:first-child {

  .forecast-table tfoot td { font-weight: 700; border-bottom: none; border-top: 2px solid var(--line); }
  .forecast-table td.zero { color: var(--ink-muted); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
  .switch { position: relative; width: 46px; height: 27px; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; background: var(--surface-2); border-radius: 999px; border: 1px solid var(--line); transition: background .15s; }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-1); transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked ~ .thumb { transform: translateX(19px); }

  .footnote { font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; margin-top: 4px; }
  a { color: var(--accent); }

  .lock-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--page);
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 18px 18px;
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lock-screen.open { display: flex; }
  .lock-card { width: 100%; max-width: 320px; text-align: center; }
  .lock-eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--ink-muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .lock-card h1 { margin: 6px 0 4px; font-size: 22px; }
  .lock-sub { font-size: 13px; color: var(--ink-2); margin: 0 0 24px; line-height: 1.5; }
  .lock-card input {
    width: 100%; text-align: center; letter-spacing: 0.3em;
    padding: 14px; margin-bottom: 10px;
    border-radius: var(--radius-md); border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); font-size: 18px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .lock-card input:focus { border-color: var(--accent); outline: none; }
  .lock-error { color: var(--critical); font-size: 12.5px; margin: 12px 0 0; min-height: 16px; }
  .lock-status { color: var(--ink-muted); font-size: 12.5px; margin: 8px 0 0; min-height: 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .lock-toggle { background: none; border: none; color: var(--accent); font-size: 12.5px; cursor: pointer; margin-top: 14px; padding: 4px; }

  @keyframes spin-once { to { transform: rotate(360deg); } }
  .spin-once { animation: spin-once .5s linear; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .spin-once { animation: none; }
  }

  /* Wider viewports (laptop/desktop): the app no longer needs to stay
     phone-width. Widen the shell, and let the dashboard's cards - which are
     all independent, self-contained panels - line up side by side instead
     of stacking in a single column. Other tabs keep their existing markup
     (search bars, section headers, etc. aren't independent cards) so they
     stay a single wider column rather than being force-fit into a grid. */
  @media (min-width: 760px) {
    .app, nav.tabbar { max-width: 900px; }
    /* CSS columns (not grid) so cards of very different heights pack tightly

    #tab-dashboard.active {
      column-width: 320px;
      column-gap: 14px;
    }
    #tab-dashboard.active .card { break-inside: avoid; margin-top: 0; margin-bottom: 14px; }
  }

<script>
(function () {

  /* ---------- constants ---------- */

  var CAT_COLORS = ["var(--cat0)","var(--cat1)","var(--cat2)","var(--cat3)","var(--cat4)","var(--cat5)","var(--cat6)","var(--cat7)"];
  var OTHER_COLOR = "var(--cat-other)";

  var DEFAULT_CATEGORIES = [
    { id: "transport", name: "Transport", slot: null, isSystem: true, keywords: ["uber","careem","lyft","taxi","fuel","petrol","gas station","parking","metro","adnoc","enoc"] },
    { id: "dining", name: "Dining", slot: null, isSystem: true, keywords: ["restaurant","cafe","coffee","starbucks","costa","mcdonald","kfc","talabat","deliveroo","doordash","uber eats"] },
    { id: "groceries", name: "Groceries", slot: null, isSystem: true, keywords: ["carrefour","lulu","spinneys","whole foods","trader joe","kroger","grocery","supermarket","market"] },
    { id: "utilities", name: "Utilities", slot: null, isSystem: true, keywords: ["electricity","water bill","etisalat","telecom","internet","utility","dewa","sewa"] },
    { id: "shopping", name: "Shopping", slot: null, isSystem: true, keywords: ["amazon","noon","shein","mall","store","shop"] },
    { id: "rent", name: "Rent & Housing", slot: null, isSystem: true, keywords: ["rent","mortgage","landlord","housing"] },
    { id: "subscriptions", name: "Subscriptions", slot: null, isSystem: true, keywords: ["netflix","spotify","icloud","youtube premium","disney+","amazon prime","shahid","osn"] },
    { id: "entertainment", name: "Entertainment", slot: null, isSystem: true, keywords: ["cinema","movie","vox","theatre","concert","game"] },
    { id: "health", name: "Health", slot: null, isSystem: true, keywords: ["pharmacy","clinic","hospital","doctor","insurance"] },
    { id: "income", name: "Income", slot: null, isSystem: true, keywords: ["salary","payroll","deposit","transfer in","refund"] },
    { id: "other", name: "Other", slot: null, isSystem: true, keywords: [] }
  ];

  /* Chart colors are earned, not pre-assigned: the 8 categories with the
     highest lifetime expense total get a real color slot; everything else
     stays grey and folds into "Other / Uncategorized" on the donut. This is
     recomputed (not just appended to) on every call, so a category that
     used to be top-8 but has since been overtaken loses its slot to make
     room - otherwise whichever categories happened to be used *first* would
     permanently hog colors even after a heavier-spend category showed up. */
  function assignCategorySlots() {
    var totals = {};
    state.transactions.forEach(function (t) {
      if (t.type !== "expense" || !t.categoryId) return;
      totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount;
    });
    var eligible = state.categories.filter(function (c) { return (totals[c.id] || 0) > 0; });
    eligible.sort(function (a, b) {
      var diff = (totals[b.id] || 0) - (totals[a.id] || 0);
      return diff !== 0 ? diff : (a.id < b.id ? -1 : 1);
    });
    var top8Ids = {};
    eligible.slice(0, 8).forEach(function (c) { top8Ids[c.id] = true; });

    var changed = false;
    state.categories.forEach(function (c) {
      if (typeof c.slot === "number" && !top8Ids[c.id]) { c.slot = null; changed = true; }
    });
    eligible.slice(0, 8).forEach(function (c) {
      if (typeof c.slot === "number") return;
      var used = {};
      state.categories.forEach(function (x) { if (typeof x.slot === "number") used[x.slot] = true; });
      for (var i = 0; i < 8; i++) {
        if (!used[i]) { c.slot = i; changed = true; break; }
      }
    });
    return changed;
  }

  var CURRENCIES = ["USD","EUR","GBP","AED","SAR","EGP","KWD","QAR"];

  var BANK_CARDS = [
    "SAB VISA 4576",
    "SAB VISA 6438",
    "SAB MADA 5007",
    "SAB MADA 8929",
    "SNB MASTER 9341",
    "SNB MADA 4649",
    "RAJHI MADA 0464",
    "SAIB MADA 9590"
  ];

  function bankCardType(label) {
    var custom = state.customBankCards.filter(function (c) { return c.label === label; })[0];
    if (custom) return custom.type;
    return label.indexOf("MADA") !== -1 ? "debit" : "credit";
  }

  function allBankCards() {
    return BANK_CARDS.concat(state.customBankCards.map(function (c) { return c.label; }))
      .filter(function (l) { return state.removedBankCards.indexOf(l) === -1; });
  }

  function defaultBankCardConfig() {
    var config = {};
    BANK_CARDS.forEach(function (label) { config[label] = { value: 0 }; });
    return config;
  }

  var STORAGE_KEY = "ledger.financeTracker.v1";

  /* ---------- state ---------- */

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
  }

  function defaultState() {
    return {
      // Categories are generic enough to be useful out of the box, but bank
      // cards are specific accounts - a brand-new account shouldn't start
      // with 8 example cards that aren't real, so all of them start removed
      // and the user adds their own via Settings.
      categories: DEFAULT_CATEGORIES.map(function (c) { return Object.assign({}, c); }),
      transactions: [],
      recurring: [],
      loans: [],
      cards: [],
      customBankCards: [],
      removedBankCards: BANK_CARDS.slice(),
      bankCardConfig: defaultBankCardConfig(),
      settings: { currency: guessCurrency() }
    };
  }

  function guessCurrency() {
    return "SAR";
  }

  var state = load();
  if (assignCategorySlots()) save();

  function normalizeState(parsed) {
    if (!parsed.categories || !parsed.categories.length) parsed.categories = defaultState().categories;
    if (!parsed.transactions) parsed.transactions = [];
    if (!parsed.recurring) parsed.recurring = [];
    if (!parsed.loans) parsed.loans = [];
    if (!parsed.cards) parsed.cards = [];
    if (!parsed.customBankCards) parsed.customBankCards = [];
    if (!parsed.removedBankCards) parsed.removedBankCards = [];
    if (!parsed.bankCardConfig) parsed.bankCardConfig = defaultBankCardConfig();
    BANK_CARDS.concat(parsed.customBankCards.map(function (c) { return c.label; })).forEach(function (label) {
      if (!parsed.bankCardConfig[label]) parsed.bankCardConfig[label] = { value: 0 };
    });
    if (!parsed.settings) parsed.settings = { currency: guessCurrency() };
    if (parsed.settings.currency === "USD") parsed.settings.currency = "SAR";
    // One-time migration: chart color slots used to be permanently baked into
    // the 8 original default categories regardless of use, which starved any
    // custom category of ever getting a real color. Clear that out once so
    // usage-based assignment (assignCategorySlots) can take over.
    if (!parsed.categorySlotsMigratedV2) {
      parsed.categories.forEach(function (c) { c.slot = null; });
      parsed.categorySlotsMigratedV2 = true;
    }
    // One-time migration: slots used to be first-come-first-served and never
    // released, so a category used early could permanently hog a color even
    // after a heavier-spend category came along later with nowhere left to
    // go. Clear slots once more so the new spend-ranked assignment can
    // recompute them correctly for existing accounts.
    if (!parsed.categorySlotsMigratedV3) {
      parsed.categories.forEach(function (c) { c.slot = null; });
      parsed.categorySlotsMigratedV3 = true;
    }
    parsed.categories.forEach(function (c) { if (typeof c.budget !== "number") c.budget = 0; });
    if (!parsed.settings.notifyBills) parsed.settings.notifyBills = false;
    return parsed;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return normalizeState(JSON.parse(raw));
    } catch (e) { return defaultState(); }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    pushToCloud();
  }

  /* ---------- cloud sync (Firebase Auth + Firestore) ----------
     Single-user app: sign-in is just a PIN, backed by a real Firebase
     Auth account under a fixed email so the PIN is genuinely verified
     server-side rather than a fake local lock screen. First entry with
     no existing account creates it; after that the PIN must match. */

  var ACCOUNT_EMAIL = "abdallahfauze@gmail.com";
  var firebaseConfig = {
    apiKey: "AIzaSyA-YbIZYUxgc-4lPR1XJIc30WzuKIjuAeM",
    authDomain: "finance-tracker-32c9e.firebaseapp.com",
    projectId: "finance-tracker-32c9e",
    storageBucket: "finance-tracker-32c9e.firebasestorage.app",
    messagingSenderId: "474926389794",
    appId: "1:474926389794:web:043d382fb237b0c502c87b"
  };

  var cloudEnabled = typeof firebase !== "undefined";
  var auth = null, db = null;
  var isApplyingRemoteUpdate = false;
  var unsubscribeSnapshot = null;
  var pendingFirstAccount = false;

  function pushToCloud() {
    if (!cloudEnabled || isApplyingRemoteUpdate || !auth.currentUser) return;
    // Firestore rejects any field valued `undefined`; round-tripping through
    // JSON strips those defensively rather than risking a write failure.
    var payload = JSON.parse(JSON.stringify(state));
    db.collection("users").doc(auth.currentUser.uid).set(payload).catch(function (err) {
      console.error("Cloud sync failed (will retry once back online):", err);
    });
  }

  function startSync(uid) {
    stopSync();
    unsubscribeSnapshot = db.collection("users").doc(uid).onSnapshot(function (snap) {
      if (snap.metadata.hasPendingWrites) return; // our own optimistic write echoing back
      var data = snap.data();
      if (!data) { pushToCloud(); return; } // brand-new account, seed the cloud doc
      isApplyingRemoteUpdate = true;
      state = normalizeState(data);
      // A category-slot migration inside normalizeState only clears slots -
      // it doesn't reassign them, so a synced device needs this to avoid
      // showing every category as colorless "Other" until its next edit.
      var slotsChanged = assignCategorySlots();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
      isApplyingRemoteUpdate = false;
      if (slotsChanged) save();
    }, function (err) {
      console.error("Cloud sync listener error:", err);
    });
  }

  function stopSync() {
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  }

  function showLockScreen(mode) {
    pendingFirstAccount = mode === "setup";
    document.getElementById("lock-screen").classList.add("open");
    document.getElementById("lock-pin-confirm").style.display = mode === "setup" ? "block" : "none";
    document.getElementById("lock-title").textContent = mode === "setup" ? "Set Your PIN" : "Enter PIN";
    document.getElementById("lock-sub").textContent = mode === "setup"
      ? "First time here — choose a PIN (6+ characters) to protect and sync your data."
      : "Unlock to sync across your devices.";
    document.getElementById("lock-toggle").textContent = mode === "setup"
      ? "Already have a PIN? Sign in instead"
      : "First time here? Set up your PIN";
    document.getElementById("lock-pin").value = "";
    document.getElementById("lock-pin-confirm").value = "";
    document.getElementById("lock-error").textContent = "";
    document.getElementById("lock-status").textContent = "";
  }

  function hideLockScreen() {
    document.getElementById("lock-screen").classList.remove("open");

  function initCloud() {
    if (!cloudEnabled) {
      // Firebase failed to load (offline, blocked, etc.) - degrade to local-only.
      renderAll();
      return;
    }
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

    auth.onAuthStateChanged(function (user) {
      if (user) {
        hideLockScreen();
        startSync(user.uid);
        renderAll();
      } else {
        stopSync();
        showLockScreen("check");
      }
    });

    document.getElementById("lock-toggle").addEventListener("click", function () {
      showLockScreen(pendingFirstAccount ? "check" : "setup");
    });

    document.getElementById("lock-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var pin = document.getElementById("lock-pin").value;
      lockError("");

      if (pendingFirstAccount) {
        var confirmPin = document.getElementById("lock-pin-confirm").value;
        if (pin !== confirmPin) { lockError("PINs don't match — try again."); return; }
        if (pin.length < 6) { lockError("PIN must be at least 6 characters."); return; }
        lockStatus("Setting up…");
        auth.createUserWithEmailAndPassword(ACCOUNT_EMAIL, pin).catch(function (err) {
          lockStatus("");
          lockError(err.message);
        });
        return;
      }

      lockStatus("Checking…");
      auth.signInWithEmailAndPassword(ACCOUNT_EMAIL, pin).catch(function (err) {
        lockStatus("");
        if (err.code === "auth/user-not-found") {
          showLockScreen("setup");
        } else if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
          lockError("Incorrect PIN.");
        } else {
          lockError(err.message);
        }
      });
    });
  }

  /* ---------- helpers ---------- */

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function categoryColor(cat) {
    if (!cat || cat.slot === null || cat.slot === undefined) return OTHER_COLOR;
    return CAT_COLORS[cat.slot] || OTHER_COLOR;
  }

  function monogram(name) {
    var letters = (name || "?").replace(/[^A-Za-z]/g, "");
    return (letters.slice(0, 2) || "?").toUpperCase();
  }

  function fmtMoney(amount) {
    if (state.settings.currency === "SAR") return fmtSAR(amount);
    try {
      return new Intl.NumberFormat(navigator.language || "en-US", { style: "currency", currency: state.settings.currency, currencyDisplay: "narrowSymbol" }).format(amount);
    } catch (e) {
      return state.settings.currency + " " + amount.toFixed(2);
    }
  }

  function fmtSAR(amount) {
    var sign = amount < 0 ? "-" : "";
    var num;
    try {
      num = new Intl.NumberFormat(navigator.language || "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(amount));
    } catch (e) {
      num = Math.abs(amount).toFixed(2);
    }
    return sign + '<span class="sar-symbol">⃁</span> ' + num;
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function fmtDateShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function fmtDateLong(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function currentMonthKey() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }
  function monthKeyOf(iso) { return iso.slice(0, 7); }

  /* ---------- dashboard period (month/year navigation) ---------- */

  /* A function, not a cached Date - a value captured once at page load would
     go stale in a long-running tab (or an iOS home-screen app, which the OS
     suspends in the background rather than reloading), so every "current
     date" read needs to reflect the real moment it's called, not whenever
     the script first ran. */
  function today() { return new Date(); }
  var viewPeriod = { type: "month", year: today().getFullYear(), month: today().getMonth() + 1 };

  function periodRange(period) {
    if (period.type === "year") {
      return {
        start: period.year + "-01-01",
        end: (period.year + 1) + "-01-01",
        label: String(period.year)
      };
    }
    var start = period.year + "-" + pad(period.month) + "-01";
    var nextMonthDate = new Date(period.year, period.month, 1);
    var end = nextMonthDate.getFullYear() + "-" + pad(nextMonthDate.getMonth() + 1) + "-01";
    var label = new Date(period.year, period.month - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    return { start: start, end: end, label: label };
  }

  function isCurrentMonthPeriod(period) {
    return period.type === "month" && period.year === today().getFullYear() && period.month === today().getMonth() + 1;
  }

  function shiftPeriod(delta) {
    if (viewPeriod.type === "year") {
      viewPeriod = { type: "year", year: viewPeriod.year + delta };
    } else {
      var m = viewPeriod.month + delta;
      var y = viewPeriod.year;
      while (m > 12) { m -= 12; y++; }
      while (m < 1) { m += 12; y--; }
      viewPeriod = { type: "month", year: y, month: m };
    }
    renderDashboard();
  }

  function setPeriodType(type) {
    viewPeriod = { type: type, year: viewPeriod.year, month: viewPeriod.month };
    renderDashboard();
  }

  function transactionsInRange(start, end) {
    return state.transactions.filter(function (t) { return t.date >= start && t.date < end; });
  }

  function addInterval(iso, frequency) {
    var d = new Date(iso + "T00:00:00");
    if (frequency === "weekly") d.setDate(d.getDate() + 7);
    else if (frequency === "quarterly") d.setMonth(d.getMonth() + 3);
    else if (frequency === "biannual") d.setMonth(d.getMonth() + 6);
    else if (frequency === "yearly") d.setFullYear(d.getFullYear() + 1);
    else d.setMonth(d.getMonth() + 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function daysUntil(iso) {
    var target = new Date(iso + "T00:00:00");
    var now = new Date();
    now.setHours(0,0,0,0);
    return Math.round((target - now) / 86400000);
  }

  /* Trailing N calendar months ending with the current one, oldest first -
     used by the dashboard's trend charts, independent of the Month/Year
     period picker (which only affects the stat cards above). */
  function lastNMonths(n) {
    var base = new Date(today().getFullYear(), today().getMonth(), 1);
    var months = [];
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      var next = new Date(base.getFullYear(), base.getMonth() - i + 1, 1);
      months.push({
        label: d.toLocaleDateString(undefined, { month: "short" }),
        start: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-01",
        end: next.getFullYear() + "-" + pad(next.getMonth() + 1) + "-01"
      });
    }
    return months;
  }

  /* Trend charts shouldn't reach further back than the user's actual first
     transaction - months before that have no real activity, so a schedule-
     based estimate (loan balance, in particular) would draw a smooth trend
     line for a period that was never actually tracked. Returns null if
     there's no transaction history at all. */
  function trendMonths(maxN) {
    if (!state.transactions.length) return null;
    var earliest = state.transactions.reduce(function (a, t) { return t.date < a ? t.date : a; }, state.transactions[0].date);
    var earliestDate = new Date(earliest.slice(0, 7) + "-01T00:00:00");
    var base = new Date(today().getFullYear(), today().getMonth(), 1);
    var monthsBack = (base.getFullYear() - earliestDate.getFullYear()) * 12 + (base.getMonth() - earliestDate.getMonth());
    var count = Math.min(maxN, Math.max(monthsBack + 1, 1));
    if (count < 2) return null;
    return lastNMonths(count);
  }

  /* Compact number for tight chart labels (no currency symbol, k/m suffix) -
     fmtMoney's full formatting doesn't fit under a narrow bar. */
  function fmtCompact(n) {
    var abs = Math.abs(n);
    if (abs >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "m";
    if (abs >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return Math.round(n).toString();
  }

  /* A loan has no per-payment date log, just a running paymentsMade counter,
     so its balance at a past point in time can't be read back exactly. This
     estimates it from the payment schedule (start date + monthly cadence),
     which is what the Forecast tab's forward projection already assumes. */
  function loanBalanceAt(loan, dateISO) {
    var start = new Date(loan.startDate + "T00:00:00");
    var at = new Date(dateISO + "T00:00:00");
    var elapsed = (at.getFullYear() - start.getFullYear()) * 12 + (at.getMonth() - start.getMonth());
    if (elapsed < 0) elapsed = 0;
    var paid = Math.min(elapsed * loan.monthlyPayment, loan.totalAmount);
    return Math.max(loan.totalAmount - paid, 0);
  }

  var FREQUENCY_LABELS = {
    weekly: "Weekly",
    monthly: "Monthly",
    quarterly: "Quarterly",
    biannual: "Bi-Annually",
    yearly: "Yearly"
  };

  function monthlyEquivalent(payment) {
    if (payment.frequency === "weekly") return payment.amount * 4.345;
    if (payment.frequency === "quarterly") return payment.amount / 3;
    if (payment.frequency === "biannual") return payment.amount / 6;
    if (payment.frequency === "yearly") return payment.amount / 12;
    return payment.amount;
  }

  function suggestCategory(merchant) {

    for (var i = 0; i < state.categories.length; i++) {

      }
    }
    return null;
  }

  /* ---------- pull-to-refresh ----------
     A real page reload (not just a re-render) is the most reliable way to
     pick up the true current date and the latest deployed code - especially
     for the iOS home-screen app, which the OS suspends rather than reloads.
     Built on Pointer Events (not touch events) so touch and mouse share one
     code path; gated to pointerType "touch" so a mouse drag on desktop
     doesn't trigger it by accident. */
  (function initPullToRefresh() {
    var mainEl = document.querySelector("main");
    var indicator = document.getElementById("pull-indicator");
    var appbarEl = document.querySelector(".appbar");
    var PULL_THRESHOLD = 70;
    var PULL_MAX = 110;
    var INDICATOR_SIZE = 36;
    var startY = null;
    var pulling = false;

    function positionIndicator() {
      indicator.style.top = appbarEl.getBoundingClientRect().bottom + "px";
    }
    positionIndicator();
    window.addEventListener("resize", positionIndicator);

    function setDragging(isDragging) {
      mainEl.style.transition = isDragging ? "" : "transform .2s ease";
      indicator.style.transition = isDragging ? "" : "transform .2s ease, opacity .2s ease";
    }

    function reset() {
      setDragging(false);
      mainEl.style.transform = "";
      indicator.style.transform = "translate(-50%, -100%)";
      indicator.style.opacity = "0";
      indicator.classList.remove("armed");
    }

    mainEl.addEventListener("pointerdown", function (e) {
      if (e.pointerType !== "touch") return;
      if (mainEl.scrollTop > 0) return;
      if (document.getElementById("modal-overlay").classList.contains("open")) return;
      startY = e.clientY;
      pulling = true;
      setDragging(true);
    });

    mainEl.addEventListener("pointermove", function (e) {
      if (!pulling || startY === null) return;
      var delta = e.clientY - startY;
      if (delta <= 0 || mainEl.scrollTop > 0) { pulling = false; startY = null; reset(); return; }
      var damped = Math.min(delta * 0.5, PULL_MAX);
      mainEl.style.transform = "translateY(" + damped + "px)";
      indicator.style.transform = "translate(-50%, " + (damped - INDICATOR_SIZE) + "px)";
      indicator.style.opacity = String(Math.min(damped / PULL_THRESHOLD, 1));
      indicator.classList.toggle("armed", damped >= PULL_THRESHOLD);
      e.preventDefault();
    }, { passive: false });

    function pullEnd() {
      if (!pulling) return;
      pulling = false;
      startY = null;
      if (indicator.classList.contains("armed")) {
        setDragging(false);
        mainEl.style.transform = "translateY(" + PULL_THRESHOLD + "px)";
        indicator.style.transform = "translate(-50%, " + (PULL_THRESHOLD - INDICATOR_SIZE) + "px)";
        indicator.classList.add("spinning");
        location.reload();
      } else {
        reset();
      }
    }
    mainEl.addEventListener("pointerup", pullEnd);
    mainEl.addEventListener("pointercancel", pullEnd);
  })();

  function openModal(html) {
    document.getElementById("modal-sheet").innerHTML = html;
    document.getElementById("modal-overlay").classList.add("open");
  }
  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");

  /* Custom confirm dialog — window.confirm() is blocked inside a sandboxed iframe
     (no `allow-modals`), so it silently returns false instead of prompting. */
  function confirmAction(message, confirmLabel, onConfirm) {

  /* ---------- render: dashboard ---------- */

  function renderDashboard() {
    var range = periodRange(viewPeriod);
    var periodTx = transactionsInRange(range.start, range.end);
    // Transfers move money between the user's own accounts - they aren't
    // real spending or income, so they're excluded from these totals (but
    // still count toward each individual card's balance, see renderBankCardSummary).
    var realTx = periodTx.filter(function (t) { return !t.isTransfer; });
    var spent = realTx.filter(function (t) { return t.type === "expense"; }).reduce(function (s, t) { return s + t.amount; }, 0);
    var income = realTx.filter(function (t) { return t.type === "income"; }).reduce(function (s, t) { return s + t.amount; }, 0);

    var byCat = {};
    realTx.filter(function (t) { return t.type === "expense"; }).forEach(function (t) {
      byCat[t.categoryId || "__none"] = (byCat[t.categoryId || "__none"] || 0) + t.amount;
    });

    var html = "";
    html += '<div class="card">';
    html += '<div class="segmented" id="period-type-seg">';
    html += '<button type="button" data-val="month" class="' + (viewPeriod.type === "month" ? "active" : "") + '">Month</button>';
    html += '<button type="button" data-val="year" class="' + (viewPeriod.type === "year" ? "active" : "") + '">Year</button>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px">';
    html += '<button class="icon-btn accent-ghost" id="period-prev" aria-label="Previous" style="width:32px;height:32px">' + icon("chevron", "chevron-flip") + '</button>';
    html += '<h2 style="margin:0;font-size:15px">' + range.label + '</h2>';
    html += '<button class="icon-btn accent-ghost" id="period-next" aria-label="Next" style="width:32px;height:32px">' + icon("chevron") + '</button>';
    html += '</div>';
    html += '<div class="stat-row" style="margin-top:14px">';
    html += '<div class="stat spent"><div class="label">Spent</div><div class="value num">' + fmtMoney(spent) + '</div></div>';
    html += '<div class="stat income"><div class="label">Income</div><div class="value num">' + fmtMoney(income) + '</div></div>';
    html += '<div class="stat net"><div class="label">Net</div><div class="value num">' + fmtMoney(income - spent) + '</div></div>';
    html += '</div></div>';

    html += renderBudgetsCard(byCat);
    html += renderBankCardSummary(range);

    if (spent > 0) {
      html += '<div class="card"><h2>Spending by Category</h2>';
      html += renderDonut(byCat, spent);
      html += '</div>';
    }

    html += renderSpendingTrendCard();
    html += renderNetWorthTrendCard();

    if (isCurrentMonthPeriod(viewPeriod)) {
      var upcoming = state.recurring.filter(function (r) { return r.isActive && daysUntil(r.nextDueDate) <= 30; })
        .sort(function (a, b) { return a.nextDueDate < b.nextDueDate ? -1 : 1; });
      if (upcoming.length) {
        html += '<div class="card"><h2>Upcoming Bills</h2>';
        upcoming.forEach(function (r) {
          var cat = byId(state.categories, r.categoryId);
          var d = daysUntil(r.nextDueDate);
          html += '<div class="row" data-open-recurring="' + r.id + '">';
          html += badgeHtml(cat, 30);
          html += '<div class="main"><div class="title">' + escapeHtml(r.name) + '</div><div class="meta">' + fmtDateShort(r.nextDueDate) + '</div></div>';
          if (d <= 3) html += dueChip(d);
          html += '<div class="amount num">' + fmtMoney(r.amount) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }
    }

    if (!periodTx.length) {
      html += emptyState("inbox", "Nothing yet", "Add a transaction to see your dashboard come to life.");
    }

    document.getElementById("tab-dashboard").innerHTML = html;
    wireDashboardEvents();
  }

  function dueChip(d) {
    var label = d <= 0 ? "Due today" : "Due in " + d + "d";
    var cls = d <= 1 ? "critical" : "warning";
    return '<span class="chip ' + cls + '">' + icon("alert") + label + '</span>';
  }

  /* Budgets are set per category (Settings > Categories > edit a category)
     and only make sense against a single month, so this card is hidden in
     Year view. byCat is the same expense-by-category map the donut chart
     already computed for the current period - no separate pass needed. */
  function renderBudgetsCard(byCat) {
    if (viewPeriod.type !== "month") return "";
    var budgeted = state.categories.filter(function (c) { return c.budget > 0; });
    if (!budgeted.length) return "";
    var html = '<div class="card"><h2>Budgets</h2>';
    budgeted.forEach(function (c) {
      var spent = byCat[c.id] || 0;
      var ratio = spent / c.budget;
      var status = utilStatus(ratio);
      var remaining = c.budget - spent;
      html += '<div style="margin-bottom:14px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:baseline">';
      html += '<span style="font-size:14px;font-weight:600">' + escapeHtml(c.name) + '</span>';
      html += '<span class="chip ' + status + '">' + (remaining < 0 ? "Over by " + fmtMoney(-remaining) : fmtMoney(remaining) + " left") + '</span>';
      html += '</div>';
      html += '<div class="bar-track"><div class="bar-fill ' + status + '" style="width:' + (Math.min(ratio, 1) * 100) + '%"></div></div>';
      html += '<div class="footnote num">' + fmtMoney(spent) + ' of ' + fmtMoney(c.budget) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function expensedInRange(label, start, end) {
    return state.transactions
      .filter(function (t) { return t.bankCard === label && t.type === "expense" && t.date >= start && t.date < end; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
  }

  function incomeInRange(label, start, end) {
    return state.transactions
      .filter(function (t) { return t.bankCard === label && t.type === "income" && t.date >= start && t.date < end; })
      .reduce(function (s, t) { return s + t.amount; }, 0);
  }

  /* A debit card's opening balance for any period is derived, not stored:
     the one-time starting balance (set in Settings), net of every expense
     (subtracted) and income/deposit (added) dated before the period began.
     So "close" a month simply by moving to the next one - its opening
     balance is automatically last month's closing available balance, with
     no explicit rollover step needed. */
  function openingBalanceAt(label, periodStartISO) {
    var initial = (state.bankCardConfig[label] && state.bankCardConfig[label].value) || 0;
    var priorNet = state.transactions
      .filter(function (t) { return t.bankCard === label && t.date < periodStartISO && (t.type === "expense" || t.type === "income"); })
      .reduce(function (s, t) { return s + (t.type === "income" ? t.amount : -t.amount); }, 0);
    return initial + priorNet;
  }

  function renderBankCardSummary(range) {
    var debitCards = allBankCards().filter(function (l) { return bankCardType(l) === "debit"; });
    var creditCards = allBankCards().filter(function (l) { return bankCardType(l) === "credit"; });

    var html = "";
    html += '<div class="card"><h2>Debit Cards (MADA)</h2>';
    debitCards.forEach(function (label) {
      var opening = openingBalanceAt(label, range.start);
      var expensed = expensedInRange(label, range.start, range.end);
      var income = incomeInRange(label, range.start, range.end);
      var available = opening + income - expensed;
      var effectiveBase = opening + income;
      var pct = effectiveBase > 0 ? Math.min(Math.max(expensed / effectiveBase, 0), 1) : 0;
      var status = available < 0 ? "critical" : utilStatus(pct);
      html += bankCardRow(label, "Opening", opening, "Expensed", expensed, available, status, pct, income);
    });
    html += '</div>';

    html += '<div class="card"><h2>Credit Cards (Visa / Mastercard)</h2>';
    creditCards.forEach(function (label) {
      var limit = (state.bankCardConfig[label] && state.bankCardConfig[label].value) || 0;
      var used = expensedInRange(label, range.start, range.end);
      var refunded = incomeInRange(label, range.start, range.end);
      var available = limit + refunded - used;
      var pct = limit > 0 ? Math.min(Math.max(used / limit, 0), 1) : 0;
      var status = available < 0 ? "critical" : utilStatus(pct);
      html += bankCardRow(label, "Limit", limit, "Used", used, available, status, pct, refunded);
    });
    html += '</div>';

    return html;
  }

  function bankCardRow(label, capLabel, capValue, usedLabel, usedValue, available, status, pct, income) {
    var html = '<div style="margin-bottom:14px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline">';
    html += '<span style="font-size:14px;font-weight:600">' + escapeHtml(label) + '</span>';
    html += '<span class="chip ' + status + '">' + fmtMoney(available) + ' left</span>';
    html += '</div>';
    html += '<div class="bar-track"><div class="bar-fill ' + status + '" style="width:' + (pct * 100) + '%"></div></div>';
    html += '<div class="footnote num">' + capLabel + ' ' + fmtMoney(capValue) +
      (income ? ' · Income ' + fmtMoney(income) : '') +
      ' · ' + usedLabel + ' ' + fmtMoney(usedValue) + '</div>';
    html += '</div>';
    return html;
  }

  function renderDonut(byCat, total) {
    var r = 70, cx = 88, cy = 88, circ = 2 * Math.PI * r;
    var ordered = state.categories.filter(function (c) { return c.slot !== null && c.slot !== undefined; })
      .sort(function (a, b) { return a.slot - b.slot; });
    var otherTotal = 0;
    var segments = [];
    ordered.forEach(function (c) {
      var amt = byCat[c.id] || 0;
      if (amt > 0) segments.push({ cat: c, amt: amt, color: categoryColor(c) });
    });
    state.categories.filter(function (c) { return c.slot === null || c.slot === undefined; }).forEach(function (c) {
      otherTotal += byCat[c.id] || 0;
    });
    otherTotal += byCat["__none"] || 0;
    if (otherTotal > 0) segments.push({ cat: { name: "Other / Uncategorized" }, amt: otherTotal, color: OTHER_COLOR });

    var svg = '<svg viewBox="0 0 176 176"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="18" />';
    var offset = 0;
    segments.forEach(function (seg) {
      var len = (seg.amt / total) * circ;
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="18" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" />';
      offset += len;
    });
    svg += '</svg>';

    var html = '<div class="donut-wrap">' + svg +
      '<div class="donut-center"><div class="amt num">' + fmtMoney(total) + '</div><div class="lbl">Total spent</div></div></div>';

    var legendItems = segments.slice().sort(function (a, b) { return b.amt - a.amt; });
    html += '<div class="legend">';
    legendItems.forEach(function (seg) {
      var pct = Math.round((seg.amt / total) * 100);
      html += '<div class="legend-row"><span class="dot" style="background:' + seg.color + '"></span>' +
        '<span class="name">' + escapeHtml(seg.cat.name) + '</span>' +
        '<span class="amt num">' + fmtMoney(seg.amt) + '</span>' +
        '<span class="pct num">' + pct + '%</span></div>';
    });
    html += '</div>';
    return html;
  }

  function renderSpendingTrendCard() {
    var months = trendMonths(6);
    if (!months) return "";
    var totals = months.map(function (m) {
      return state.transactions.filter(function (t) {
        return !t.isTransfer && t.type === "expense" && t.date >= m.start && t.date < m.end;
      }).reduce(function (s, t) { return s + t.amount; }, 0);
    });
    if (!totals.some(function (v) { return v > 0; })) return "";

    var max = Math.max.apply(null, totals.concat([1]));
    var html = '<div class="card"><h2>Spending Trend</h2><div class="trend-bars">';
    months.forEach(function (m, i) {
      var h = max > 0 ? Math.max((totals[i] / max) * 100, 2) : 2;
      html += '<div class="trend-bar-col">';
      html += '<div class="trend-bar-value num">' + fmtCompact(totals[i]) + '</div>';
      html += '<div class="trend-bar-fill" style="height:' + h.toFixed(0) + 'px"></div>';
      html += '<div class="trend-bar-label">' + m.label + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
    return html;
  }

  function renderNetWorthTrendCard() {
    var months = trendMonths(6);
    if (!months) return "";
    var debitCards = allBankCards().filter(function (l) { return bankCardType(l) === "debit"; });
    var values = months.map(function (m) {
      var assets = debitCards.reduce(function (s, label) { return s + openingBalanceAt(label, m.end); }, 0);
      var liabilities = state.loans.filter(function (l) { return l.isActive; })
        .reduce(function (s, l) { return s + loanBalanceAt(l, m.end); }, 0);
      return assets - liabilities;
    });
    if (!values.some(function (v) { return v !== 0; })) return "";

    var w = 320, h = 100, padX = 8, padY = 14;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min -= 1; max += 1; }
    var n = values.length;
    var points = values.map(function (v, i) {
      return {
        x: padX + (i / (n - 1)) * (w - padX * 2),
        y: padY + (1 - (v - min) / (max - min)) * (h - padY * 2)
      };
    });
    var path = points.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    var areaPath = path + " L" + points[n - 1].x.toFixed(1) + "," + (h - padY) + " L" + points[0].x.toFixed(1) + "," + (h - padY) + " Z";

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="trend-line-svg">';
    svg += '<path d="' + areaPath + '" fill="var(--accent-soft)" stroke="none" />';
    svg += '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />';
    points.forEach(function (p) {
      svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5" />';
    });
    svg += '</svg>';

    var html = '<div class="card"><h2>Net Worth Trend</h2><div class="trend-line-wrap">' + svg + '</div>';
    html += '<div class="trend-line-labels">';
    months.forEach(function (m) { html += '<span>' + m.label + '</span>'; });
    html += '</div>';
    html += '<div class="footnote" style="margin-top:8px">Now: ' + fmtMoney(values[n - 1]) +
      ' · Debit balances minus active loan balances. Credit cards aren\'t included since usage resets each period.</div>';
    html += '</div>';
    return html;
  }

  function wireDashboardEvents() {
    document.querySelectorAll("#tab-dashboard [data-open-recurring]").forEach(function (el) {
      el.addEventListener("click", function () { openRecurringForm(el.getAttribute("data-open-recurring")); });
    });
    document.querySelectorAll("#period-type-seg button").forEach(function (b) {
      b.addEventListener("click", function () { setPeriodType(b.getAttribute("data-val")); });
    });
    document.getElementById("period-prev").addEventListener("click", function () { shiftPeriod(-1); });
    document.getElementById("period-next").addEventListener("click", function () { shiftPeriod(1); });
  }

  /* ---------- render: transactions ---------- */

  var txSearch = "";
  var txFilterCat = "";
  var txFilterBank = "";

  function renderTransactions() {
    var list = state.transactions.slice().sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    if (txSearch) {
      var q = txSearch.toLowerCase();
      list = list.filter(function (t) { return t.merchant.toLowerCase().indexOf(q) !== -1 || (t.note || "").toLowerCase().indexOf(q) !== -1; });
    }
    if (txFilterCat) list = list.filter(function (t) { return t.categoryId === txFilterCat; });
    if (txFilterBank) list = list.filter(function (t) { return t.bankCard === txFilterBank; });

    var html = '<div class="search-wrap">' + icon("search") + '<input type="text" id="tx-search" placeholder="Search merchant or note" value="' + escapeAttr(txSearch) + '" /></div>';

    html += '<select id="tx-filter-cat" style="margin-bottom:10px">';
    html += '<option value="">All categories</option>';
    state.categories.forEach(function (c) {
      html += '<option value="' + c.id + '"' + (txFilterCat === c.id ? " selected" : "") + '>' + escapeHtml(c.name) + '</option>';
    });
    html += '</select>';

    html += '<select id="tx-filter-bank" style="margin-bottom:16px">';
    html += '<option value="">All banks / cards</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (txFilterBank === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select>';

    if (!list.length) {
      html += emptyState("list", "No transactions", "Tap + to add your first one.");
    } else {
      var groups = [];
      var byDate = {};
      list.forEach(function (t) {
        if (!byDate[t.date]) { byDate[t.date] = []; groups.push(t.date); }
        byDate[t.date].push(t);
      });
      groups.forEach(function (date) {
        html += '<div class="section-title">' + fmtDateLong(date) + '</div><div class="card" style="padding:4px 16px">';
        byDate[date].forEach(function (t) {
          if (t.isTransfer) {
            html += '<div class="row" data-open-transfer="' + t.transferId + '">';
            html += '<div class="badge" style="background:var(--accent);width:34px;height:34px">' + icon("swap") + '</div>';
            html += '<div class="main"><div class="title">' + escapeHtml(t.merchant) + '</div>';
            html += '<div class="meta">Transfer' + (t.note ? " · " + escapeHtml(t.note) : "") + '</div></div>';
            html += '<div class="amount num' + (t.type === "income" ? " income" : "") + '">' + (t.type === "income" ? "+" : "") + fmtMoney(t.amount) + '</div>';
            html += '</div>';
            return;
          }
          var cat = byId(state.categories, t.categoryId);
          html += '<div class="row" data-open-tx="' + t.id + '">';
          html += badgeHtml(cat, 34);
          html += '<div class="main"><div class="title">' + escapeHtml(t.merchant) + '</div>';
          html += '<div class="meta">' + (cat ? escapeHtml(cat.name) : "Uncategorized") + (t.bankCard ? " · " + escapeHtml(t.bankCard) : "") + (t.note ? " · " + escapeHtml(t.note) : "") + '</div></div>';
          html += '<div class="amount num' + (t.type === "income" ? " income" : "") + '">' + (t.type === "income" ? "+" : "") + fmtMoney(t.amount) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      });
    }

    document.getElementById("tab-transactions").innerHTML = html;

    document.getElementById("tx-search").addEventListener("input", function (e) { txSearch = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-cat").addEventListener("change", function (e) { txFilterCat = e.target.value; renderTransactions(); });
    document.getElementById("tx-filter-bank").addEventListener("change", function (e) { txFilterBank = e.target.value; renderTransactions(); });
    document.querySelectorAll("#tab-transactions [data-open-tx]").forEach(function (el) {
      el.addEventListener("click", function () { openTransactionForm(el.getAttribute("data-open-tx")); });
    });
    document.querySelectorAll("#tab-transactions [data-open-transfer]").forEach(function (el) {
      el.addEventListener("click", function () { openTransferDetail(el.getAttribute("data-open-transfer")); });
    });
  }

  /* ---------- render: recurring ---------- */

  var recurringSortMode = "date";

  function sortRecurring(list) {
    var sorted = list.slice();
    if (recurringSortMode === "amount") {
      sorted.sort(function (a, b) { return a.amount - b.amount; });
    } else {
      sorted.sort(function (a, b) { return a.nextDueDate < b.nextDueDate ? -1 : (a.nextDueDate > b.nextDueDate ? 1 : 0); });
    }
    return sorted;
  }

  function renderRecurring() {
    var fixed = sortRecurring(state.recurring.filter(function (r) { return r.kind === "fixed"; }));
    var subs = sortRecurring(state.recurring.filter(function (r) { return r.kind === "subscription"; }));
    var monthlyTotal = state.recurring.filter(function (r) { return r.isActive; }).reduce(function (s, r) { return s + monthlyEquivalent(r); }, 0);

    var html = '<div class="card"><div class="disclosure"><span style="font-weight:600">Monthly total</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(monthlyTotal) + '</span></div></div>';

    if (state.recurring.length) {
      html += '<div class="segmented" id="recurring-sort-seg" style="margin-bottom:14px">';
      html += '<button type="button" data-val="date" class="' + (recurringSortMode === "date" ? "active" : "") + '">Date: Nearest first</button>';
      html += '<button type="button" data-val="amount" class="' + (recurringSortMode === "amount" ? "active" : "") + '">Amount: Low to high</button>';
      html += '</div>';
    }

    if (!state.recurring.length) {
      html += emptyState("refresh", "No recurring payments", "Add fixed bills or subscriptions to track them here.");
    } else {
      if (fixed.length) html += '<div class="section-title">Fixed Payments</div>' + recurringList(fixed);
      if (subs.length) html += '<div class="section-title">Subscriptions</div>' + recurringList(subs);
    }

    document.getElementById("tab-recurring").innerHTML = html;

    document.querySelectorAll("#tab-recurring [data-open-recurring]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-mark-paid]")) return;
        openRecurringForm(el.getAttribute("data-open-recurring"));
      });
    });
    document.querySelectorAll("#tab-recurring [data-mark-paid]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openMarkPaidConfirm(el.getAttribute("data-mark-paid"));
      });
    });
    document.querySelectorAll("#recurring-sort-seg button").forEach(function (b) {
      b.addEventListener("click", function () { recurringSortMode = b.getAttribute("data-val"); renderRecurring(); });
    });
  }

  function openMarkPaidConfirm(id) {
    var r = byId(state.recurring, id);
    if (!r) return;

    var html = '<div class="modal-head"><h3>Mark as Paid</h3><button class="icon-btn ghost" data-close style="width:30px;height:30px">' + icon("x") + '</button></div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2);margin:0 0 16px">' + escapeHtml(r.name) + ' · ' + fmtMoney(r.amount) + '</p>';
    html += '<div class="field"><label>Paid with</label><select name="bankCard" id="mark-paid-bank"><option value="">None</option>';
    allBankCards().forEach(function (bc) {
      html += '<option value="' + escapeAttr(bc) + '"' + (r.bankCard === bc ? " selected" : "") + '>' + escapeHtml(bc) + '</option>';
    });
    html += '</select></div>';
    html += '<button type="button" class="btn primary" data-confirm-paid>Confirm Payment</button>';

    openModal(html);
    document.querySelector("[data-close]").addEventListener("click", closeModal);
    document.querySelector("[data-confirm-paid]").addEventListener("click", function () {
      var bankCard = document.getElementById("mark-paid-bank").value || null;
      markPaid(id, bankCard);
      closeModal();
    });
  }

  function recurringList(list) {
    var html = '<div class="card" style="padding:4px 16px;margin-bottom:14px">';
    list.forEach(function (r) {
      var cat = byId(state.categories, r.categoryId);
      html += '<div class="row" data-open-recurring="' + r.id + '" style="opacity:' + (r.isActive ? 1 : 0.45) + '">';
      html += badgeHtml(cat, 34);
      html += '<div class="main"><div class="title">' + escapeHtml(r.name) + '</div><div class="meta">' + (FREQUENCY_LABELS[r.frequency] || capitalize(r.frequency)) + ' · due ' + fmtDateShort(r.nextDueDate) + (r.bankCard ? ' · ' + escapeHtml(r.bankCard) : '') + '</div></div>';
      html += '<div class="amount num">' + fmtMoney(r.amount) + '</div>';
      html += '<button class="icon-btn ghost" data-mark-paid="' + r.id + '" aria-label="Mark as paid" style="width:30px;height:30px">' + icon("check") + '</button>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function markPaid(id, bankCard) {
    var r = byId(state.recurring, id);
    if (!r) return;
    state.transactions.push({ id: uid(), amount: r.amount, merchant: r.name, note: "Recurring payment", date: todayISO(), type: "expense", categoryId: r.categoryId, bankCard: bankCard || null });
    r.bankCard = bankCard || null;
    r.nextDueDate = addInterval(r.nextDueDate, r.frequency);
    assignCategorySlots();
    save();
    renderAll();
  }

  /* ---------- render: loans ---------- */

  function loanProgress(loan) {
    var amountPaid = Math.min(loan.paymentsMade * loan.monthlyPayment, loan.totalAmount);
    var balance = Math.max(loan.totalAmount - amountPaid, 0);
    var pct = loan.totalAmount > 0 ? Math.min(amountPaid / loan.totalAmount, 1) : 0;
    var estTotalPayments = loan.monthlyPayment > 0 ? Math.ceil(loan.totalAmount / loan.monthlyPayment) : loan.paymentsMade;
    return { amountPaid: amountPaid, balance: balance, pct: pct, estTotalPayments: estTotalPayments, isPaidOff: balance <= 0 };
  }

  function renderLoans() {
    var html = "";
    if (!state.loans.length) {
      html += emptyState("trend-down", "No loans tracked", "Add a car payment, personal loan, or other long-term debt to track its payoff progress.");
    } else {
      var totalBalance = state.loans.filter(function (l) { return l.isActive; }).reduce(function (s, l) { return s + loanProgress(l).balance; }, 0);
      html += '<div class="card"><div class="disclosure"><span style="font-weight:600">Total balance remaining</span><span class="num" style="font-size:18px;font-weight:700">' + fmtMoney(totalBalance) + '</span></div></div>';
      html += '<div class="card" style="padding:4px 16px">';
      state.loans.forEach(function (loan) { html += loanCard(loan); });
      html += '</div>';
    }

    document.getElementById("tab-loans").innerHTML = html;

    document.querySelectorAll("#tab-loans [data-open-loan]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-mark-loan-paid]")) return;
        openLoanForm(el.getAttribute("data-open-loan"));
      });
    });
    document.querySelectorAll("#tab-loans [data-mark-loan-paid]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        openLoanMarkPaidConfirm(el.getAttribute("data-mark-loan-paid"));
      });
    });
  }

  function loanCard(loan) {
    var p = loanProgress(loan);
    var d = daysUntil(loan.nextPaymentDate);

    var html = '<div data-open-loan="' + loan.id + '" style="margin-bottom:16px;opacity:' + (loan.isActive ? 1 : 0.5) + '">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">';
    html += '<span style="font-size:14.5px;font-weight:600">' + escapeHtml(loan.name) + '</span>';
    if (p.isPaidOff) html += '<span class="chip good">' + icon("check") + 'Paid Off</span>';
    else if (d <= 3) html += dueChip(d);

  /* ---------- render: forecast ---------- */

  function renderForecast() {
    var base = new Date(today().getFullYear(), today().getMonth(), 1);
    var months = [];
    for (var i = 0; i < 12; i++) {
      var d = new Date(base.getFullYear(), base.getMonth() + i, 1);
      months.push({
        key: d.getFullYear() + "-" + pad(d.getMonth() + 1),
        label: d.toLocaleDateString(undefined, { month: "short" }) + " " + String(d.getFullYear()).slice(2)
      });
    }
    var windowStart = months[0].key + "-01";
    var windowEndDate = new Date(base.getFullYear(), base.getMonth() + 12, 1);
    var windowEnd = windowEndDate.getFullYear() + "-" + pad(windowEndDate.getMonth() + 1) + "-01";

    var matrix = {};
    var catTotals = {};

    function addToMatrix(catKey, monthKey, amount) {
      if (!matrix[catKey]) matrix[catKey] = {};
      matrix[catKey][monthKey] = (matrix[catKey][monthKey] || 0) + amount;
      catTotals[catKey] = (catTotals[catKey] || 0) + amount;
    }

    state.recurring.filter(function (r) { return r.isActive; }).forEach(function (r) {
      var catKey = r.categoryId || "__none";
      var d2 = r.nextDueDate;
      var guard = 0;
      while (d2 < windowStart && guard < 500) { d2 = addInterval(d2, r.frequency); guard++; }
      guard = 0;
      while (d2 < windowEnd && guard < 500) {
        addToMatrix(catKey, d2.slice(0, 7), r.amount);
        d2 = addInterval(d2, r.frequency);
        guard++;
      }
    });

    // Loans are finite: unlike recurring bills, projection stops once the
    // loan would be paid off, instead of continuing indefinitely.
    state.loans.filter(function (l) { return l.isActive; }).forEach(function (l) {
      var catKey = l.categoryId || "__none";
      var d2 = l.nextPaymentDate;
      var paymentsSoFar = l.paymentsMade;
      var guard = 0;
      while (d2 < windowStart && paymentsSoFar * l.monthlyPayment < l.totalAmount && guard < 500) {
        d2 = addInterval(d2, "monthly");
        paymentsSoFar++;
        guard++;
      }
      guard = 0;
      while (d2 < windowEnd && paymentsSoFar * l.monthlyPayment < l.totalAmount && guard < 500) {
        addToMatrix(catKey, d2.slice(0, 7), l.monthlyPayment);
        d2 = addInterval(d2, "monthly");
        paymentsSoFar++;
        guard++;
      }
    });

    var catKeys = Object.keys(matrix).sort(function (a, b) { return catTotals[b] - catTotals[a]; });

    var html = '<div class="card"><p class="footnote" style="margin:0">Projected from your active recurring payments and loans over the next 12 months.</p></div>';

    if (!catKeys.length) {
      html += emptyState("grid", "Nothing to forecast", "Add active recurring payments or loans to see expected monthly totals here.");
    } else {
      html += '<div class="card"><div class="forecast-scroll"><table class="forecast-table"><thead><tr><th>Category</th>';
      months.forEach(function (m) { html += '<th>' + m.label + '</th>'; });
      html += '</tr></thead><tbody>';
      catKeys.forEach(function (catKey) {
        var cat = catKey === "__none" ? null : byId(state.categories, catKey);
        html += '<tr><td>' + escapeHtml(cat ? cat.name : "Uncategorized") + '</td>';
        months.forEach(function (m) {
          var amt = (matrix[catKey] && matrix[catKey][m.key]) || 0;
          html += '<td class="num' + (amt === 0 ? ' zero' : '') + '">' + (amt === 0 ? '–' : fmtMoney(amt)) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody><tfoot><tr><td>Total</td>';
      months.forEach(function (m) {
        var colTotal = 0;
        catKeys.forEach(function (catKey) { colTotal += (matrix[catKey] && matrix[catKey][m.key]) || 0; });
        html += '<td class="num">' + fmtMoney(colTotal) + '</td>';
      });
      html += '</tr></tfoot></table></div></div>';
    }

    document.getElementById("tab-forecast").innerHTML = html;
  }

  function transferHistory() {
    var byId2 = {};

      byId2[t.transferId][t.type] = t;
