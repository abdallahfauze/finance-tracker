  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    /* Kills double-tap-to-zoom specifically (the app's own tap targets are
       already sized for touch, so the gesture only ever mis-fires between
       quick taps) - pinch-zoom stays available for anyone who needs it,
       unlike the more common but accessibility-hostile fix of disabling
       zoom entirely via the viewport meta tag. */
    touch-action: manipulation;
  }
  button, input, select { font-family: inherit; }

  /* Calibrated-readout numerals: every currency/count value in the app uses
     this class, so this one rule carries the "instrument panel" identity
     everywhere at once. */
  .num {
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--page);
  }

  .appbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 14px) 18px 14px;
    background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .appbar h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .appbar .sub {
    font-size: 11px;
    color: var(--ink-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn { transition: transform .1s ease, opacity .1s ease; }
  .icon-btn:active { opacity: 0.8; transform: scale(0.93); }
  /* A soft accent glow reads well against the dark theme's deep-ink surfaces
     but looks muddy on light paper, so it's dark-mode only. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .icon-btn:not(.ghost) {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 2px 14px color-mix(in srgb, var(--accent) 40%, transparent);
    }
  }
  :root[data-theme="dark"] .icon-btn:not(.ghost) {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 2px 14px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .icon-btn.ghost {
    background: var(--surface-2);
    color: var(--ink);
  }
  .icon-btn.accent-ghost {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main { flex: 1; overflow-y: auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  section.tab { display: none; }
  section.tab.active { display: block; animation: tab-in .25s ease; }
  @keyframes tab-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  nav.tabbar {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 480px;
    display: flex;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  nav.tabbar button {
    position: relative;
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 2px 8px;
    color: var(--ink-muted);
    cursor: pointer;
  }
  nav.tabbar button svg { width: 22px; height: 22px; flex-shrink: 0; }
  nav.tabbar button span {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar button.active::before {
    content: "";
    position: absolute; top: 2px; left: 50%;
    width: 5px; height: 5px;
    background: var(--accent);
    transform: translateX(-50%) rotate(45deg);
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    padding: 16px;
  }
  .card + .card { margin-top: 14px; }
  /* Calibration strip - only on cards with a named header, so it reads as a
     panel label's tick marks rather than decorating every surface. */
  .card:has(> h2)::before {
    content: "";
    position: absolute;
    top: 1px; left: 14px; right: 14px;
    height: 3px;
    background-image: repeating-linear-gradient(to right, var(--accent) 0 2px, transparent 2px 7px);
    opacity: 0.85;
    pointer-events: none;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-2);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .hero-num {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .stat-row { display: flex; gap: 10px; }
  .stat {
    flex: 1;
    text-align: center;
    padding: 12px 6px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
  }
  .stat .label { font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .stat .value { font-size: 19px; margin-top: 4px; }
  .stat.spent .value { color: var(--critical); }
  .stat.income .value { color: var(--good); }
  .stat.net .value { color: var(--accent); }

  .donut-wrap { position: relative; width: 188px; height: 188px; margin: 20px auto 4px; }
  .donut-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .donut-total { text-align: center; margin: 6px 0 4px; }
  .donut-total .amt { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }
  .donut-total .lbl { font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* Each wedge is a separate path, pre-offset outward along its own mid-
     angle via --tx/--ty (the "exploded pie" look) - the resting rule below
     is what's shown if scroll-in JS/IntersectionObserver never runs (no
     support, or reduced motion). The pending/animating classes on
     .donut-wrap are what turn that resting render into a scroll-triggered
     wiggle-into-place entrance instead.

     The 3D read comes from .donut-seg-shadow: a darker copy of the exact
     same wedge shape, sitting directly beneath the real (gradient-filled)
     wedge and offset a fixed 6px down via the standalone `translate`
     property - deliberately NOT part of the `transform` shorthand, so it
     composes with whatever `transform` (explode offset, wiggle-in, hover
     pop) is active on that wedge at any moment instead of needing its own
     duplicate keyframes. The result reads as the wedge's own extruded
     underside, like a thick slice of cake. */
  .donut-seg, .donut-seg-shadow, .donut-seg-label {
    transform-box: fill-box; transform-origin: center;
    transform: translate(var(--tx), var(--ty)) scale(1);
    opacity: 1;
    transition: transform .15s ease, opacity .15s ease, translate .15s ease;
  }
  .donut-seg-shadow { translate: 0 6px; pointer-events: none; }
  .donut-seg-label {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; font-weight: 700;
    text-anchor: middle; dominant-baseline: central;
    pointer-events: none;
  }
  .donut-wrap.pending .donut-seg,
  .donut-wrap.pending .donut-seg-shadow,
  .donut-wrap.pending .donut-seg-label {
    opacity: 0; transform: translate(0, 0) scale(.4); transition: none;
  }
  .donut-wrap.animating .donut-seg,
  .donut-wrap.animating .donut-seg-shadow {
    animation: wedge-in .68s cubic-bezier(.34,1.4,.4,1) both;
    animation-delay: calc(var(--i) * 55ms);
  }
  .donut-wrap.animating .donut-seg-label {
    animation: wedge-label-in .4s ease both;
    animation-delay: calc(var(--i) * 55ms + 280ms);
  }
  @keyframes wedge-in {
    0%   { opacity: 0; transform: translate(0, 0) scale(.4) rotate(-10deg); }
    45%  { opacity: 1; transform: translate(calc(var(--tx) * 1.3), calc(var(--ty) * 1.3)) scale(1.08) rotate(5deg); }
    68%  { transform: translate(calc(var(--tx) * .85), calc(var(--ty) * .85)) scale(.96) rotate(-2deg); }
    85%  { transform: translate(calc(var(--tx) * 1.06), calc(var(--ty) * 1.06)) scale(1.02) rotate(1deg); }
    100% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1) rotate(0deg); }
  }
  @keyframes wedge-label-in {
    from { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.6); }
    to   { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1); }
  }
  .donut-wrap.hovering .donut-seg { opacity: .32; }
  .donut-wrap.hovering .donut-seg-shadow { opacity: .32; }
  .donut-wrap.hovering .donut-seg-label { opacity: .32; }
  .donut-wrap.hovering .donut-seg.active,
  .donut-wrap.hovering .donut-seg-shadow.active {
    opacity: 1; transform: translate(calc(var(--tx) * 1.35), calc(var(--ty) * 1.35)) scale(1.05);
  }
  .donut-wrap.hovering .donut-seg-label.active {
    opacity: 1; transform: translate(calc(var(--tx) * 1.35), calc(var(--ty) * 1.35)) scale(1.05);
  }
  @media (prefers-reduced-motion: reduce) {
    .donut-wrap.pending .donut-seg, .donut-wrap.pending .donut-seg-shadow, .donut-wrap.pending .donut-seg-label { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1); }
    .donut-wrap.animating .donut-seg, .donut-wrap.animating .donut-seg-shadow, .donut-wrap.animating .donut-seg-label { animation: none; }
  }

  .legend { display: flex; flex-direction: column; gap: 2px; margin-top: 16px; }
  .legend-row {
    display: flex; align-items: center; gap: 10px; font-size: 13.5px;
    padding: 7px 6px; margin: 0 -6px; border-radius: var(--radius-sm);
    transition: background-color .12s ease, opacity .12s ease;
  }
  .legend-row:hover, .legend-row:active { background: var(--surface-2); }
  .legend-row.dim { opacity: .38; }
  .dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }
  .legend-main { flex: 1; min-width: 0; }
  .legend-top { display: flex; align-items: baseline; gap: 8px; }
  .legend-top .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-top .amt { color: var(--ink-2); font-size: 12.5px; }
  .legend-bar-track { height: 3px; border-radius: 999px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
  .legend-bar-fill { height: 100%; border-radius: 999px; transition: width .4s cubic-bezier(.16,1,.3,1); }
  .legend-row .pct { color: var(--ink-muted); width: 32px; text-align: right; font-size: 12px; flex-shrink: 0; }

  .trend-legend { display: flex; gap: 16px; margin: 2px 0 12px; }
  .trend-legend-item {
    display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink-muted);
    text-transform: uppercase; letter-spacing: 0.05em; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .trend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; box-sizing: border-box; }
  .trend-swatch.actual { background: var(--accent); }
  .trend-swatch.forecast { background: var(--accent-warm-soft); border: 1px solid color-mix(in srgb, var(--accent-warm) 55%, transparent); }

  .trend-bars { display: flex; align-items: flex-end; gap: 8px; margin-top: 4px; }
  .trend-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .trend-bar-values { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-bottom: 4px; }
  .trend-bar-values .actual { font-size: 9.5px; font-weight: 700; white-space: nowrap; color: var(--accent); }
  .trend-bar-values .forecast { font-size: 8.5px; font-weight: 600; white-space: nowrap; color: var(--accent-warm); }
  /* Forecast gets its own dedicated hue (the app's secondary "warm" accent,
     already used for milestone chips) rather than a soft version of the
     actual bar's color, so the two series are never mistaken for one
     another even at a glance. Both value labels above match their own
     bar's color one-to-one - no separate over/under signal here. */

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
(function () {
  "use strict";

  /* ---------- constants ---------- */

  var CAT_COLORS = ["var(--cat0)","var(--cat1)","var(--cat2)","var(--cat3)","var(--cat4)","var(--cat5)","var(--cat6)","var(--cat7)"];
  var OTHER_COLOR = "var(--cat-other)";

  var DEFAULT_CATEGORIES = [
    { id: "transport", name: "Transport", slot: null, isSystem: true, keywords: ["uber","careem","lyft","taxi","fuel","petrol","gas station","parking","metro","adnoc","enoc"] },
    { id: "dining", name: "Dining", slot: null, isSystem: true, keywords: ["restaurant","cafe","coffee","starbucks","costa","mcdonald","kfc","talabat","deliveroo","doordash","uber eats"] },
    { id: "groceries", name: "Groceries", slot: null, isSystem: true, keywords: ["carrefour","lulu","spinneys","whole foods","trader joe","kroger","grocery","supermarket","market"] },
    { id: "utilities", name: "Utilities", slot: null, isSystem: true, keywords: ["electricity","water bill","etisalat","telecom","internet","utility","dewa","sewa"] },
    { id: "shopping", name: "Shopping", slot: null, isSystem: true, keywords: ["amazon","noon","shein","mall","store","shop"] },
    { id: "rent", name: "Rent & Housing", slot: null, isSystem: true, keywords: ["rent","mortgage","landlord","housing"] },
    { id: "subscriptions", name: "Subscriptions", slot: null, isSystem: true, keywords: ["netflix","spotify","icloud","youtube premium","disney+","amazon prime","shahid","osn"] },
    { id: "entertainment", name: "Entertainment", slot: null, isSystem: true, keywords: ["cinema","movie","vox","theatre","concert","game"] },
    { id: "health", name: "Health", slot: null, isSystem: true, keywords: ["pharmacy","clinic","hospital","doctor","insurance"] },
    { id: "income", name: "Income", slot: null, isSystem: true, keywords: ["salary","payroll","deposit","transfer in","refund"] },
    { id: "other", name: "Other", slot: null, isSystem: true, keywords: [] }
  ];

  /* Chart colors are earned, not pre-assigned: the 8 categories with the
     highest lifetime expense total get a real color slot; everything else
     stays grey and folds into "Other / Uncategorized" on the donut. This is
     recomputed (not just appended to) on every call, so a category that
     used to be top-8 but has since been overtaken loses its slot to make
     room - otherwise whichever categories happened to be used *first* would
     permanently hog colors even after a heavier-spend category showed up. */
  function assignCategorySlots() {
    var totals = {};
    state.transactions.forEach(function (t) {
      if (t.type !== "expense" || !t.categoryId) return;
      totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount;
    });
    var eligible = state.categories.filter(function (c) { return (totals[c.id] || 0) > 0; });
    eligible.sort(function (a, b) {
      var diff = (totals[b.id] || 0) - (totals[a.id] || 0);
      return diff !== 0 ? diff : (a.id < b.id ? -1 : 1);
    });
    var top8Ids = {};
    eligible.slice(0, 8).forEach(function (c) { top8Ids[c.id] = true; });

    var changed = false;
    state.categories.forEach(function (c) {
      if (typeof c.slot === "number" && !top8Ids[c.id]) { c.slot = null; changed = true; }
    });
    eligible.slice(0, 8).forEach(function (c) {
      if (typeof c.slot === "number") return;
      var used = {};
      state.categories.forEach(function (x) { if (typeof x.slot === "number") used[x.slot] = true; });
      for (var i = 0; i < 8; i++) {
        if (!used[i]) { c.slot = i; changed = true; break; }
      }
    });
    return changed;
  }

  var CURRENCIES = ["USD","EUR","GBP","AED","SAR","EGP","KWD","QAR"];

  var BANK_CARDS = [
    "SAB VISA 4576",
    "SAB VISA 6438",
    "SAB MADA 5007",
    "SAB MADA 8929",
    "SNB MASTER 9341",
    "SNB MADA 4649",
    "RAJHI MADA 0464",
    "SAIB MADA 9590"
  ];

  function bankCardType(label) {
    var custom = state.customBankCards.filter(function (c) { return c.label === label; })[0];
    if (custom) return custom.type;
    return label.indexOf("MADA") !== -1 ? "debit" : "credit";
  }

  function allBankCards() {
    return BANK_CARDS.concat(state.customBankCards.map(function (c) { return c.label; }))
      .filter(function (l) { return state.removedBankCards.indexOf(l) === -1; });
  }

  function defaultBankCardConfig() {
    var config = {};
    BANK_CARDS.forEach(function (label) { config[label] = { value: 0 }; });
    return config;
  }

  var STORAGE_KEY = "ledger.financeTracker.v1";

  /* ---------- state ---------- */

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
  }

  function defaultState() {
    return {
      // Categories are generic enough to be useful out of the box, but bank
      // cards are specific accounts - a brand-new account shouldn't start
      // with 8 example cards that aren't real, so all of them start removed
      // and the user adds their own via Settings.
      categories: DEFAULT_CATEGORIES.map(function (c) { return Object.assign({}, c); }),
      transactions: [],
      recurring: [],
      loans: [],
      cards: [],
      customBankCards: [],
      removedBankCards: BANK_CARDS.slice(),
      bankCardConfig: defaultBankCardConfig(),
      settings: { currency: guessCurrency() }
    };
  }

  function guessCurrency() {
    return "SAR";
  }

  var state = load();
  if (assignCategorySlots()) save();

  function normalizeState(parsed) {
    if (!parsed.categories || !parsed.categories.length) parsed.categories = defaultState().categories;
    if (!parsed.transactions) parsed.transactions = [];
    if (!parsed.recurring) parsed.recurring = [];
    if (!parsed.loans) parsed.loans = [];
    if (!parsed.cards) parsed.cards = [];
    if (!parsed.customBankCards) parsed.customBankCards = [];
    if (!parsed.removedBankCards) parsed.removedBankCards = [];
    if (!parsed.bankCardConfig) parsed.bankCardConfig = defaultBankCardConfig();
    BANK_CARDS.concat(parsed.customBankCards.map(function (c) { return c.label; })).forEach(function (label) {
      if (!parsed.bankCardConfig[label]) parsed.bankCardConfig[label] = { value: 0 };
    });
    if (!parsed.settings) parsed.settings = { currency: guessCurrency() };
    if (parsed.settings.currency === "USD") parsed.settings.currency = "SAR";
    // One-time migration: chart color slots used to be permanently baked into
    // the 8 original default categories regardless of use, which starved any
    // custom category of ever getting a real color. Clear that out once so
    // usage-based assignment (assignCategorySlots) can take over.
    if (!parsed.categorySlotsMigratedV2) {
      parsed.categories.forEach(function (c) { c.slot = null; });
      parsed.categorySlotsMigratedV2 = true;
    }
    // One-time migration: slots used to be first-come-first-served and never
    // released, so a category used early could permanently hog a color even
    // after a heavier-spend category came along later with nowhere left to
    // go. Clear slots once more so the new spend-ranked assignment can
    // recompute them correctly for existing accounts.
    if (!parsed.categorySlotsMigratedV3) {
      parsed.categories.forEach(function (c) { c.slot = null; });
      parsed.categorySlotsMigratedV3 = true;
    }
    parsed.categories.forEach(function (c) { if (typeof c.budget !== "number") c.budget = 0; });
    if (!parsed.settings.notifyBills) parsed.settings.notifyBills = false;
    // Recurring items didn't used to have a start/end window - backfill
    // existing ones as having always been open-ended, so this migration
    // can't retroactively clip a forecast or trend that already worked.
    parsed.recurring.forEach(function (r) {
      if (!r.startDate) r.startDate = "1970-01-01";
      if (r.endDate === undefined) r.endDate = null;
      if (!r.kind) r.kind = "subscription";
    });
    return parsed;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return normalizeState(JSON.parse(raw));
    } catch (e) { return defaultState(); }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    pushToCloud();
  }

  /* ---------- cloud sync (Firebase Auth + Firestore) ----------
     Multi-tenant: each person signs up with their own email + PIN, backed
     by a real Firebase Auth account so the PIN is genuinely verified
     server-side rather than a fake local lock screen. Firestore documents
     are already keyed by auth UID and the security rules already scope
     each one to its owner, so per-user data isolation needed no changes -
     only the sign-in screen itself was hardcoded to a single email. */

  var LAST_EMAIL_KEY = "ledger.financeTracker.lastEmail";
  var firebaseConfig = {
    apiKey: "AIzaSyA-YbIZYUxgc-4lPR1XJIc30WzuKIjuAeM",
    authDomain: "finance-tracker-32c9e.firebaseapp.com",
    projectId: "finance-tracker-32c9e",
    storageBucket: "finance-tracker-32c9e.firebasestorage.app",
    messagingSenderId: "474926389794",
    appId: "1:474926389794:web:043d382fb237b0c502c87b"
  };

  var cloudEnabled = typeof firebase !== "undefined";
  var auth = null, db = null;
  var isApplyingRemoteUpdate = false;
  var unsubscribeSnapshot = null;
  var pendingFirstAccount = false;

  function pushToCloud() {
    if (!cloudEnabled || isApplyingRemoteUpdate || !auth.currentUser) return;
    // Firestore rejects any field valued `undefined`; round-tripping through
    // JSON strips those defensively rather than risking a write failure.
    var payload = JSON.parse(JSON.stringify(state));
    db.collection("users").doc(auth.currentUser.uid).set(payload).catch(function (err) {
      console.error("Cloud sync failed (will retry once back online):", err);
    });
  }

  function startSync(uid) {
    stopSync();
    unsubscribeSnapshot = db.collection("users").doc(uid).onSnapshot(function (snap) {
      if (snap.metadata.hasPendingWrites) return; // our own optimistic write echoing back
      var data = snap.data();
      if (!data) { pushToCloud(); return; } // brand-new account, seed the cloud doc
      isApplyingRemoteUpdate = true;
      state = normalizeState(data);
      // A category-slot migration inside normalizeState only clears slots -
      // it doesn't reassign them, so a synced device needs this to avoid
      // showing every category as colorless "Other" until its next edit.
      var slotsChanged = assignCategorySlots();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
      isApplyingRemoteUpdate = false;
      if (slotsChanged) save();
    }, function (err) {
      console.error("Cloud sync listener error:", err);
    });
  }

  function stopSync() {
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  }

  function showLockScreen(mode) {
    pendingFirstAccount = mode === "setup";
    document.getElementById("lock-screen").classList.add("open");
    document.getElementById("lock-pin-confirm").style.display = mode === "setup" ? "block" : "none";
    document.getElementById("lock-title").textContent = mode === "setup" ? "Set Your PIN" : "Enter PIN";
    document.getElementById("lock-sub").textContent = mode === "setup"
      ? "First time here — choose a PIN (6+ characters) to protect and sync your data."
      : "Unlock to sync across your devices.";
    document.getElementById("lock-toggle").textContent = mode === "setup"
      ? "Already have a PIN? Sign in instead"
      : "First time here? Set up your PIN";
    document.getElementById("lock-pin").value = "";
    document.getElementById("lock-pin-confirm").value = "";
    document.getElementById("lock-error").textContent = "";
    document.getElementById("lock-status").textContent = "";
  }

  function hideLockScreen() {
    document.getElementById("lock-screen").classList.remove("open");
  }

  function lockError(message) {
    document.getElementById("lock-error").textContent = message;
  }

  function lockStatus(message) {
    document.getElementById("lock-status").textContent = message;
  }

  function initCloud() {
    if (!cloudEnabled) {
      // Firebase failed to load (offline, blocked, etc.) - degrade to local-only.
      renderAll();
      return;
    }
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

    auth.onAuthStateChanged(function (user) {
      if (user) {
        localStorage.setItem(LAST_EMAIL_KEY, user.email);
        hideLockScreen();
        startSync(user.uid);
        renderAll();
      } else {
        stopSync();
        var rememberedEmail = localStorage.getItem(LAST_EMAIL_KEY);
        if (rememberedEmail) document.getElementById("lock-email").value = rememberedEmail;
        showLockScreen("check");
      }
    });

    document.getElementById("lock-toggle").addEventListener("click", function () {
      showLockScreen(pendingFirstAccount ? "check" : "setup");
    });

    document.getElementById("lock-forgot").addEventListener("click", function () {
      var email = document.getElementById("lock-email").value.trim();
      if (!email) { lockError("Enter your email above first, then tap this again."); return; }
      lockError("");
      lockStatus("Sending reset link…");
      auth.sendPasswordResetEmail(email).then(function () {
        lockStatus("Reset link sent — check your email.");
      }).catch(function (err) {
        lockStatus("");
        lockError(err.message);
      });
    });

    document.getElementById("lock-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("lock-email").value.trim();
      var pin = document.getElementById("lock-pin").value;
      lockError("");
      if (!email) { lockError("Enter your email."); return; }

      if (pendingFirstAccount) {
        var confirmPin = document.getElementById("lock-pin-confirm").value;
        if (pin !== confirmPin) { lockError("PINs don't match — try again."); return; }
        if (pin.length < 6) { lockError("PIN must be at least 6 characters."); return; }
        lockStatus("Setting up…");
        auth.createUserWithEmailAndPassword(email, pin).catch(function (err) {
          lockStatus("");
          if (err.code === "auth/email-already-in-use") {
            showLockScreen("check");
            lockError("An account already exists for that email — enter your PIN to sign in.");
          } else {
            lockError(err.message);
          }
        });
        return;
      }

      lockStatus("Checking…");
      auth.signInWithEmailAndPassword(email, pin).catch(function (err) {
        lockStatus("");
        if (err.code === "auth/user-not-found") {
          showLockScreen("setup");
        } else if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
          lockError("Incorrect email or PIN.");
        } else {
          lockError(err.message);
        }
      });
    });
  }

  /* ---------- helpers ---------- */

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function categoryColor(cat) {
    if (!cat || cat.slot === null || cat.slot === undefined) return OTHER_COLOR;
    return CAT_COLORS[cat.slot] || OTHER_COLOR;
  }

  function monogram(name) {
    var letters = (name || "?").replace(/[^A-Za-z]/g, "");
    return (letters.slice(0, 2) || "?").toUpperCase();
  }

  function fmtMoney(amount) {
    if (state.settings.currency === "SAR") return fmtSAR(amount);
    try {
      return new Intl.NumberFormat(navigator.language || "en-US", { style: "currency", currency: state.settings.currency, currencyDisplay: "narrowSymbol" }).format(amount);
    } catch (e) {
      return state.settings.currency + " " + amount.toFixed(2);
    }
  }

  function fmtSAR(amount) {
    var sign = amount < 0 ? "-" : "";
    var num;
    try {
      num = new Intl.NumberFormat(navigator.language || "en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(amount));
    } catch (e) {
      num = Math.abs(amount).toFixed(2);
    }
    return sign + '<span class="sar-symbol">⃁</span> ' + num;
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function fmtDateShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function fmtDateLong(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function currentMonthKey() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }
  function monthKeyOf(iso) { return iso.slice(0, 7); }

  /* ---------- dashboard period (month/year navigation) ---------- */

  /* A function, not a cached Date - a value captured once at page load would
     go stale in a long-running tab (or an iOS home-screen app, which the OS
     suspends in the background rather than reloading), so every "current
     date" read needs to reflect the real moment it's called, not whenever
     the script first ran. */
  function today() { return new Date(); }
  var viewPeriod = { type: "month", year: today().getFullYear(), month: today().getMonth() + 1 };

  function periodRange(period) {
    if (period.type === "year") {
      return {
        start: period.year + "-01-01",
        end: (period.year + 1) + "-01-01",
        label: String(period.year)
      };
    }
    var start = period.year + "-" + pad(period.month) + "-01";
    var nextMonthDate = new Date(period.year, period.month, 1);
    var end = nextMonthDate.getFullYear() + "-" + pad(nextMonthDate.getMonth() + 1) + "-01";
    var label = new Date(period.year, period.month - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    return { start: start, end: end, label: label };
  }

  function isCurrentMonthPeriod(period) {
    return period.type === "month" && period.year === today().getFullYear() && period.month === today().getMonth() + 1;
  }

  function shiftPeriod(delta) {
    if (viewPeriod.type === "year") {
      viewPeriod = { type: "year", year: viewPeriod.year + delta };
    } else {
      var m = viewPeriod.month + delta;
      var y = viewPeriod.year;
      while (m > 12) { m -= 12; y++; }
      while (m < 1) { m += 12; y--; }
      viewPeriod = { type: "month", year: y, month: m };
    }
    renderDashboard();
  }

  function setPeriodType(type) {
    viewPeriod = { type: type, year: viewPeriod.year, month: viewPeriod.month };
    renderDashboard();
  }

  function transactionsInRange(start, end) {
    return state.transactions.filter(function (t) { return t.date >= start && t.date < end; });
  }

  function addInterval(iso, frequency) {
    var d = new Date(iso + "T00:00:00");
    if (frequency === "weekly") d.setDate(d.getDate() + 7);
    else if (frequency === "quarterly") d.setMonth(d.getMonth() + 3);
    else if (frequency === "biannual") d.setMonth(d.getMonth() + 6);
    else if (frequency === "yearly") d.setFullYear(d.getFullYear() + 1);
    else d.setMonth(d.getMonth() + 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function subtractInterval(iso, frequency) {
    var d = new Date(iso + "T00:00:00");
    if (frequency === "weekly") d.setDate(d.getDate() - 7);
    else if (frequency === "quarterly") d.setMonth(d.getMonth() - 3);
    else if (frequency === "biannual") d.setMonth(d.getMonth() - 6);
    else if (frequency === "yearly") d.setFullYear(d.getFullYear() - 1);
    else d.setMonth(d.getMonth() - 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  /* How many times a recurring schedule anchored at anchorISO lands inside
     [rangeStart, rangeEnd) - walking backward first when the anchor is
     already past rangeStart, so this works equally well for a future month
     (the common case) and a past one (Spending Trend's actual-vs-forecast
     needs the same schedule projected backward across recent history). */
  /* itemStart/itemEnd are the recurring item's (or loan's) own active
     window - a promotional subscription that ends in March shouldn't keep
     projecting into April just because its weekly/monthly schedule would
     otherwise carry on forever. Both are optional; omit either to leave
     that side unbounded. */
  function occurrencesInRange(anchorISO, frequency, rangeStart, rangeEnd, itemStart, itemEnd) {
    var d = anchorISO;
    var guard = 0;
    if (d < rangeStart) {
      while (d < rangeStart && guard < 600) { d = addInterval(d, frequency); guard++; }
    } else {
      while (d >= rangeStart && guard < 600) { d = subtractInterval(d, frequency); guard++; }
      guard = 0;
      while (d < rangeStart && guard < 600) { d = addInterval(d, frequency); guard++; }
    }
    var count = 0;
    guard = 0;
    while (d < rangeEnd && guard < 600) {
      if ((!itemEnd || d <= itemEnd) && (!itemStart || d >= itemStart)) count++;
      d = addInterval(d, frequency);
      guard++;
    }
    return count;
  }

  /* Same projection the Forecast tab uses (active recurring + loans), just
     generalized to any date range instead of a matrix keyed by category -
     Spending Trend needs one flat total per month, past or present.
     Recurring income (salary etc.) is deliberately excluded - this feeds
     an expense-only forecast, same as the Forecast tab's own matrix. */
  function forecastTotalForRange(rangeStart, rangeEnd) {
    var total = 0;
    state.recurring.filter(function (r) { return r.isActive && r.kind !== "income"; }).forEach(function (r) {
      total += occurrencesInRange(r.nextDueDate, r.frequency, rangeStart, rangeEnd, r.startDate, r.endDate) * r.amount;
    });
    state.loans.filter(function (l) { return l.isActive; }).forEach(function (l) {
      total += occurrencesInRange(l.nextPaymentDate, "monthly", rangeStart, rangeEnd, l.startDate, l.endDate) * l.monthlyPayment;
    });
    return total;
  }

  function daysUntil(iso) {
    var target = new Date(iso + "T00:00:00");
    var now = new Date();
    now.setHours(0,0,0,0);
    return Math.round((target - now) / 86400000);
  }

  /* Trailing N calendar months ending with the current one, oldest first -
     used by the dashboard's trend charts, independent of the Month/Year
     period picker (which only affects the stat cards above). */
  function lastNMonths(n) {
    var base = new Date(today().getFullYear(), today().getMonth(), 1);
    var months = [];
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      var next = new Date(base.getFullYear(), base.getMonth() - i + 1, 1);
      months.push({
        label: d.toLocaleDateString(undefined, { month: "short" }),
        start: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-01",
        end: next.getFullYear() + "-" + pad(next.getMonth() + 1) + "-01"
      });
    }
    return months;
  }

  /* Trend charts shouldn't reach further back than the user's actual first
     transaction - months before that have no real activity, so a schedule-
     based estimate (loan balance, in particular) would draw a smooth trend
     line for a period that was never actually tracked. Returns null if
     there's no transaction history at all. */
  function trendMonths(maxN) {
    if (!state.transactions.length) return null;
    var earliest = state.transactions.reduce(function (a, t) { return t.date < a ? t.date : a; }, state.transactions[0].date);
    var earliestDate = new Date(earliest.slice(0, 7) + "-01T00:00:00");
    var base = new Date(today().getFullYear(), today().getMonth(), 1);
    var monthsBack = (base.getFullYear() - earliestDate.getFullYear()) * 12 + (base.getMonth() - earliestDate.getMonth());
    var count = Math.min(maxN, Math.max(monthsBack + 1, 1));
    if (count < 2) return null;
    return lastNMonths(count);
  }

  /* Compact number for tight chart labels (no currency symbol, k/m suffix) -
     fmtMoney's full formatting doesn't fit under a narrow bar. */
  function fmtCompact(n) {
    var abs = Math.abs(n);
    if (abs >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "m";
    if (abs >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return Math.round(n).toString();
  }

  /* Whole number with thousands separators, no currency symbol and no k/m
     abbreviation - for the Forecast table, which needs to stay compact
     enough to fit three columns per month but where round-tripping real
     figures through "1.2k" made it harder to read at a glance. */
  function fmtWhole(n) {
    try {
      return new Intl.NumberFormat(navigator.language || "en-US", { maximumFractionDigits: 0 }).format(Math.round(n));
    } catch (e) {
      return Math.round(n).toString();
    }
  }

  var FREQUENCY_LABELS = {
    weekly: "Weekly",
    monthly: "Monthly",
    quarterly: "Quarterly",
    biannual: "Bi-Annually",
    yearly: "Yearly"
  };

  function monthlyEquivalent(payment) {
    if (payment.frequency === "weekly") return payment.amount * 4.345;
    if (payment.frequency === "quarterly") return payment.amount / 3;
    if (payment.frequency === "biannual") return payment.amount / 6;
    if (payment.frequency === "yearly") return payment.amount / 12;
    return payment.amount;
  }

  function suggestCategory(merchant) {
    var text = (merchant || "").toLowerCase().trim();
    if (!text) return null;
    for (var i = 0; i < state.categories.length; i++) {
      var cat = state.categories[i];
      for (var j = 0; j < cat.keywords.length; j++) {
        if (text.indexOf(cat.keywords[j].toLowerCase()) !== -1) return cat.id;
      }
    }
    return null;
  }

  /* Learns from the user's own past categorization, not just the fixed
     keyword lists: if a merchant name typed now overlaps with one entered
     before (either is a substring of the other, same bidirectional check
     style as the keyword matcher above), reuse whatever category was
     assigned to the most recent matching transaction. Checked first since
     your own past choice for this exact merchant beats a generic keyword
     guess; falls back to suggestCategory() when nothing matches. Requires
     3+ typed characters so early keystrokes don't produce noisy matches. */
  function suggestCategoryFromHistory(merchant) {
    var q = (merchant || "").toLowerCase().trim();
    if (q.length < 3) return null;
    var candidates = state.transactions.filter(function (t) {
      if (t.type !== "expense" || t.isTransfer || !t.categoryId) return false;
      var m = (t.merchant || "").toLowerCase().trim();
      if (!m) return false;
      return m.indexOf(q) !== -1 || q.indexOf(m) !== -1;
    });
    if (!candidates.length) return null;
    candidates.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return candidates[0].categoryId;
  }

  function icon(name, extraClass) {
    return '<svg class="' + (extraClass || "") + '"><use href="#i-' + name + '"/></svg>';
  }

  function badgeHtml(cat, size) {
    var color = categoryColor(cat);
    var s = size || 34;
    return '<div class="badge" style="background:' + color + ';width:' + s + 'px;height:' + s + 'px;font-size:' + (s * 0.34) + 'px">' + monogram(cat ? cat.name : "?") + '</div>';
  }

  function utilStatus(pct) {
    if (pct >= 0.9) return "critical";
    if (pct >= 0.7) return "warning";
    return "good";
  }

  /* ---------- tab / modal chrome ---------- */

  var TAB_META = {
    dashboard: { title: "Dashboard", sub: "Overview" },
    transactions: { title: "Transactions", sub: "All activity" },
    recurring: { title: "Recurring", sub: "Bills & subscriptions" },
    forecast: { title: "Forecast", sub: "Expected monthly payments" },
    loans: { title: "Loans", sub: "Long-term debt payoff" },
    transfer: { title: "Transfer", sub: "Move funds between accounts" },

  var currentTab = "dashboard";

  document.getElementById("appbar-refresh").addEventListener("click", function (e) {

  /* ---------- theme toggle ----------
     The CSS already fully supports a manual override via [data-theme] on
     <html> (built into the original light/dark redesign, alongside the
     prefers-color-scheme default) - this just needed a control. A tiny
     inline script in <head> applies any saved choice before first paint,
     so there's no flash of the wrong theme; this only needs to keep it in
     sync afterward. Not synced to the cloud - display theme is treated as
     a per-device preference, same as how a phone and a laptop can run
     different OS-level appearance settings independently. */
  var THEME_KEY = "ledger.financeTracker.theme";

  function currentTheme() {
    var stored = localStorage.getItem(THEME_KEY);
    if (stored === "light" || stored === "dark") return stored;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function updateThemeToggleIcon(theme) {
    document.getElementById("theme-toggle").innerHTML = icon(theme === "dark" ? "moon" : "sun");
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(THEME_KEY, theme);
    updateThemeToggleIcon(theme);
  }

  updateThemeToggleIcon(currentTheme());
  document.getElementById("theme-toggle").addEventListener("click", function () {
    applyTheme(currentTheme() === "dark" ? "light" : "dark");
  });

  function openModal(html) {
    document.getElementById("modal-sheet").innerHTML = html;
    document.getElementById("modal-overlay").classList.add("open");
  }
  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");
    document.getElementById("modal-sheet").innerHTML = "";
  }
  document.getElementById("modal-overlay").addEventListener("click", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });

  /* Custom confirm dialog — window.confirm() is blocked inside a sandboxed iframe
     (no `allow-modals`), so it silently returns false instead of prompting. */
  function confirmAction(message, confirmLabel, onConfirm) {
    var html = '<div class="modal-head"><h3>Are you sure?</h3></div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2);margin:0 0 18px">' + escapeHtml(message) + '</p>';
    html += '<button type="button" class="btn danger" data-confirm-yes>' + escapeHtml(confirmLabel) + '</button>';
    html += '<button type="button" class="btn plain" style="margin-top:10px" data-confirm-no>Cancel</button>';
    openModal(html);

    html += '<button type="button" class="btn primary" data-ok>OK</button>';
